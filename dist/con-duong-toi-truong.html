<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Con đường tới trường · Tự học Toán 9 – 12</title>
<meta name="description" content="Tự học Toán: ôn thi vào lớp 10 TP.HCM và luyện vận dụng – vận dụng cao lớp 10, 11, 12 với kiến thức trọng tâm, ví dụ mẫu, phiếu in có mã QR lời giải.">
<meta name="theme-color" content="#2f6fe4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fe4'/%3E%3Ctext x='32' y='44' font-size='30' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3E10%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   GIAO DIỆN "vở ô chấm" – cùng phong cách Học mà chơi.
   Chỉ dùng biến màu trên :root (có bộ màu tối). Không viết màu cứng trong component.
   ===================================================================== */
:root{
  --bg:#f3f6fb; --dot:#cfd9e8; --surface:#ffffff; --ink:#14213d; --muted:#556079; --line:#14213d;
  --primary:#2f6fe4; --primary-ink:#ffffff; --primary-soft:#e2ebfd;
  --ok:#17804a; --ok-soft:#e1f5e9; --warn:#8a5a00; --warn-soft:#fff3cf; --bad:#c23636; --bad-soft:#fde7e7;
  --s-blue:#a9c4ec; --s-pink:#efb2c9; --s-yellow:#f4d57a; --accent:#d9480f;
  --grid:#dfe5ee; --shade:#2f6fe433;
  --r-lg:22px; --r-md:14px; --r-pill:999px;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,sans-serif; --f-head:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --shadow:6px 6px 0 var(--line); --shadow-sm:3px 3px 0 var(--line);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1524; --dot:#1f2b44; --surface:#16213a; --ink:#e8eefa; --muted:#a7b3cc; --line:#7f96c4;
  --primary:#6b9bff; --primary-ink:#0e1524; --primary-soft:#1f3160;
  --ok:#5fd394; --ok-soft:#153526; --warn:#f3c95a; --warn-soft:#3a2f10; --bad:#ff8a8a; --bad-soft:#3d1a1d;
  --s-blue:#2c4a7a; --s-pink:#6b3550; --s-yellow:#6b5a22; --accent:#ff9a62; --grid:#24324f; --shade:#6b9bff44;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1524; --dot:#1f2b44; --surface:#16213a; --ink:#e8eefa; --muted:#a7b3cc; --line:#7f96c4;
  --primary:#6b9bff; --primary-ink:#0e1524; --primary-soft:#1f3160;
  --ok:#5fd394; --ok-soft:#153526; --warn:#f3c95a; --warn-soft:#3a2f10; --bad:#ff8a8a; --bad-soft:#3d1a1d;
  --s-blue:#2c4a7a; --s-pink:#6b3550; --s-yellow:#6b5a22; --accent:#ff9a62; --grid:#24324f; --shade:#6b9bff44;
  color-scheme:dark;}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.4px);background-size:22px 22px;
  color:var(--ink);font:500 18px/1.6 var(--f-body);-webkit-tap-highlight-color:transparent;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:8px}
.wrap{max-width:940px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 64px max(16px,env(safe-area-inset-right))}
h2,h3,h4{font-family:var(--f-head);line-height:1.25;margin:0 0 8px}
h2{font-size:clamp(24px,3.6vw,30px)} h3{font-size:22px} h4{font-size:18px}

/* ---------- Đầu trang ---------- */
.top{background:color-mix(in srgb,var(--s-blue) 45%,var(--surface));text-align:center;padding:calc(18px + env(safe-area-inset-top)) 56px 18px;position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:linear-gradient(90deg,var(--s-blue) 0 25%,var(--s-pink) 25% 75%,var(--s-yellow) 75%)}
.brand-link{text-decoration:none}
.brand{font:800 clamp(32px,6vw,46px)/1.1 var(--f-head);margin:0;color:var(--ink)}
.brand span{color:var(--primary)}
.sub{margin:6px 0 4px;font:700 13px/1.35 var(--f-body);letter-spacing:2px;text-transform:uppercase;color:var(--primary)}
.author{margin:0;font-size:14px;color:var(--muted)}
.theme-btn{position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(14px + env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;
  border:2.5px solid var(--line);background:var(--surface);font-size:20px;box-shadow:var(--shadow-sm)}

/* ---------- Thành phần chung ---------- */
.card{background:var(--surface);border:2.5px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px 22px;margin:18px 0}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);border-radius:var(--r-pill);padding:7px 16px;font:700 13px/1.35 var(--f-body);margin:0 0 12px}
.pill.soft{background:var(--primary-soft);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 22px;border-radius:var(--r-pill);border:2.5px solid var(--line);
  background:var(--surface);color:var(--ink);font-weight:700;font-size:17px;text-decoration:none;box-shadow:var(--shadow-sm);transition:transform .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.ghost{box-shadow:none}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.lead{color:var(--muted);margin:6px 0 12px}
.lead.small{font-size:15px}
.warn{background:var(--warn-soft);color:var(--ink);border-left:5px solid var(--warn);border-radius:10px;padding:10px 14px;margin:12px 0 0;font-size:16px}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:var(--r-pill);background:var(--primary-soft);color:var(--ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.sec{margin:34px 0 4px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 4px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;min-height:44px;font-weight:700;text-decoration:none;font-size:18px}
.nav-mini{display:flex;gap:16px;font-weight:700;font-size:16px}
.nav-mini a{text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;background:var(--ink);color:var(--bg);
  padding:12px 20px;border-radius:var(--r-pill);font-weight:700;font-size:15px;transition:.25s;z-index:20;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1}

/* ---------- Trang chủ ---------- */
.hero h2{margin-top:2px}
.steps6{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 18px;padding-left:22px;margin:10px 0}
.hint-line{background:var(--ok-soft);border-radius:12px;padding:10px 14px;margin:12px 0 0;font-weight:600}
.table-wrap{padding:6px;overflow-x:auto}
table.struct{width:100%;border-collapse:collapse;font-size:16px}
table.struct th,table.struct td{text-align:left;padding:10px 12px;border-bottom:1.5px solid var(--grid);vertical-align:top}
table.struct thead th{font-family:var(--f-head);font-size:16px;color:var(--muted)}
table.struct tbody tr:last-child th,table.struct tbody tr:last-child td{border-bottom:0}
table.struct a{font-weight:700;white-space:nowrap}
table.struct th[scope=row]{white-space:nowrap}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:18px;margin-top:14px}
.tcard{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:var(--ink);background:var(--surface);border:2.5px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px 18px;transition:transform .08s}
.tcard:active{transform:translate(3px,3px);box-shadow:var(--shadow-sm)}
.tno{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--primary);color:var(--primary-ink);font:800 22px/1 var(--f-head)}
.tno.big{width:64px;height:64px;font-size:30px;border-radius:18px}
.tbody{display:flex;flex-direction:column;gap:3px;min-width:0}
.tbai{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--primary);margin:0}
.tbai mjx-container,.tbai mjx-container *{text-transform:none}
.ttitle{font:700 20px/1.3 var(--f-head)}
.tdesc{font-size:15px;color:var(--muted);margin:2px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px;margin-top:10px}
.link-card{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink)}
.link-card .big{font-size:30px}
.link-card b{font:700 21px/1.3 var(--f-head)}
.link-card span:last-child{color:var(--muted);font-size:15px}

/* ---------- Trang chủ đề ---------- */
.thead{display:flex;gap:18px;align-items:center}
.thead h2{margin:2px 0 4px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 10px;margin:8px -4px 0;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.tab{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:8px 16px;border-radius:var(--r-pill);border:2.5px solid var(--line);
  background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700;font-size:16px}
.tab.on{background:var(--ink);color:var(--bg)}
.pane-foot{display:flex;justify-content:flex-end;margin-top:22px}
.remind{background:color-mix(in srgb,var(--s-yellow) 30%,var(--surface))}
.remind ul,.kb ul,.tip-b ul,.loi ul,.checks{padding-left:22px;margin:6px 0}
.remind li,.kb li{margin:4px 0}
.kt h3{display:flex;gap:10px;align-items:center}
.kno{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--primary-soft);font-size:17px}
.kb p{margin:8px 0}
.figbox{display:flex;justify-content:center;margin:12px 0 2px}
.fig{width:100%;max-width:340px;height:auto;display:block}
.fig.fig-sm{max-width:220px}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:0 18px}
.tip-key{font:700 21px/1.35 var(--f-head);margin:0 0 6px;color:var(--accent)}
.tip-b{font-size:17px}
.card table:not(.struct){border-collapse:collapse;margin:8px 0;font-size:16px;max-width:100%}
.card table:not(.struct) td,.card table:not(.struct) th{border:1.5px solid var(--grid);padding:5px 10px;text-align:center}
.sheet table:not(.sh-barem){border-collapse:collapse;margin:4px 0}
.sheet table:not(.sh-barem) td,.sheet table:not(.sh-barem) th{border:1px solid #888;padding:2px 8px;text-align:center}
.tbl-wrap{overflow-x:auto}
mjx-container.mjx-wide{display:inline-block;max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle;padding:2px 0}
mjx-container[display="true"].mjx-wide{display:block}
@media print{mjx-container.mjx-wide{overflow:visible;max-width:none}}
.sheet table.tbl{margin:3px 0;font-size:10.5pt}

/* ---------- Trắc nghiệm ---------- */
.qtext{margin:0 0 12px}
.opts{display:grid;gap:10px}
@media (min-width:760px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:54px;padding:10px 14px;border-radius:16px;border:2.5px solid var(--line);background:var(--surface);font-size:17px}
.opt .ol{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--primary-soft);font-weight:800}
.opt.good{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.why{margin-top:12px;background:var(--primary-soft);border-radius:12px;padding:10px 14px;font-size:16px}
.okc{color:var(--ok)} .badc{color:var(--bad)}
.score{text-align:center}
.big-score{font:800 52px/1 var(--f-head);margin:6px 0;color:var(--primary)}

/* ---------- Tự luận mẫu ---------- */
.de{background:var(--primary-soft);border-radius:14px;padding:12px 16px;margin:10px 0}
.reveal-bar{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
.steps{list-style:none;padding:0;margin:8px 0;counter-reset:st}
.steps .part{font:700 18px/1.4 var(--f-head);color:var(--primary);margin:14px 0 4px;padding-top:6px;border-top:2px dashed var(--grid)}
.steps .st{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1.5px solid var(--grid)}
.steps .st-t{flex:1;min-width:0}
.steps .pts{flex:none;min-width:58px;text-align:center;font-weight:800;font-size:15px;background:var(--ok-soft);color:var(--ok);border-radius:var(--r-pill);padding:3px 8px}
.steps .pts.empty{background:none}
.steps .hid{display:none}
.loi{margin-top:16px;background:var(--bad-soft);border-radius:14px;padding:12px 16px}
.loi h4{color:var(--bad)}
.checks{list-style:none;padding:0}
.checks li{padding:6px 0 6px 32px;position:relative}
.checks li::before{content:"✔";position:absolute;left:4px;top:5px;color:var(--ok);font-weight:800}

/* ---------- Phiếu (xem trước) ---------- */
.opts-row{display:flex;flex-direction:column;gap:8px}
.tog{display:flex;gap:10px;align-items:center;min-height:44px;font-size:16px}
.tog input{width:22px;height:22px;accent-color:var(--primary)}
.paper-wrap{margin-top:18px}
.paper-wrap .sh-page{background:#fff;color:#000;border:1.5px solid var(--line);border-radius:6px;box-shadow:var(--shadow-sm);padding:14mm 13mm;margin:0 auto 18px;max-width:210mm}
#print-root{display:none}

/* Nội dung phiếu (dùng chung xem trước + in) */
.sheet{font:12pt/1.45 "Times New Roman",Times,serif;color:#000}
.sh-head{display:flex;justify-content:space-between;gap:8px;font:600 9pt/1.3 var(--f-body);color:#444;border-bottom:1px solid #999;padding-bottom:3px;margin-bottom:6px}
.sh-title{font:700 15pt/1.2 "Times New Roman",serif;text-align:center;margin:4px 0 0}
.sh-sub{text-align:center;font-style:italic;margin:2px 0 6px}
.sh-info{margin:4px 0 6px;font-size:11.5pt}
.sh-remind{border:1px solid #777;border-radius:6px;padding:4px 10px;margin:0 0 8px;font-size:11pt}
.sh-remind ul{margin:2px 0;padding-left:18px;columns:2;column-gap:18px}
.sh-remind li{break-inside:avoid}
.sh-q{margin:8px 0 0;break-inside:avoid}
.sh-q p,.sh-q .sh-de{margin:0 0 4px}
.sh-write{border:1px solid #9aa0aa;background-color:#fff;background-image:linear-gradient(#d3d8e0 1px,transparent 1px),linear-gradient(90deg,#d3d8e0 1px,transparent 1px);
  background-size:5mm 5mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sh-check{margin:8px 0 4px;font-size:10.5pt;display:flex;flex-wrap:wrap;gap:2px 14px;break-inside:avoid}
.sh-check b{width:100%}
.sh-ai{border:1.5px dashed #555;border-radius:6px;padding:5px 10px;font-size:10.5pt;margin-top:6px;break-inside:avoid}
.sh-fig{display:flex;justify-content:center;margin:4px 0}
.sh-fig .fig{max-width:62mm}
.sh-fig .fig.fig-sm{max-width:40mm}
.ld-page .sh-fig .fig{max-height:58mm;width:auto}
.sh-model{margin:6px 0 10px;break-inside:avoid-page}
.sh-model p{margin:0 0 4px}
.sh-steps{margin:2px 0;padding-left:0;list-style:none;font-size:11pt}
.sh-steps li{margin:1px 0;padding-left:12px;position:relative}
.sh-steps li::before{content:"–";position:absolute;left:0}
.sh-steps li.part{padding-left:0;font-weight:700;margin-top:4px}
.sh-steps li.part::before{content:none}
.sh-pt{float:right;font-weight:700;margin-left:10px}
.sh-loi{font-size:10.5pt;border-left:3px solid #999;padding-left:8px}
.sh-key{margin:6px 0 10px;break-inside:avoid}
.sh-key p{margin:0 0 4px}
.sh-barem{width:100%;border-collapse:collapse;font-size:11pt}
.sh-barem td{border:1px solid #888;padding:3px 6px;vertical-align:top}
.sheet .fig .f-grid line{stroke:#ccc}
.sheet .fig .f-stroke,.sheet .fig .f-axis line,.sheet .fig .f-curve{stroke:#000}
.sheet .fig .f-lab,.sheet .fig .f-num,.sheet .fig .f-fill,.sheet .fig .f-dot{fill:#000}
.sheet .fig .f-dash{stroke:#555}
.sheet .fig .f-shade{fill:#cfcfcf;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .fig .f-line2{stroke:#000;stroke-dasharray:6 3}
.sheet .fig .f-acc{fill:#000}

/* ---------- Prompt AI ---------- */
.how{padding-left:22px;margin:8px 0}
.how li{margin:6px 0}
.prompt details{margin:10px 0}
.prompt summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
.prompt pre{white-space:pre-wrap;word-break:break-word;font:13.5px/1.55 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1.5px solid var(--grid);border-radius:12px;padding:12px 14px;max-height:420px;overflow:auto}

/* ---------- Hình SVG ---------- */
.fig .f-grid line{stroke:var(--grid);stroke-width:1}
.fig .f-axis line,.fig .f-axis{stroke:var(--ink);stroke-width:1.4}
.fig .f-fill{fill:var(--ink);stroke:none}
.fig .f-curve{stroke:var(--primary);stroke-width:2.4;fill:none}
.fig .f-line2{stroke:var(--accent);stroke-width:2;fill:none}
.fig .f-stroke{stroke:var(--ink);stroke-width:1.8}
.fig .f-thin{stroke:var(--ink);stroke-width:1.2}
.fig .f-dash{stroke:var(--muted);stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.fig .f-dot{fill:var(--ink)}
.fig .f-shade{fill:var(--shade);stroke:none;fill-rule:evenodd}
.fig .f-lab{fill:var(--ink);font:700 15px var(--f-body)}
.fig .f-acc{fill:var(--accent)}
.fig .f-num{fill:var(--ink);font:600 13px var(--f-body)}

/* ---------- Trang chọn lớp ---------- */
.grade-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:18px;margin-top:6px}
.grade-card{display:flex;gap:16px;align-items:center;text-decoration:none;color:var(--ink);margin:0}
.grade-card.soon{opacity:.72}
.g-big{flex:none;display:grid;place-items:center;width:64px;height:64px;border-radius:18px;background:var(--primary);color:var(--primary-ink);font:800 30px/1 var(--f-head)}
.g-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.g-body b{font:700 21px/1.3 var(--f-head)}
.g-body > span:not(.chips){color:var(--muted);font-size:15px}
.chip.warnc{background:var(--warn-soft);color:var(--warn)}
.empty{color:var(--muted);font-style:italic;margin:6px 0 0}

/* ---------- Lớp 10–12: vận dụng, vận dụng cao ---------- */
.muc{display:inline-block;vertical-align:middle;font:800 13px/1 var(--f-body);letter-spacing:.5px;padding:5px 9px;border-radius:8px;margin-left:6px}
.muc.vd{background:var(--primary-soft);color:var(--primary)}
.muc.vdc{background:var(--bad-soft);color:var(--bad)}
.kt-item + .kt-item{margin-top:14px;padding-top:12px;border-top:1.5px dashed var(--grid)}
.kt-item h4{margin-bottom:4px}
.lg-steps{padding-left:24px;margin:8px 0}
.lg-steps li{margin:6px 0}
.lg-steps li.hid,.ds.hid{display:none}
h3.sub{margin:22px 0 0}
.bt-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 6px}
.tog.small{margin-left:auto;font-size:14px;min-height:36px}
.ds-box{background:var(--ok-soft);border-radius:12px;padding:10px 14px;margin:12px 0 0}
.ds-final{background:var(--ok-soft);border-radius:12px;padding:10px 14px;font-size:18px}
.dang{scroll-margin-top:16px}
.tabs a.tab{flex:none}

/* Phiếu VD–VDC (xem trước + in) */

.sh-kt{font-size:11pt}
.sh-kt-i{margin:2px 0 4px}

.sh-vd{font-size:11pt;margin:4px 0 8px;break-inside:avoid}

.sh-hint{display:flex;gap:8px;align-items:flex-start;min-width:0;font-size:10.5pt;border:1px dashed #777;border-radius:6px;padding:5px 7px;break-inside:avoid}
.sh-hint > div{min-width:0}
.sh-qr{flex:none;width:21mm;height:21mm}

/* ---------- Điện thoại ---------- */
@media (max-width:560px){
  body{font-size:17px}
  .card{padding:16px;border-radius:18px;box-shadow:4px 4px 0 var(--line)}
  .thead{align-items:flex-start}
  .tno.big{width:52px;height:52px;font-size:24px}
  .btn{width:100%}
  .row .btn{width:auto;flex:1 1 140px}

}

/* ---------- In ---------- */
@page{size:A4;margin:11mm 12mm}
@media print{
  body.printing{background:#fff !important}
  body.printing > *:not(#print-root){display:none !important}
  body.printing #print-root{display:block}
  #print-root .sh-page{break-after:page;page-break-after:always}
  #print-root .sh-page:last-child{break-after:auto;page-break-after:auto}
  #print-root .sheet{font-size:12pt}
}

.ld-howto{font-size:10.5pt;margin:4px 0 6px}

<script>/* config.js */
/* =====================================================================
   CẤU HÌNH CHUNG – sửa tên web, người soạn, năm thi, đường link AI tại đây.
   ===================================================================== */
window.CONFIG = {

  sub: 'Tự học Toán · Ôn thi vào 10 · Lớp 10 – 11 – 12',
  author: 'Người soạn: thầy Vũ Tiến Lực',
  year: '2026 – 2027',

  ],

  // khi phiếu được in từ máy (mở tệp trực tiếp). In từ trang web thật thì tự dùng địa chỉ trang đó.
  siteUrl: '',
  storeKey: 'vao10',                         // tiền tố khoá localStorage

<script>/* assets/js/core.js */
/* =====================================================================
   CORE – sổ đăng ký chủ đề và các tiện ích dùng chung.
   Nội dung chủ đề nằm trong data/cdNN-*.js, mỗi tệp gọi Topics.add({...}).
   Công thức viết LaTeX trong \( … \) (trong dòng) hoặc \[ … \] (riêng dòng).
   Trong tệp dữ liệu nên viết chuỗi bằng S`…` (= String.raw) để KHÔNG phải gấp đôi dấu \.
   ===================================================================== */
const S = String.raw;

const Topics = (() => {
  const list = [];
  const REQUIRED = ['id', 'no', 'bai', 'title', 'desc', 'remind', 'theory', 'tips', 'quiz', 'models', 'present', 'practice'];
  function add(t) {
    REQUIRED.forEach(k => { if (t[k] === undefined) console.warn('Chủ đề thiếu trường', k, t.id); });
    list.push(t);
    list.sort((a, b) => a.no - b.no);
  }
  const get = id => list.find(t => t.id === id);
  return { add, get, list };
})();

/* ---------- Tiện ích ---------- */
const U = (() => {
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  function h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }

  // Lưu trữ an toàn (trình duyệt chặn localStorage thì vẫn chạy).
  const KEY = k => `${(window.CONFIG && CONFIG.storeKey) || 'vao10'}:${k}`;
  function get(k, d) { try { const v = localStorage.getItem(KEY(k)); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
  function set(k, v) { try { localStorage.setItem(KEY(k), JSON.stringify(v)); } catch (e) { /* bỏ qua */ } }

  function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }

  // Số điểm kiểu Việt Nam: 0.25 → "0,25".
  const pt = x => (Math.round(x * 100) / 100).toString().replace('.', ',');
  const sum = arr => arr.reduce((s, x) => s + x, 0);

  // HTML có công thức → văn bản thuần cho prompt AI: \( \) → $ $, bỏ thẻ, giữ xuống dòng.
  function plain(html) {
    let s = String(html)
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/(p|div|li|tr|h\d)>/gi, '\n')
      .replace(/<li[^>]*>/gi, '- ')
      .replace(/<td[^>]*>/gi, ' | ')
      .replace(/<sup>(.*?)<\/sup>/gi, '^$1')
      .replace(/<[^>]+>/g, '')
      .replace(/\\\(\s*/g, '$').replace(/\s*\\\)/g, '$')
      .replace(/\\\[\s*/g, '$$$$').replace(/\s*\\\]/g, '$$$$');
    const t = document.createElement('textarea'); t.innerHTML = s; s = t.value;
    return s.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', '');
      t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
      t.remove(); return ok;
    }
  }

  function toast(msg) {
    let el = $('#toast'); if (!el) { el = h('<div id="toast" role="status" aria-live="polite"></div>'); document.body.appendChild(el); }
    el.textContent = msg; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2200);
  }

  return { esc, $, $$, h, get, set, shuffle, pt, sum, plain, copy, toast };
})();

</script>
<script>/* assets/js/figures.js */
/* =====================================================================
   FIGURES – hình vẽ SVG (trả về chuỗi). Màu lấy từ class f-* trong style.css
   nên tự đổi theo chế độ tối và in ra đen trắng.
   - Fig.parab({...})  hệ trục + parabol y = ax² (+ đường thẳng, các điểm)
   - Fig.geo({...})    hình phẳng: điểm, đoạn, đường tròn, góc vuông (toạ độ thực, y hướng lên)
   - Fig.solid(kind)   hình khối: 'tru', 'non', 'cau', 'kem', 'coc-bi'
   ===================================================================== */
const Fig = (() => {
  const f2 = x => Math.round(x * 100) / 100;
  const num = x => String(x).replace('.', ',').replace('-', '−');

  /* ---------- Parabol ---------- */
  function parab(o) {
    const a = o.a, [x0, x1] = o.xr || [-5, 5], [y0, y1] = o.yr || [-1, 9];
    const W = o.w || 300, u = W / (x1 - x0), H = f2((y1 - y0) * u);
    const X = x => f2((x - x0) * u), Y = y => f2((y1 - y) * u);
    let s = `<svg class="fig" viewBox="-14 -14 ${W + 28} ${H + 28}" role="img" aria-label="${o.label || 'Đồ thị'}">`;
    // lưới
    s += '<g class="f-grid">';
    for (let x = Math.ceil(x0); x <= x1; x++) s += `<line x1="${X(x)}" y1="0" x2="${X(x)}" y2="${H}"/>`;
    for (let y = Math.ceil(y0); y <= y1; y++) s += `<line x1="0" y1="${Y(y)}" x2="${W}" y2="${Y(y)}"/>`;
    s += '</g>';
    // trục
    s += `<g class="f-axis"><line x1="0" y1="${Y(0)}" x2="${W + 8}" y2="${Y(0)}"/><line x1="${X(0)}" y1="${H}" x2="${X(0)}" y2="-8"/>`;
    s += `<path d="M${W + 8} ${Y(0)}l-7 -4v8z" class="f-fill"/><path d="M${X(0)} -8l-4 7h8z" class="f-fill"/></g>`;
    s += `<text class="f-lab" x="${W + 4}" y="${Y(0) + 16}">x</text><text class="f-lab" x="${X(0) + 8}" y="0">y</text>`;
    s += `<text class="f-lab" x="${X(0) - 14}" y="${Y(0) + 15}">O</text>`;
    // vạch số
    (o.ticksX || []).forEach(x => { s += `<line class="f-axis" x1="${X(x)}" y1="${Y(0) - 3}" x2="${X(x)}" y2="${Y(0) + 3}"/><text class="f-num" x="${X(x)}" y="${Y(0) + 15}" text-anchor="middle">${num(x)}</text>`; });
    (o.ticksY || []).forEach(y => { s += `<line class="f-axis" x1="${X(0) - 3}" y1="${Y(y)}" x2="${X(0) + 3}" y2="${Y(y)}"/><text class="f-num" x="${X(0) - 6}" y="${Y(y) + 4}" text-anchor="end">${num(y)}</text>`; });
    // parabol
    let d = '';
    for (let i = 0; i <= 200; i++) {
      const x = x0 + (x1 - x0) * i / 200, y = a * x * x;
      if (y < y0 - 0.5 || y > y1 + 0.5) continue;
      d += (d ? 'L' : 'M') + X(x) + ' ' + Y(y);
    }
    s += `<path class="f-curve" d="${d}"/>`;
    if (o.line) {
      const { m, n } = o.line;
      s += `<line class="f-line2" x1="${X(x0)}" y1="${Y(m * x0 + n)}" x2="${X(x1)}" y2="${Y(m * x1 + n)}"/>`;
      if (o.lineLabel) s += `<text class="f-lab f-acc" x="${X(o.lineLabel[0])}" y="${Y(o.lineLabel[1])}">${o.lineLabel[2]}</text>`;
    }
    (o.pts || []).forEach(([x, y, lab, dx = 6, dy = -6]) => {
      s += `<line class="f-dash" x1="${X(x)}" y1="${Y(y)}" x2="${X(x)}" y2="${Y(0)}"/><line class="f-dash" x1="${X(x)}" y1="${Y(y)}" x2="${X(0)}" y2="${Y(y)}"/>`;
      s += `<circle class="f-dot" cx="${X(x)}" cy="${Y(y)}" r="3.6"/>`;
      if (lab) s += `<text class="f-lab" x="${X(x) + dx}" y="${Y(y) + dy}">${lab}</text>`;
    });
    if (o.name) s += `<text class="f-lab f-acc" x="${X(o.name[0])}" y="${Y(o.name[1])}">${o.name[2]}</text>`;
    return s + '</svg>';
  }

  /* ---------- Hình phẳng ---------- */
  function geo(o) {
    const P = o.pts, names = Object.keys(P);
    const xs = [], ys = [];
    names.forEach(k => { xs.push(P[k][0]); ys.push(P[k][1]); });
    (o.circles || []).forEach(c => { const [cx, cy] = typeof c.c === 'string' ? P[c.c] : c.c; xs.push(cx - c.r, cx + c.r); ys.push(cy - c.r, cy + c.r); });
    const mx = Math.min(...xs), Mx = Math.max(...xs), my = Math.min(...ys), My = Math.max(...ys);
    const W = o.w || 300, pad = 26, u = (W - 2 * pad) / (Mx - mx || 1), H = f2((My - my) * u + 2 * pad);
    const X = x => f2(pad + (x - mx) * u), Y = y => f2(pad + (My - y) * u);
    const at = k => (Array.isArray(k) ? k : P[k]);
    let s = `<svg class="fig" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label || 'Hình vẽ'}">`;
    (o.fill || []).forEach(f => { s += `<path class="f-shade" d="${f(X, Y, P, u)}"/>`; });
    (o.circles || []).forEach(c => { const [cx, cy] = typeof c.c === 'string' ? P[c.c] : c.c; s += `<circle class="${c.dash ? 'f-dash' : 'f-stroke'}" cx="${X(cx)}" cy="${Y(cy)}" r="${f2(c.r * u)}" fill="none"/>`; });
    const seg = (cls, list) => (list || '').split(/\s+/).filter(Boolean).forEach(pq => {
      const [p, q] = pq.length === 2 ? [pq[0], pq[1]] : pq.split('-');
      const A = at(p), B = at(q);
      s += `<line class="${cls}" x1="${X(A[0])}" y1="${Y(A[1])}" x2="${X(B[0])}" y2="${Y(B[1])}"/>`;
    });
    seg('f-stroke', o.segs); seg('f-dash', o.dash); seg('f-line2', o.acc);
    // góc vuông: [P, đỉnh, Q]
    (o.rights || []).forEach(([p, v, q]) => {
      const V = at(v), A = at(p), B = at(q), k = (o.rs || 0.22) * (o.rsUnit || 1);
      const ua = [A[0] - V[0], A[1] - V[1]], ub = [B[0] - V[0], B[1] - V[1]];
      const la = Math.hypot(...ua), lb = Math.hypot(...ub);
      const a1 = [V[0] + ua[0] / la * k, V[1] + ua[1] / la * k], b1 = [V[0] + ub[0] / lb * k, V[1] + ub[1] / lb * k];
      const c1 = [a1[0] + ub[0] / lb * k, a1[1] + ub[1] / lb * k];
      s += `<path class="f-thin" d="M${X(a1[0])} ${Y(a1[1])}L${X(c1[0])} ${Y(c1[1])}L${X(b1[0])} ${Y(b1[1])}" fill="none"/>`;
    });
    // điểm và nhãn
    const cx = names.reduce((t, k) => t + P[k][0], 0) / names.length, cy = names.reduce((t, k) => t + P[k][1], 0) / names.length;
    const dots = (o.dots || '').split(/\s+/).filter(Boolean);
    names.forEach(k => {
      if ((o.hide || '').split(/\s+/).includes(k)) return;
      const [x, y] = P[k];
      let dx, dy;
      if (o.lab && o.lab[k]) [dx, dy] = o.lab[k];
      else { const vx = x - cx, vy = y - cy, l = Math.hypot(vx, vy) || 1; dx = vx / l * 14; dy = -vy / l * 14; }
      if (dots.includes(k)) s += `<circle class="f-dot" cx="${X(x)}" cy="${Y(y)}" r="2.8"/>`;
      s += `<text class="f-lab" x="${f2(X(x) + dx)}" y="${f2(Y(y) + dy + 5)}" text-anchor="middle">${k}</text>`;
    });
    (o.texts || []).forEach(([x, y, t]) => { s += `<text class="f-num" x="${X(x)}" y="${Y(y)}" text-anchor="middle">${t}</text>`; });
    return s + '</svg>';
  }

  /* ---------- Hình khối ---------- */
  function solid(kind, t = {}) {
    const lab = (x, y, s, a = 'middle') => `<text class="f-num" x="${x}" y="${y}" text-anchor="${a}">${s}</text>`;
    let s = '<svg class="fig fig-sm" viewBox="0 0 240 230" role="img" aria-label="Hình khối">';
    if (kind === 'tru') {
      s += '<ellipse class="f-stroke" cx="120" cy="40" rx="70" ry="18" fill="none"/>';
      s += '<path class="f-stroke" d="M50 40V190M190 40V190" fill="none"/>';
      s += '<path class="f-stroke" d="M50 190A70 18 0 0 0 190 190" fill="none"/><path class="f-dash" d="M50 190A70 18 0 0 1 190 190" fill="none"/>';
      s += '<line class="f-dash" x1="120" y1="40" x2="120" y2="190"/><line class="f-dash" x1="120" y1="190" x2="190" y2="190"/>';
      s += lab(155, 184, t.r || 'r') + lab(128, 120, t.h || 'h', 'start');
    } else if (kind === 'non') {
      s += '<path class="f-stroke" d="M120 20L50 190M120 20L190 190" fill="none"/>';
      s += '<path class="f-stroke" d="M50 190A70 18 0 0 0 190 190" fill="none"/><path class="f-dash" d="M50 190A70 18 0 0 1 190 190" fill="none"/>';
      s += '<line class="f-dash" x1="120" y1="20" x2="120" y2="190"/><line class="f-dash" x1="120" y1="190" x2="190" y2="190"/>';
      s += lab(155, 184, t.r || 'r') + lab(126, 120, t.h || 'h', 'start') + lab(170, 100, t.l || 'l', 'start');
    } else if (kind === 'cau') {
      s += '<circle class="f-stroke" cx="120" cy="115" r="85" fill="none"/>';
      s += '<path class="f-stroke" d="M35 115A85 22 0 0 0 205 115" fill="none"/><path class="f-dash" d="M35 115A85 22 0 0 1 205 115" fill="none"/>';
      s += '<circle class="f-dot" cx="120" cy="115" r="3"/><line class="f-dash" x1="120" y1="115" x2="205" y2="115"/>';
      s += lab(162, 108, t.r || 'R');
    } else if (kind === 'kem') {
      s += '<path class="f-stroke" d="M60 95A60 60 0 0 1 180 95" fill="none"/>';
      s += '<path class="f-stroke" d="M60 95A60 14 0 0 0 180 95" fill="none"/><path class="f-dash" d="M60 95A60 14 0 0 1 180 95" fill="none"/>';
      s += '<path class="f-stroke" d="M60 95L120 220L180 95" fill="none"/>';
      s += '<line class="f-dash" x1="120" y1="95" x2="120" y2="220"/><line class="f-dash" x1="120" y1="95" x2="180" y2="95"/>';

      s += '<path class="f-stroke" d="M50 30V200M190 30V200M50 200A70 14 0 0 0 190 200" fill="none"/>';
      s += '<path class="f-shade" d="M50 90A70 14 0 0 0 190 90V200A70 14 0 0 1 50 200Z"/>';
      s += '<ellipse class="f-thin" cx="120" cy="90" rx="70" ry="14" fill="none"/>';

  /* ---------- Mặt phẳng toạ độ: đường thẳng ax + by = c, miền tô, các đỉnh ----------

    const X = x => f2((x - x0) * u), Y = y => f2((y1 - y) * u), st = o.step || 1;
    let s = `<svg class="fig" viewBox="-16 -16 ${W + 32} ${H + 32}" role="img" aria-label="${o.label || 'Miền nghiệm'}">`;
    s += '<g class="f-grid">';
    for (let x = Math.ceil(x0 / st) * st; x <= x1; x += st) s += `<line x1="${X(x)}" y1="0" x2="${X(x)}" y2="${H}"/>`;
    for (let y = Math.ceil(y0 / st) * st; y <= y1; y += st) s += `<line x1="0" y1="${Y(y)}" x2="${W}" y2="${Y(y)}"/>`;
    s += '</g>';
    if (o.poly) s += `<path class="f-shade" d="M${o.poly.map(([x, y]) => `${X(x)} ${Y(y)}`).join('L')}Z"/>`;
    s += `<g class="f-axis"><line x1="0" y1="${Y(0)}" x2="${W + 8}" y2="${Y(0)}"/><line x1="${X(0)}" y1="${H}" x2="${X(0)}" y2="-8"/>`;
    s += `<path d="M${W + 8} ${Y(0)}l-7 -4v8z" class="f-fill"/><path d="M${X(0)} -8l-4 7h8z" class="f-fill"/></g>`;
    s += `<text class="f-lab" x="${W + 4}" y="${Y(0) + 16}">x</text><text class="f-lab" x="${X(0) + 8}" y="-2">y</text><text class="f-lab" x="${X(0) - 14}" y="${Y(0) + 15}">O</text>`;
    for (let x = Math.ceil(x0 / st) * st; x <= x1 - st / 2; x += st) if (x) s += `<text class="f-num" x="${X(x)}" y="${Y(0) + 15}" text-anchor="middle">${num(x)}</text>`;
    for (let y = Math.ceil(y0 / st) * st; y <= y1 - st / 2; y += st) if (y) s += `<text class="f-num" x="${X(0) - 6}" y="${Y(y) + 4}" text-anchor="end">${num(y)}</text>`;
    (o.lines || []).forEach(({ a, b, c, lab }) => {
      let p;
      if (Math.abs(b) < 1e-12) p = [[c / a, y0], [c / a, y1]];

    s += `<rect class="f-stroke" x="2" y="2" width="${W - 4}" height="${H - 4}" rx="8" fill="none"/>`;
    const sh = new Set(o.shade || []);

      if (reg !== 'out') s += `<circle cx="${C[inn[0]][0]}" cy="${C[inn[0]][1]}" r="${r}" fill="#fff"/>`;
      (reg === 'out' ? keys : outs).forEach(k => { s += `<circle cx="${C[k][0]}" cy="${C[k][1]}" r="${r}" fill="#000"/>`; });
      s += '</mask>';
      inn.slice(1).forEach((k, j) => { s += `<clipPath id="${id}c${j}"><circle cx="${C[k][0]}" cy="${C[k][1]}" r="${r}"/></clipPath>`; });
      s += '</defs>';
      let rect = `<rect class="f-shade" x="0" y="0" width="${W}" height="${H}" mask="url(#${id})"/>`;
      if (reg !== 'out') inn.slice(1).forEach((k, j) => { rect = `<g clip-path="url(#${id}c${j})">${rect}</g>`; });
      s += rect;
    });
    keys.forEach((k, i) => {
      s += `<circle class="f-stroke" cx="${C[k][0]}" cy="${C[k][1]}" r="${r}" fill="none"/>`;
      const lx = C[k][0] + (k === 'a' ? -r + 6 : k === 'b' ? r - 14 : r - 6), ly = C[k][1] + (k === 'c' ? r - 4 : -r + 14);
      s += `<text class="f-lab" x="${lx}" y="${ly}">${o.sets[i]}</text>`;
    });
    Object.entries(o.vals || {}).forEach(([k, v]) => { if (P[k]) s += `<text class="f-num" x="${P[k][0]}" y="${P[k][1] + 4}" text-anchor="middle">${v}</text>`; });
    return s + '</svg>';
  }

  /* ---------- Đồ thị hàm số y = f(x) (dùng cho hàm số lượng giác, mô hình thực tế) ----------
     o = { f, xr:[x0,x1], yr:[y0,y1], w, h, xt:[[giá trị, 'nhãn'], …], yt:[[giá trị,'nhãn'],…], pts:[[x,y,'nhãn',dx,dy]],
           hl:[y…] (đường ngang nét đứt), xl:'x', yl:'y' } */
  function func(o) {
    const [x0, x1] = o.xr, [y0, y1] = o.yr, W = o.w || 320, H = o.h || 180;
    const X = x => f2((x - x0) / (x1 - x0) * W), Y = y => f2((y1 - y) / (y1 - y0) * H);
    let s = `<svg class="fig" viewBox="-36 -16 ${W + 58} ${H + 34}" role="img" aria-label="${o.label || 'Đồ thị'}">`;
    const ox = x0 <= 0 && x1 >= 0 ? X(0) : 0, oy = y0 <= 0 && y1 >= 0 ? Y(0) : H;
    (o.hl || []).forEach(y => { s += `<line class="f-dash" x1="0" y1="${Y(y)}" x2="${W}" y2="${Y(y)}"/>`; });
    s += `<g class="f-axis"><line x1="0" y1="${oy}" x2="${W + 10}" y2="${oy}"/><line x1="${ox}" y1="${H}" x2="${ox}" y2="-10"/>`;
    s += `<path d="M${W + 10} ${oy}l-7 -4v8z" class="f-fill"/><path d="M${ox} -10l-4 7h8z" class="f-fill"/></g>`;
    s += `<text class="f-lab" x="${W + 6}" y="${oy + 16}">${o.xl || 'x'}</text><text class="f-lab" x="${ox + 8}" y="-4">${o.yl || 'y'}</text>`;
    (o.xt || []).forEach(([x, t]) => { s += `<line class="f-axis" x1="${X(x)}" y1="${oy - 3}" x2="${X(x)}" y2="${oy + 3}"/><text class="f-num" x="${X(x)}" y="${oy + 15}" text-anchor="middle">${t}</text>`; });
    (o.yt || []).forEach(([y, t]) => { s += `<line class="f-axis" x1="${ox - 3}" y1="${Y(y)}" x2="${ox + 3}" y2="${Y(y)}"/><text class="f-num" x="${ox - 6}" y="${Y(y) + 4}" text-anchor="end">${t}</text>`; });
    let d = '';
    for (let i = 0; i <= 300; i++) { const x = x0 + (x1 - x0) * i / 300, y = o.f(x); d += (i ? 'L' : 'M') + X(x) + ' ' + Y(y); }
    s += `<path class="f-curve" d="${d}"/>`;
    (o.pts || []).forEach(([x, y, lab, dx = 6, dy = -6]) => { s += `<circle class="f-dot" cx="${X(x)}" cy="${Y(y)}" r="3.4"/>${lab ? `<text class="f-lab" x="${X(x) + dx}" y="${Y(y) + dy}">${lab}</text>` : ''}`; });
    return s + '</svg>';
  }

  return { parab, geo, solid, plane, venn, func };
})();

            | (str.charCodeAt(i) & 0x3ff));
          utf8.push(0xf0 | (charcode >>18),
              0x80 | ((charcode>>12) & 0x3f),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
      }
      return utf8;
    }
    return toUTF8Array(s);
  };

}();

(function (factory) {
  if (typeof define === 'function' && define.amd) {
      define([], factory);
  } else if (typeof exports === 'object') {
      module.exports = factory();

    return qrcode;
}));

<script>/* assets/js/vdc.js */
/* =====================================================================
   VDC – Luyện VẬN DỤNG và VẬN DỤNG CAO cho lớp 10, 11, 12 (học sinh khá giỏi,
   lấy điểm cao giữa kì và cuối kì). Nạp TRƯỚC data/lop10/*.js… và TRƯỚC app.js.

   Đường link:
   #/lop10                 danh sách chủ đề theo kì (Giữa kì I, Cuối kì I, Giữa kì II, Cuối kì II)
   #/lop10/<mã>            trang chủ đề: kiến thức trọng tâm → từng dạng (phương pháp, ví dụ mẫu, bài tương tự)
   #/lop10/<mã>/phieu      phiếu PDF: kiến thức trọng tâm, đề luyện tập có dòng kẻ, gợi ý phương pháp + mã QR ở cuối
   #/lop10/<mã>/lg/<n>     lời giải bài n (đích của mã QR, đọc tốt trên điện thoại)

   Hợp đồng dữ liệu (một chủ đề = một tệp data/lopN/*.js):
   Vdc.add({ grade:'lop10', id:'ma-khong-dau', ky:['Giữa kì I', …], chuong:'Chương …', bai:'Bài …',
     title:S`…`, desc:'…', nguon:'tên tệp trong tai-lieu/ (bắt buộc khi có tài liệu)', mau:true? (nội dung minh họa),
     kt:[{t, b, fig?}],                                      // kiến thức trọng tâm
     dang:[{ ten, muc:'VD'|'VDC'|'VD – VDC', pp:['bước…'],   // phương pháp
             vd:[{ de, fig?, lg:['bước…'], ds }],            // ví dụ mẫu (lời giải đầy đủ)
             bt:[{ muc:'VD'|'VDC', de, figQ?, fig?, goiY, lg:['bước…'], ds, dong }] }] })   // bài tương tự
   ===================================================================== */
const Vdc = (() => {
  const GRADES = {
    lop10: { name: 'Toán 10', short: 'Lớp 10' },
    lop11: { name: 'Toán 11', short: 'Lớp 11' },
    lop12: { name: 'Toán 12', short: 'Lớp 12' },
  };
  const KY = ['Giữa kì I', 'Cuối kì I', 'Giữa kì II', 'Cuối kì II'];
  const list = [];
  function add(t) {
    ['grade', 'id', 'ky', 'title', 'kt', 'dang'].forEach(k => { if (t[k] === undefined) console.warn('Chủ đề VDC thiếu', k, t.id); });
    let n = 0; t.dang.forEach(d => d.bt.forEach(b => { b.n = ++n; b.dang = d; }));
    list.push(t);
  }
  const get = (g, id) => list.find(t => t.grade === g && t.id === id);
  const ofGrade = g => list.filter(t => t.grade === g);
  const allBt = t => t.dang.flatMap(d => d.bt);

  /* ---------- Địa chỉ web cho mã QR ---------- */
  function siteBase() {
    if (typeof location !== 'undefined' && /^https?:$/.test(location.protocol) && !/^(localhost|127\.)/.test(location.hostname))
      return location.origin + location.pathname;
    return (window.CONFIG && CONFIG.siteUrl) || '';
  }
  const lgUrl = (t, b, base) => `${base}#/${t.grade}/${t.id}/lg/${b.n}`;
  function qrSvg(text) {
    if (typeof qrcode === 'undefined') return '';
    qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    const n = q.getModuleCount();
    let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
    return `<svg class="qr" viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" role="img" aria-label="Mã QR lời giải"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }

  /* ---------- Tiến độ ---------- */
  const doneKey = (t, b) => `vdc:${t.grade}:${t.id}:${b.n}`;

  /* ---------- Các trang ---------- */
  const { esc, $, $$, h, get: sget, set: sset } = U;
  const view = () => $('#view');
  const chip = m => `<span class="muc ${m === 'VDC' ? 'vdc' : 'vd'}">${esc(m)}</span>`;
  const steps = arr => `<ol class="lg-steps">${arr.map(s => `<li>${s}</li>`).join('')}</ol>`;

  function gradePage(g) {
    const G = GRADES[g], ts = ofGrade(g);
    const sec = KY.map(k => {
      const items = ts.filter(t => t.ky.includes(k));
      const cards = items.map(t => {
        const bt = allBt(t), done = bt.filter(b => sget(doneKey(t, b), false)).length;
        return `<a class="tcard" href="#/${g}/${t.id}"><span class="tno">${t.dang.length}</span><span class="tbody">
          <span class="tbai">${esc(t.chuong || '')}</span><span class="ttitle">${t.title}</span><span class="tdesc">${t.desc}</span>
          <span class="chips"><span class="chip">${t.dang.length} dạng · ${bt.length} bài</span>${done ? `<span class="chip ok">Đã làm ${done}/${bt.length}</span>` : ''}${t.mau ? '<span class="chip warnc">Mẫu minh họa</span>' : ''}</span></span></a>`;
      }).join('');
      return `<h2 class="sec">${k}</h2>${items.length ? `<div class="tgrid">${cards}</div>` : '<p class="empty">Đang soạn theo tài liệu của thầy.</p>'}`;
    }).join('');
    view().innerHTML = `${App.topBar()}<main class="wrap"><div class="toolbar"><a class="back" href="#/">← Chọn lớp</a></div>
      <section class="card hero"><p class="pill">🎯 ${esc(G.name)} · Vận dụng – Vận dụng cao</p><h2>Lấy điểm cao giữa kì và cuối kì</h2>
      <p>Dành cho học sinh khá, giỏi. Mỗi chủ đề gồm các <b>dạng</b> hay ra ở phần vận dụng: đọc <b>kiến thức trọng tâm</b>, xem <b>ví dụ mẫu</b>, tự làm <b>bài tương tự</b>; in <b>phiếu PDF</b> làm trên giấy, bí thì xem <b>gợi ý</b> cuối phiếu, làm xong <b>quét mã QR</b> để so lời giải.</p></section>
      ${sec}</main>`;
  }

  function topicPage(t) {
    let html = `${App.topBar()}<main class="wrap"><div class="toolbar"><a class="back" href="#/${t.grade}">← ${esc(GRADES[t.grade].name)}</a>
      <a class="btn primary" href="#/${t.grade}/${t.id}/phieu">🖨️ Phiếu PDF</a></div>
      <section class="thead card"><span class="tno big">${t.dang.length}</span><div><p class="tbai">${esc(t.chuong || '')}${t.bai ? ' · ' + esc(t.bai) : ''}</p><h2>${t.title}</h2>
      <p class="tdesc">${t.desc}</p><p class="chips">${t.ky.map(k => `<span class="chip">${esc(k)}</span>`).join('')}${t.mau ? '<span class="chip warnc">Mẫu minh họa – sẽ thay theo tài liệu của thầy</span>' : ''}</p></div></section>
      <nav class="tabs" aria-label="Các phần">${['<a class="tab" href="#kt">📘 Kiến thức</a>'].concat(t.dang.map((d, i) => `<a class="tab" href="#dang-${i + 1}">Dạng ${i + 1}</a>`)).join('')}</nav>
      <section class="card remind" id="kt"><h3>Kiến thức trọng tâm</h3>${t.kt.map(k => `<div class="kt-item"><h4>${k.t}</h4><div class="kb">${k.b}</div>${k.fig ? `<div class="figbox">${k.fig}</div>` : ''}</div>`).join('')}</section>`;
    t.dang.forEach((d, i) => {
      html += `<section class="dang" id="dang-${i + 1}"><h2 class="sec">Dạng ${i + 1}. ${d.ten} ${chip(d.muc)}</h2>
        <article class="card"><h3>Phương pháp</h3>${steps(d.pp)}</article>
        ${d.vd.map((v, j) => `<article class="card model vd-card"><p class="pill soft">Ví dụ mẫu ${j + 1}</p><div class="de">${v.de}</div>${v.fig ? `<div class="figbox">${v.fig}</div>` : ''}
          <div class="reveal-bar"><button class="btn" type="button" data-step>👣 Hiện từng bước</button><button class="btn ghost" type="button" data-all>Hiện toàn bộ</button></div>
          <ol class="lg-steps rv">${v.lg.map(s => `<li class="hid">${s}</li>`).join('')}</ol><p class="ds hid"><b>Đáp số:</b> ${v.ds}</p></article>`).join('')}
        <h3 class="sub">Bài tương tự</h3>
        ${d.bt.map(b => `<article class="card bt-card" data-n="${b.n}"><p class="bt-head"><b>Bài ${b.n}</b> ${chip(b.muc)}
            <label class="tog small"><input type="checkbox" data-done="${b.n}" ${sget(doneKey(t, b), false) ? 'checked' : ''}> Em đã làm được</label></p>
          <div class="de">${b.de}</div>${b.figQ ? `<div class="figbox">${b.figQ}</div>` : ''}
          <div class="row"><button class="btn" type="button" data-show="hint">💡 Gợi ý</button><button class="btn" type="button" data-show="ds">✅ Đáp số</button><a class="btn ghost" href="#/${t.grade}/${t.id}/lg/${b.n}">📖 Lời giải</a></div>
          <p class="warn hint" hidden>💡 ${b.goiY}</p><p class="ds-box" hidden><b>Đáp số:</b> ${b.ds}</p></article>`).join('')}
      </section>`;
    });
    html += `<div class="pane-foot"><a class="btn primary" href="#/${t.grade}/${t.id}/phieu">🖨️ In phiếu luyện tập</a></div></main>`;
    view().innerHTML = html;
    $$('.vd-card').forEach(card => {
      const items = $$('.rv > li', card), ds = $('.ds', card);
      let k = 0;
      const show = n => { k = n; items.forEach((li, i) => li.classList.toggle('hid', i >= n)); ds.classList.toggle('hid', n < items.length); };
      $('[data-step]', card).addEventListener('click', () => show(Math.min(k + 1, items.length)));
      $('[data-all]', card).addEventListener('click', () => show(items.length));
    });
    $$('.bt-card').forEach(card => {
      $$('[data-show]', card).forEach(btn => btn.addEventListener('click', () => {
        const el = $(btn.dataset.show === 'hint' ? '.hint' : '.ds-box', card); el.hidden = !el.hidden;
      }));
      const cb = $('[data-done]', card);
      cb.addEventListener('change', () => { const b = allBt(t).find(x => x.n === +cb.dataset.done); sset(doneKey(t, b), cb.checked); });
    });
    $$('.tabs a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); const el = document.getElementById(a.getAttribute('href').slice(1)); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }));
  }

  function lgPage(t, n) {
    const b = allBt(t).find(x => x.n === n);
    if (!b) return topicPage(t);
    const bt = allBt(t), prev = bt[n - 2], next = bt[n];
    view().innerHTML = `${App.topBar()}<main class="wrap lg-page"><div class="toolbar"><a class="back" href="#/${t.grade}/${t.id}">← Về chủ đề</a>
        <span class="nav-mini">${prev ? `<a href="#/${t.grade}/${t.id}/lg/${prev.n}">‹ Bài ${prev.n}</a>` : ''}${next ? `<a href="#/${t.grade}/${t.id}/lg/${next.n}">Bài ${next.n} ›</a>` : ''}</span></div>
      <section class="card"><p class="tbai">${esc(GRADES[t.grade].name)} · ${t.title}</p><h2>Lời giải Bài ${b.n} ${chip(b.muc)}</h2>
        <p class="lead small">Dạng: ${b.dang.ten}</p><div class="de">${b.de}</div>${b.fig || b.figQ ? `<div class="figbox">${b.fig || b.figQ}</div>` : ''}
        <p class="warn">💡 <b>Phương pháp:</b> ${b.goiY}</p>
        <h3>Lời giải</h3>${steps(b.lg)}<p class="ds-final"><b>Đáp số:</b> ${b.ds}</p></section>
      <section class="card"><h3>Tự chấm</h3><p>So từng bước với bài của em. Sai ở bước nào thì xem lại <a href="#/${t.grade}/${t.id}">ví dụ mẫu của dạng này</a> rồi làm lại bài trên phiếu.</p>
        <label class="tog"><input type="checkbox" id="lgDone" ${sget(doneKey(t, b), false) ? 'checked' : ''}> Em đã làm đúng bài này</label></section></main>`;
    $('#lgDone').addEventListener('change', e => sset(doneKey(t, b), e.target.checked));
  }

  /* ---------- Phiếu PDF ---------- */
  function sheetHTML(t, o) {
    const base = siteBase(), G = GRADES[t.grade];
    const head = `<div class="sh-head"><span>CON ĐƯỜNG TỚI TRƯỜNG · ${esc(G.name.toUpperCase())} · VẬN DỤNG – VẬN DỤNG CAO</span><span>${esc(t.ky.join(' · '))}</span></div>`;
    let s = `<section class="sh-page">${head}<h1 class="sh-title">PHIẾU LUYỆN TẬP</h1><p class="sh-sub">${t.title}</p>
      <p class="sh-info">Họ và tên: .......................................................... Lớp: .............. Ngày: ......../......../........</p>
      <div class="sh-kt"><p class="sh-h">KIẾN THỨC TRỌNG TÂM</p>${t.kt.map(k => `<div class="sh-kt-i"><b>${k.t}.</b> ${k.b}</div>`).join('')}</div>`;
    if (o.vd) s += `<p class="sh-h">VÍ DỤ MẪU</p>${t.dang.map((d, i) => d.vd.map(v => `<div class="sh-vd"><div class="sh-de"><b>Dạng ${i + 1} – Ví dụ.</b> ${v.de}</div>${v.fig ? `<div class="sh-fig">${v.fig}</div>` : ''}<ol class="sh-lg">${v.lg.map(x => `<li>${x}</li>`).join('')}</ol><p><b>Đáp số:</b> ${v.ds}</p></div>`).join('')).join('')}`;
    s += `<p class="sh-h">ĐỀ LUYỆN TẬP</p>`;
    t.dang.forEach((d, i) => {
      s += `<p class="sh-dang">Dạng ${i + 1}. ${d.ten}</p>`;
      d.bt.forEach(b => {
        s += `<div class="sh-q"><div class="sh-de"><b>Bài ${b.n}</b> <i>(${esc(b.muc)})</i>. ${b.de}</div>${b.figQ ? `<div class="sh-fig">${b.figQ}</div>` : ''}<div class="sh-lines">${'<i></i>'.repeat(b.dong || 8)}</div></div>`;
      });
    });
    const qrNote = base ? `Quét mã QR để xem lời giải từng bài.` : `Chưa có địa chỉ web nên chưa in được mã QR – thầy điền <code>siteUrl</code> trong config.js sau khi đưa web lên mạng.`;
    s += `<div class="sh-hints"><p class="sh-h">GỢI Ý PHƯƠNG PHÁP <span class="sh-note">(chỉ xem khi đã tự làm mà vẫn bí · ${qrNote})</span></p><div class="sh-hgrid">
      ${allBt(t).map(b => `<div class="sh-hint">${base && o.qr ? `<div class="sh-qr">${qrSvg(lgUrl(t, b, base))}</div>` : ''}<div><b>Bài ${b.n}.</b> ${b.goiY}</div></div>`).join('')}</div></div></section>`;
    return `<div class="sheet math">${s}</div>`;
  }

  function sheetPage(t) {
    const o = Object.assign({ vd: false, qr: true }, sget('vdcSheet', {}));
    view().innerHTML = `${App.topBar()}<main class="wrap"><div class="toolbar"><a class="back" href="#/${t.grade}/${t.id}">← Về chủ đề</a></div>
      <div class="card sheet-tools"><h2>Phiếu luyện tập · ${t.title}</h2>
        <p class="lead">Phiếu A4: kiến thức trọng tâm, ${allBt(t).length} bài vận dụng có dòng kẻ để làm, cuối phiếu là gợi ý phương pháp và mã QR lời giải từng bài.</p>
        <div class="opts-row"><label class="tog"><input type="checkbox" id="oVd" ${o.vd ? 'checked' : ''}> Kèm ví dụ mẫu có lời giải</label>
        <label class="tog"><input type="checkbox" id="oQr" ${o.qr ? 'checked' : ''}> In mã QR lời giải</label></div>
        <div class="row"><button class="btn primary" type="button" id="printBtn">🖨️ In / Lưu PDF</button></div></div>
      <div class="paper-wrap" id="paper"></div></main>`;
    const draw = () => { $('#paper').innerHTML = sheetHTML(t, sget('vdcSheet', o)); };
    draw();
    ['oVd', 'oQr'].forEach(k => $('#' + k).addEventListener('change', () => { sset('vdcSheet', { vd: $('#oVd').checked, qr: $('#oQr').checked }); draw(); }));
    $('#printBtn').addEventListener('click', async () => {
      const btn = $('#printBtn'); btn.disabled = true; btn.textContent = 'Đang chuẩn bị…';
      await MathTS.done($('#paper'));
      let root = $('#print-root'); if (!root) { root = h('<div id="print-root"></div>'); document.body.appendChild(root); }
      root.innerHTML = $('#paper').innerHTML; document.body.classList.add('printing');
      const end = () => { document.body.classList.remove('printing'); root.innerHTML = ''; btn.disabled = false; btn.textContent = '🖨️ In / Lưu PDF'; window.removeEventListener('afterprint', end); };
      window.addEventListener('afterprint', end);
      setTimeout(() => { window.print(); setTimeout(() => { if (document.body.classList.contains('printing')) end(); }, 1500); }, 60);
    });
  }

  /* ---------- Điều hướng: parts = ['lop10', mã?, 'phieu'|'lg'?, n?] ---------- */
  function route(parts) {
    const g = parts[0];
    if (!GRADES[g]) return false;
    const t = parts[1] && get(g, parts[1]);
    if (!t) gradePage(g);
    else if (parts[2] === 'phieu') sheetPage(t);
    else if (parts[2] === 'lg') lgPage(t, +parts[3]);
    else topicPage(t);
    return true;
  }

  return { add, get, list, ofGrade, allBt, GRADES, KY, route, sheetHTML, qrSvg, lgUrl, siteBase };
})();

</script>
<script>/* assets/js/luyende.js */
/* =====================================================================
   LUYỆN ĐỀ – mỗi chủ đề ôn thi vào 10 có 10, 20… đề luyện đúng dạng, đúng số điểm
   của bài tương ứng trong đề tuyển sinh TP.HCM. Mỗi đề in thành một tệp PDF A4:
   trang 1 là đề + khung ô li để làm, [trang Gợi ý từng nấc nếu đề có], trang cuối (tuỳ chọn) là đáp án – hướng dẫn chấm.
   Tab "📝 Luyện đề" của chủ đề: #/cd/<mã>/de  ·  một đề: #/cd/<mã>/de/<k>
   Bộ có Thẻ công cụ (the): #/cd/<mã>/de/the (thẻ in một trang) · #/cd/<mã>/de/tuduy (luyện tư duy 10 phút mỗi ngày)

   Hợp đồng dữ liệu (data/vao-10/luyen-de/ldNN-*.js, nạp SAU tệp chủ đề):
   LuyenDe.add('<mã chủ đề>', {
     phut: 12,                         // thời gian gợi ý cho một đề
     soat: ['…'],                      // (tuỳ chọn) 4 ý tự soát in cuối trang đề
     the: [{ id, ten, cc }],           // (tuỳ chọn) Thẻ công cụ: dạng kết luận → công cụ
     giam: [7, 14],                    // (tuỳ chọn) giảm dần gợi ý: đề ≤ 7 đủ 3 nấc, ≤ 14 còn 2 nấc, sau đó 1 nấc
     de: [{ ten:'Dạng …', nguon:'tệp đề gốc (dạng tham khảo)', pts:1, h:70 (mm ô li),
            de, figQ?, fig?, ans, barem:[[bước, điểm]…], loi:['lỗi hay bị trừ điểm'…],
            goi?: [nấc 1 Nhận dạng, nấc 2 Hướng đi, nấc 3 Khung lời giải],   // gợi ý từng nấc
            q?, ch?, cc?: ['mã công cụ'…], part? } ×10k] })                  // dùng cho Luyện tư duy
   ===================================================================== */
const LuyenDe = (() => {
  const store = {};
  const SOAT = ['Gọi ẩn có đơn vị, điều kiện', 'Lập đúng phương trình / hệ', 'Giải đúng, đối chiếu điều kiện', 'Trả lời đủ câu hỏi, có đơn vị'];
  const NAC = ['Nhận dạng', 'Hướng đi', 'Khung lời giải'];
  const ASK = ['Kết luận thuộc dạng nào? (tra Thẻ công cụ)', 'Câu trước đã cho mình điều gì?', 'Đoạn thẳng, góc nào có mặt ở cả hai vế?', 'Trên hình còn góc vuông, tam giác cân, tiếp tuyến nào chưa dùng?'];
  const add = (id, o) => { store[id] = o; };
  const get = id => store[id];
  const ids = () => Object.keys(store);
  const pt = x => String(x).replace('.', ',');
  const sum = a => a.reduce((s, x) => s + x, 0);
  const baiOf = t => t.bai.split('·')[0].trim();
  // số nấc gợi ý được in cho đề k (giảm dần để học sinh quen tự suy luận)
  const nac = (L, k) => !L.giam ? 3 : k <= L.giam[0] ? 3 : k <= L.giam[1] ? 2 : 1;
  const nacNote = L => L.giam ? `đề 1–${L.giam[0]}: 3 nấc · đề ${L.giam[0] + 1}–${L.giam[1]}: 2 nấc · từ đề ${L.giam[1] + 1}: chỉ còn Nấc 1` : '';
  const pages = (L, k, o = {}) => 1 + (o.goi !== false && L.de[k - 1].goi ? 1 : 0) + (o.key ? 1 : 0);

  function pageDe(t, L, k) {
    const d = L.de[k - 1];
    return `<section class="sh-page ld-page">
      <div class="sh-head"><span>CON ĐƯỜNG TỚI TRƯỜNG · LUYỆN ĐỀ TUYỂN SINH 10 – MÔN TOÁN</span><span>Đề số ${k}/${L.de.length}${d.goi ? ' · bí thì lật trang Gợi ý' : ''}</span></div>
      <h1 class="sh-title">ĐỀ LUYỆN SỐ ${k} – ${baiOf(t).toUpperCase()} (${pt(d.pts.toFixed(1))} điểm)</h1>
      <p class="sh-sub">${t.title} · ${d.ten} · Thời gian gợi ý: ${L.phut || 12} phút</p>
      <p class="sh-info">Họ và tên: ........................................................ Lớp: .............. Ngày: ......../......../........ Điểm: ......../${pt(d.pts)}</p>
      <div class="sh-q"><div class="sh-de"><b>${baiOf(t)}.</b> <i>(${pt(d.pts.toFixed(1))} điểm)</i> ${d.de}</div>${d.figQ ? `<div class="sh-fig">${d.figQ}</div>` : ''}
        <div class="sh-write" style="height:${d.h || 70}mm"></div></div>
      <div class="sh-check"><b>Tự soát:</b> ${(L.soat || SOAT).map(x => `<span>☐ ${x}</span>`).join('')}</div>

  function theTable(L, withEx) {

      return Object.keys(m).sort().map(p => `7${p}: ${m[p].length >= 20 ? 'mọi đề' : m[p].join(', ')}`).join('<br>') || '—';
    };

    return `<section class="sh-page ld-page">
      <div class="sh-head"><span>GỢI Ý TỪNG NẤC – CHỈ MỞ KHI BÍ</span><span>Đề số ${k}/${L.de.length} · ${baiOf(t)}</span></div>
      <h1 class="sh-title">GỢI Ý ĐỀ LUYỆN SỐ ${k}</h1><p class="sh-sub">${d.ten}</p>
      <p class="ld-howto"><b>Cách dùng:</b> tự làm ít nhất 5 phút. Bí thì che trang, chỉ đọc <b>Nấc 1</b> rồi làm tiếp; 3 phút sau vẫn bí mới đọc nấc tiếp theo. Đánh dấu ☑ nấc đã mở để biết mình cần luyện dạng nào. Gợi ý giảm dần qua các đề (${nacNote(L)}).</p>
      <div class="ld-ask"><b>Tự hỏi trước khi mở gợi ý:</b> ${ASK.map((x, i) => `<span>${i + 1}) ${x}</span>`).join(' ')}</div>
      ${[0, 1, 2].map(box).join('')}
      ${L.the ? `<div class="ld-the-mini"><b>Thẻ công cụ</b> – nhìn kết luận, chọn công cụ:${theTable(L, false)}</div>` : ''}
    </section>`;
  }
  function pageKey(t, L, k) {
    const d = L.de[k - 1];
    return `<section class="sh-page ld-page">
      <div class="sh-head"><span>ĐÁP ÁN – HƯỚNG DẪN CHẤM</span><span>Đề số ${k}/${L.de.length} · ${baiOf(t)}</span></div>
      <h1 class="sh-title">ĐÁP ÁN ĐỀ LUYỆN SỐ ${k}</h1><p class="sh-sub">${d.ten}</p>
      <div class="sh-key"><p><b>Đáp số:</b> ${d.ans}</p>${d.fig ? `<div class="sh-fig">${d.fig}</div>` : ''}
        <table class="sh-barem"><tbody>${d.barem.map(([s, x]) => `<tr><td>${s}</td><td class="num">${pt(x)}</td></tr>`).join('')}
          <tr><td><b>Tổng</b></td><td class="num"><b>${pt(sum(d.barem.map(b => b[1])))}</b></td></tr></tbody></table>
        ${(d.loi || []).length ? `<p class="sh-loi"><b>Hay bị trừ điểm:</b> ${d.loi.join(' · ')}</p>` : ''}
        <p class="ld-src">Dạng bài tham khảo: ${d.nguon} (số liệu đã đổi).</p></div>
    </section>`;
  }
  // o.key: kèm trang đáp án; o.goi (mặc định có): kèm trang gợi ý nếu đề có; ks: danh sách số đề (mặc định cả bộ)
  function sheetHTML(t, o = {}, ks) {
    const L = get(t.id); if (!L) return '';
    ks = ks || L.de.map((_, i) => i + 1);
    return `<div class="sheet math">${ks.map(k => pageDe(t, L, k) + (o.goi !== false && L.de[k - 1].goi ? pageGoi(t, L, k) : '') + (o.key ? pageKey(t, L, k) : '')).join('')}</div>`;
  }
  // Thẻ công cụ in một trang (dán vào vở)
  function theHTML(t) {
    const L = get(t.id); if (!L || !L.the) return '';
    return `<div class="sheet math"><section class="sh-page ld-page">
      <div class="sh-head"><span>CON ĐƯỜNG TỚI TRƯỜNG · BÀI 7 HÌNH HỌC PHẲNG</span><span>Thẻ công cụ – dán vào vở</span></div>
      <h1 class="sh-title">THẺ CÔNG CỤ: NHÌN KẾT LUẬN – CHỌN CÔNG CỤ</h1>
      <p class="sh-sub">Dùng cho câu 7a, 7b, 7c · chỉ dùng cách lập luận được phép theo quy định chấm thống nhất</p>
      <div class="ld-ask"><b>Phân tích ngược 4 bước:</b> <span>1) Gạch chân kết luận, xếp nó vào một dòng của thẻ.</span> <span>2) Đánh dấu trên hình mọi góc vuông, mọi đoạn bằng nhau (bán kính, tiếp tuyến, trung điểm).</span> <span>3) Hỏi: câu trước cho mình gì? Câu b thường dùng câu a, câu c thường dùng tỉ số của câu b.</span> <span>4) Viết ngược "muốn có … cần … ; muốn có … cần …", rồi trình bày xuôi.</span></div>
      ${theTable(L, true)}
      <p class="sh-loi"><b>Không được viện dẫn, phải chứng minh lại:</b> ba dấu hiệu tứ giác nội tiếp (thay bằng "bốn điểm cách đều một điểm") · hệ thức cạnh – đường cao trong tam giác vuông (thay bằng tam giác đồng dạng) · "đường kính vuông góc với dây thì đi qua trung điểm" (thay bằng tam giác cân) · tính chất đường phân giác ngoài.</p>
    </section></div>`;
  }

  async function printHTML(html, btn) {
    const lab = btn.textContent; btn.disabled = true; btn.textContent = 'Đang chuẩn bị…';
    let root = document.getElementById('print-root');
    if (!root) { root = document.createElement('div'); root.id = 'print-root'; document.body.appendChild(root); }
    root.innerHTML = html;
    await MathTS.done(root);
    document.body.classList.add('printing');
    const end = () => { document.body.classList.remove('printing'); root.innerHTML = ''; btn.disabled = false; btn.textContent = lab; window.removeEventListener('afterprint', end); };
    window.addEventListener('afterprint', end);
    setTimeout(() => { window.print(); setTimeout(() => { if (document.body.classList.contains('printing')) end(); }, 1500); }, 60);
  }

  const isDone = (id, k) => !!(U.get('ld:' + id, {})[k]);
  const setDone = (id, k, v) => { const o = U.get('ld:' + id, {}); o[k] = v; U.set('ld:' + id, o); };

  function pane(t, el, sel) {
    const L = get(t.id);
    if (!L) { el.innerHTML = '<div class="card empty"><p>Bộ 10 đề luyện của chủ đề này đang được soạn. Thầy cô sẽ bổ sung sớm.</p></div>'; return; }
    if (L.the && sel === 'the') return paneThe(t, el, L);
    if (L.the && sel === 'tuduy') return paneTuDuy(t, el, L);
    const total = L.de.length, done = L.de.filter((_, i) => isDone(t.id, i + 1)).length;
    const k = Math.min(Math.max(parseInt(sel, 10) || 1, 1), total), d = L.de[k - 1];
    const hasGoi = L.de.some(x => x.goi);
    el.innerHTML = `<div class="card sheet-tools">
        <p class="lead"><b>${total} đề luyện</b> đúng dạng ${baiOf(t)} của đề tuyển sinh. Mỗi đề in thành <b>một tệp PDF</b>: trang đề có khung ô li để làm,${hasGoi ? ' trang <b>Gợi ý từng nấc</b> (giảm dần qua các đề),' : ''} trang sau là đáp án – hướng dẫn chấm. Làm đúng giờ (${L.phut || 12} phút/đề), tự chấm theo barem, sai ở đâu xem lại tab Tự luận mẫu.</p>
        ${L.the ? `<div class="row ld-tools"><a class="btn" href="#/cd/${t.id}/de/tuduy">🧠 Luyện tư duy hôm nay (10 phút)</a><a class="btn" href="#/cd/${t.id}/de/the">📇 Thẻ công cụ</a></div>` : ''}
        <p class="chips"><span class="chip">Đã làm ${done}/${total}</span></p>
        <div class="ld-list">${L.de.map((x, i) => `<a class="ld-item${i + 1 === k ? ' on' : ''}${isDone(t.id, i + 1) ? ' ok' : ''}" href="#/cd/${t.id}/de/${i + 1}"><b>Đề ${i + 1}</b><span>${x.ten}</span></a>`).join('')}</div>
        <div class="opts-row">${hasGoi ? '<label class="tog"><input type="checkbox" id="ldGoi" checked> Kèm trang gợi ý từng nấc</label>' : ''}<label class="tog"><input type="checkbox" id="ldKey"> Kèm đáp án – hướng dẫn chấm (trang cuối mỗi đề)</label>
          <label class="tog"><input type="checkbox" id="ldDone" ${isDone(t.id, k) ? 'checked' : ''}> Em đã làm xong Đề ${k}</label></div>
        <div class="row"><button class="btn primary" type="button" id="ldOne">🖨️ In / Lưu PDF Đề ${k}</button><button class="btn" type="button" id="ldAll">🖨️ In cả ${total} đề</button></div></div>
      ${d.goi ? `<div class="card ld-hint"><h3>💡 Gợi ý từng nấc cho Đề ${k}</h3><p class="muted">Tự làm ít nhất 5 phút rồi mới mở. Đề này có ${nac(L, k)} nấc${L.giam ? ` (${nacNote(L)})` : ''}.</p><div id="ldNac"></div><button class="btn" type="button" id="ldNext">Mở Nấc 1 – ${NAC[0]}</button></div>` : ''}
      <div class="paper-wrap" id="paper"></div>`;
    const $i = id => document.getElementById(id);
    const opt = () => ({ key: $i('ldKey').checked, goi: $i('ldGoi') ? $i('ldGoi').checked : false });
    const draw = () => { $i('paper').innerHTML = sheetHTML(t, opt(), [k]); };
    draw();
    $i('ldKey').addEventListener('change', draw);
    if ($i('ldGoi')) $i('ldGoi').addEventListener('change', draw);
    $i('ldDone').addEventListener('change', e => { setDone(t.id, k, e.target.checked); pane(t, el, k); });
    $i('ldOne').addEventListener('click', e => printHTML(sheetHTML(t, opt(), [k]), e.currentTarget));
    $i('ldAll').addEventListener('click', e => printHTML(sheetHTML(t, opt()), e.currentTarget));
    if (d.goi) {
      let open = 0; const n = nac(L, k);
      $i('ldNext').addEventListener('click', e => {
        $i('ldNac').insertAdjacentHTML('beforeend', `<div class="ld-nac"><div class="ld-nac-h">Nấc ${open + 1} – ${NAC[open]}</div><div>${d.goi[open]}</div></div>`);
        open++;
        if (open >= n) { e.currentTarget.disabled = true; e.currentTarget.textContent = n < 3 ? 'Đề này chỉ có ' + n + ' nấc – tự đi tiếp nhé' : 'Đã mở hết 3 nấc'; }
        else e.currentTarget.textContent = `Mở Nấc ${open + 1} – ${NAC[open]}`;
      });
    }
  }

  function paneThe(t, el, L) {
    el.innerHTML = `<div class="card sheet-tools"><p class="lead"><b>📇 Thẻ công cụ</b> – in ra dán vào vở. Khi bí, nhìn kết luận, tìm dòng tương ứng để biết dùng công cụ nào. Cột cuối là các đề luyện dùng công cụ đó.</p>
      <div class="row"><a class="btn" href="#/cd/${t.id}/de">← Về danh sách đề</a><a class="btn" href="#/cd/${t.id}/de/tuduy">🧠 Luyện tư duy hôm nay</a><button class="btn primary" type="button" id="ldThePrint">🖨️ In / Lưu PDF thẻ</button></div></div>
      <div class="paper-wrap">${theHTML(t)}</div>`;
    document.getElementById('ldThePrint').addEventListener('click', e => printHTML(theHTML(t), e.currentTarget));
  }

  /* ---------- 🧠 Luyện tư duy 10 phút mỗi ngày: chọn công cụ cho kết luận + sắp xếp các bước lời giải ---------- */
  const KEY_TD = 'ld:tuduy';
  const today = () => ymd(new Date());
  const rng = s => { let h = 1779033703; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 3432918353), h = h << 13 | h >>> 19;
    return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; }; };
  const shuffle = (a, r) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const ymd = x => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
  // số ngày luyện liên tiếp tính tới hôm nay (hôm nay chưa luyện thì tính tới hôm qua)
  function streak(st) {
    const x = new Date(); if (!st.days[ymd(x)]) x.setDate(x.getDate() - 1);
    let n = 0; while (st.days[ymd(x)]) { n++; x.setDate(x.getDate() - 1); }
    return n;
  }
  function pickDay(L, st, variant) {
    const r = rng(today() + ':' + variant);
    const pool = [];
    ids().filter(i => get(i).the).forEach(i => get(i).de.forEach((d, j) => { if (d.cc && d.q) pool.push({ id: i, k: j + 1, d }); }));
    const weak = it => Math.min(1, Math.max(0, ...it.d.cc.map(c => (st.sai[c] || 0) - (st.dung[c] || 0) / 2)) / 3);
    const ranked = shuffle(pool.filter(x => x.d.part !== 'c'), r).map(x => [x, r() + 0.7 * weak(x)]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
    const tools = [], seen = new Set();
    for (const x of ranked) { const key = x.d.ch; if (seen.has(key)) continue; seen.add(key); tools.push(x); if (tools.length === 4) break; }
    const order = shuffle(pool.filter(x => !seen.has(x.d.ch)), r).slice(0, 2);
    return [...tools.map(x => ({ type: 'cc', ...x })), ...order.map(x => ({ type: 'xep', ...x, perm: shuffle(x.d.barem.map((_, n) => n), r) }))];
  }
  function paneTuDuy(t, el, L, variant = 0) {
    const st = Object.assign({ days: {}, sai: {}, dung: {} }, U.get(KEY_TD, {}));
    const items = pickDay(L, st, variant), name = id => (L.the.find(x => x.id === id) || {}).ten || id;
    const weakTop = Object.keys(st.sai).filter(k => (st.sai[k] || 0) > (st.dung[k] || 0) / 2).sort((a, b) => st.sai[b] - st.sai[a]).slice(0, 2);
    const res = items.map(() => null);
    el.innerHTML = `<div class="card sheet-tools"><p class="lead"><b>🧠 Luyện tư duy hôm nay</b> – 10 phút, 6 câu: 4 câu <b>chọn công cụ</b> cho kết luận (theo Thẻ công cụ), 2 câu <b>sắp xếp các bước</b> lời giải. Bài mỗi ngày tự đổi, ưu tiên dạng em hay chọn sai.</p>
      <p class="chips"><span class="chip">Chuỗi ngày luyện: ${streak(st)} 🔥</span><span class="chip">Đã luyện ${Object.keys(st.days).length} ngày</span>${weakTop.length ? `<span class="chip warnc">Cần luyện thêm: ${weakTop.map(name).join(', ')}</span>` : ''}</p>
      <div class="row"><a class="btn" href="#/cd/${t.id}/de">← Về danh sách đề</a><a class="btn" href="#/cd/${t.id}/de/the">📇 Thẻ công cụ</a><button class="btn" type="button" id="tdNew">🔄 Bài khác</button></div></div>
      ${items.map((it, i) => `<div class="card td-card" data-i="${i}">
        <p class="td-h"><span class="chip">Câu ${i + 1}/6</span> ${it.type === 'cc' ? 'Kết luận này cần dùng công cụ nào? <i>(chọn một)</i>' : 'Sắp xếp các bước lời giải theo đúng thứ tự <i>(chạm lần lượt)</i>'}</p>
        <details class="td-gt"><summary>Xem giả thiết và hình (Đề ${it.k} · ${it.id.replace('hinh-', 'Bài ')})</summary><div>${it.d.ch}</div>${it.d.figQ || it.d.fig ? `<div class="sh-fig td-fig">${it.d.figQ || it.d.fig}</div>` : ''}</details>
        <p class="td-q"><b>${it.d.part})</b> ${it.d.q}</p>
        ${it.type === 'cc' ? `<div class="td-tools">${L.the.map(x => `<button type="button" class="td-opt" data-id="${x.id}">${x.ten}</button>`).join('')}</div>`
          : `<ol class="td-pick"></ol><div class="td-steps">${it.perm.map(j => `<button type="button" class="td-step" data-j="${j}">${it.d.barem[j][0]}</button>`).join('')}</div><button type="button" class="btn ghost td-reset">Chọn lại</button>`}
        <div class="td-fb" aria-live="polite"></div></div>`).join('')}
      <div class="card td-sum" id="tdSum" hidden></div>`;
    const save = () => U.set(KEY_TD, st);
    const finish = () => {
      if (res.some(x => x === null)) return;
      const diem = res.filter(Boolean).length;
      st.days[today()] = { diem: Math.max(diem, (st.days[today()] || {}).diem || 0), n: res.length }; save();
      const box = document.getElementById('tdSum'); box.hidden = false;
      box.innerHTML = `<h3>Hoàn thành hôm nay: ${diem}/${res.length} câu đúng</h3><p>${diem >= 5 ? 'Rất tốt! Ngày mai luyện tiếp để giữ chuỗi ngày.' : 'Đọc lại Thẻ công cụ ở các dòng em chọn sai, rồi làm một đề 7b có gợi ý nấc 1.'} Chuỗi ngày luyện: <b>${streak(st)}</b> 🔥</p>`;
    };
    el.querySelectorAll('.td-card').forEach(card => {
      const i = +card.dataset.i, it = items[i], fb = card.querySelector('.td-fb');
      if (it.type === 'cc') {
        card.querySelectorAll('.td-opt').forEach(b => b.addEventListener('click', () => {
          if (res[i] !== null) return;
          const ok = it.d.cc.includes(b.dataset.id); res[i] = ok;
          b.classList.add(ok ? 'good' : 'bad');
          card.querySelectorAll('.td-opt').forEach(x => { if (it.d.cc.includes(x.dataset.id)) x.classList.add('good'); x.disabled = true; });
          it.d.cc.forEach(c => { if (ok) st.dung[c] = (st.dung[c] || 0) + 1; else st.sai[c] = (st.sai[c] || 0) + 1; }); save();

          finish();
        }));
      } else {
        const pick = [], ol = card.querySelector('.td-pick');
        const reset = () => { if (res[i] !== null) return; pick.length = 0; ol.innerHTML = ''; card.querySelectorAll('.td-step').forEach(b => { b.disabled = false; b.classList.remove('used'); }); };
        card.querySelector('.td-reset').addEventListener('click', reset);
        card.querySelectorAll('.td-step').forEach(b => b.addEventListener('click', () => {
          if (res[i] !== null || b.disabled) return;

            const ok = pick.every((j, n) => j === n); res[i] = ok;

            fb.innerHTML = `<p><b>${ok ? 'Đúng thứ tự!' : 'Chưa đúng thứ tự.'}</b>${ok ? ' Lập luận đi từ giả thiết tới kết luận.' : ' Thứ tự đúng:'}</p>${ok ? '' : `<ol class="td-right">${it.d.barem.map(x => `<li>${x[0]}</li>`).join('')}</ol>`}`;
            finish();
          }
        }));
      }
    });
    document.getElementById('tdNew').addEventListener('click', () => paneTuDuy(t, el, L, variant + 1));
  }

  return { add, get, ids, sheetHTML, theHTML, pages, pane };
})();

</script>
<script>/* assets/js/math.js */
/* =====================================================================
   MATH – cấu hình MathJax 3 (bản đặt sẵn trong assets/vendor/mathjax, chạy không cần mạng)
   và tự vẽ công thức mỗi khi nội dung trang đổi. Nạp TRƯỚC tex-chtml.js.
   ===================================================================== */
window.MathJax = {
  loader: { load: [] },
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']], processEscapes: false },
  chtml: { scale: 1.02, matchFontHeight: false, displayAlign: 'left', displayIndent: '0' },
  options: { enableMenu: false, ignoreHtmlClass: 'no-math', processHtmlClass: 'math' },
  startup: {
    typeset: false,
    ready() {
      MathJax.startup.defaultReady();
      MathJax.startup.promise.then(() => MathTS.start());
    },
  },
};

const MathTS = (() => {
  const queued = new Set(); let timer = null, busy = Promise.resolve(), started = false;
  const HAS = /\\\(|\\\[/;
  function flush() {
    timer = null;
    const nodes = [...queued]; queued.clear();
    if (!window.MathJax || !MathJax.typesetPromise) return;
    busy = busy.then(async () => {
      for (const n of nodes) {
        if (!n.isConnected || !HAS.test(n.textContent)) continue;
        try { await MathJax.typesetPromise([n]); fit(n); }
        catch (e) { if (n.isConnected) setTimeout(() => add(n), 30); }
      }
    });
  }
  // Công thức dài hơn khung (điện thoại): cho cuộn ngang riêng công thức đó, trang không bị tràn.
  function fit(root) {
    (root || document.body).querySelectorAll('mjx-container').forEach(c => {
      c.classList.remove('mjx-wide');
      const box = c.parentElement && c.parentElement.closest('li, p, div, td, th, section, article');
      const inner = c.firstElementChild, w = Math.max(c.getBoundingClientRect().width, inner ? inner.getBoundingClientRect().width : 0);
      if (box && w > box.clientWidth + 1) c.classList.add('mjx-wide');
    });
  }
  let rz = null;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => fit(document.body), 150); });
  function add(n) {
    if (!n || n.nodeType !== 1) n = n && n.parentElement;
    if (!n || n.closest('mjx-container')) return;
    queued.add(n); if (!timer) timer = setTimeout(flush, 0);
  }
  function start() {
    started = true;
    add(document.body);
    new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(add)))
      .observe(document.body, { childList: true, subtree: true });
  }
  // Chờ vẽ xong công thức trong một vùng (dùng trước khi in). Không có MathJax thì trả về ngay.
  async function done(node) {
    for (let i = 0; i < 100 && !started; i++) await new Promise(r => setTimeout(r, 100));
    if (!window.MathJax || !MathJax.typesetPromise) return;
    await busy;
    try { await MathJax.typesetPromise([node || document.body]); fit(node); } catch (e) { /* bỏ qua */ }
  }
  return { start, typeset: add, done, fit };
})();

Topics.add({
  id: 'pt-bac-hai-viete', no: 2, bai: 'Bài 2 · 1 điểm',
  title: 'Phương trình bậc hai – điều kiện có nghiệm, định lí Viète',
  desc: 'Xét dấu Δ để biết số nghiệm; dùng Viète tính giá trị biểu thức của hai nghiệm mà không giải phương trình.',
  remind: [
    S`\(\Delta = b^2 - 4ac\); \(b = 2b'\) thì \(\Delta' = b'^2 - ac\).`,
    S`\(\Delta \gt 0\): 2 nghiệm phân biệt; \(\Delta = 0\): nghiệm kép; \(\Delta \lt 0\): vô nghiệm.`,
    S`\(a \cdot c \lt 0 \Rightarrow\) luôn có 2 nghiệm phân biệt trái dấu.`,
    S`Viète: \(S = x_1 + x_2 = -\dfrac{b}{a}\), \(P = x_1 x_2 = \dfrac{c}{a}\).`,

  theory: [
    { t: 'Số nghiệm theo biệt thức',
      b: S`<p>Phương trình \(ax^2 + bx + c = 0\ (a \ne 0)\), biệt thức \(\Delta = b^2 - 4ac\).</p>

        <tr><td>\(\Delta \gt 0\)</td><td>2 nghiệm phân biệt</td><td>\(x_{1,2} = \dfrac{-b \pm \sqrt\Delta}{2a}\)</td></tr>
        <tr><td>\(\Delta = 0\)</td><td>nghiệm kép</td><td>\(x_1 = x_2 = -\dfrac{b}{2a}\)</td></tr>
        <tr><td>\(\Delta \lt 0\)</td><td>vô nghiệm</td><td>—</td></tr></table>
        <p>Khi \(b = 2b'\) (hệ số b chẵn) dùng \(\Delta' = b'^2 - ac\), nghiệm \(x_{1,2} = \dfrac{-b' \pm \sqrt{\Delta'}}{a}\).</p>` },
    { t: 'Điều kiện có nghiệm',
      b: S`<ul><li>Có nghiệm \(\iff \Delta \ge 0\) (hoặc \(\Delta' \ge 0\)).</li><li>Có 2 nghiệm phân biệt \(\iff \Delta \gt 0\).</li>
        <li>Nếu \(a \cdot c \lt 0\) thì \(\Delta = b^2 - 4ac \gt 0\): phương trình chắc chắn có 2 nghiệm phân biệt, trái dấu.</li></ul>`,
      warn: S`Phương trình có tham số m: tìm điều kiện có nghiệm TRƯỚC, cuối bài phải đối chiếu giá trị m tìm được với điều kiện đó.` },

    { t: 'Biểu thức đối xứng – đưa về S và P',

        <tr><td>\(x_1^3 + x_2^3\)</td><td>\(S^3 - 3SP\)</td></tr></table>
        <p><b>Biểu thức không đối xứng</b> (ví dụ có \(x_1^2\) mà không có \(x_2^2\)): dùng \(x_1\) là nghiệm, \(a x_1^2 = -b x_1 - c\), để hạ bậc rồi mới dùng Viète.</p>` },

    { t: 'Không đối xứng thì hạ bậc', b: S`Thay \(x_1^2\) bằng \(\dfrac{-b x_1 - c}{a}\) (vì \(x_1\) là nghiệm) rồi gom về \(S, P\).` },

    { q: S`\(x_1^2 + x_2^2\) viết theo \(S, P\) là`, a: [S`\(S^2 - 2P\)`, S`\(S^2 + 2P\)`, S`\(S^2 - 4P\)`, S`\(S - 2P\)`], why: S`\((x_1 + x_2)^2 = x_1^2 + x_2^2 + 2x_1x_2\) nên \(x_1^2 + x_2^2 = S^2 - 2P\).` },

    { q: S`Phương trình \(x^2 - 2x + m = 0\) có nghiệm khi và chỉ khi`, a: [S`\(m \le 1\)`, S`\(m \lt 1\)`, S`\(m \ge 1\)`, S`\(m \le 4\)`], why: S`\(\Delta' = 1 - m \ge 0 \iff m \le 1\). "Có nghiệm" thì lấy cả dấu bằng.` },

        { s: S`\(A = (x_1 + x_2)^2 - 2x_1x_2 - 3x_1x_2 = S^2 - 5P = \dfrac{25}{4} + \dfrac{15}{2} = \dfrac{55}{4}\).`, p: 0.25 },

<script>/* data/vao-10/cd03-xac-suat.js */
/* Chủ đề 3 – Bài 3 (1,5 điểm): Xác suất của biến cố (dạng đơn giản). */
(() => {
  // Bảng tổng số chấm khi gieo hai xúc xắc (dùng trong lý thuyết).

    id: 'xac-suat', no: 3, bai: 'Bài 3 · 1,5 điểm',
    title: 'Xác suất của biến cố (dạng đơn giản)',
    desc: 'Mô tả không gian mẫu bằng liệt kê, bảng, sơ đồ cây; đếm kết quả thuận lợi; tính P(A) = n(A)/n(Ω).',
    remind: [
      S`Không gian mẫu \(\Omega\): tập hợp mọi kết quả có thể; \(n(\Omega)\) là số phần tử.`,
      S`\(P(A) = \dfrac{n(A)}{n(\Omega)}\) khi các kết quả đồng khả năng.`,
      S`\(0 \le P(A) \le 1\); rút gọn phân số ở kết quả.`,
      'Gieo 2 xúc xắc: 36 kết quả (bảng 6 × 6); tung đồng xu n lần: 2ⁿ kết quả.',

    theory: [
      { t: 'Phép thử, không gian mẫu, biến cố',
        b: S`<ul><li><b>Phép thử ngẫu nhiên</b>: việc làm mà biết trước các kết quả có thể xảy ra nhưng không biết kết quả nào sẽ xảy ra (gieo xúc xắc, rút thẻ, lấy bóng…).</li>
          <li><b>Không gian mẫu</b> \(\Omega\): tập hợp tất cả các kết quả có thể. Phải <b>viết ra</b> \(\Omega\) và đếm \(n(\Omega)\).</li>
          <li><b>Biến cố</b> \(A\): một sự kiện liên quan đến phép thử; <b>kết quả thuận lợi</b> cho \(A\) là kết quả làm \(A\) xảy ra.</li></ul>` },
      { t: 'Công thức tính xác suất',

      { t: 'Cách liệt kê không gian mẫu',
        b: S`<ul><li><b>Liệt kê trực tiếp</b> khi ít kết quả: gieo 1 xúc xắc \(\Omega = \{1; 2; 3; 4; 5; 6\}\).</li>
