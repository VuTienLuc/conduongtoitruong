      <p>Đọc văn bản sau và thực hiện các yêu cầu:</p>${vbHTML(e.dh.vb)}
      <ol class="van-cau">${c.map(x => `<li><b>Câu ${x.so}</b> <i>(${pt(x.diem)} điểm)</i>. ${x.de}</li>`).join('')}
        <li><b>Câu ${dv.so}</b> <i>(${pt(dv.diem)} điểm)</i>. ${dv.de}</li></ol>
      <h2 class="van-phan">PHẦN II. VIẾT (${pt1(e.viet.diem)} điểm)</h2>
      <p>${e.viet.de}</p>${vbHTML(e.viet.vb)}
      <p class="van-het">— Hết —</p></section>`;
  }
  function pageGoi(e, muc) {
    const c = e.dh.cau, dv = e.dh.dv, vt = e.viet;
    const goiCau = x => muc === 'it' ? `<p class="van-tip">💡 ${TIP[x.dang] || TIP.khac}</p>`
      : `<p class="van-tip">💡 ${x.goi || TIP[x.dang] || TIP.khac}</p>${muc === 'day' && x.mau ? `<p class="van-mau">✍️ Bắt đầu: <i>${x.mau}</i></p>` : ''}`;
    const khung = muc === 'it' ? `<p class="van-tip">💡 Khung 6 câu: ${KHUNG_DV.join(' → ')}.</p>`
      : `<ol class="van-khung">${(dv.khung.length ? dv.khung : KHUNG_DV).map(k => `<li>${muc === 'vua' ? k.split(/[:–]/)[0] : k}</li>`).join('')}</ol>${muc === 'day' && dv.mau ? `<p class="van-mau">✍️ Câu mở đầu: <i>${dv.mau}</i></p>` : ''}`;
    const dy = vt.dy, dyHTML = muc === 'it'
      ? `<p class="van-tip">💡 Mở bài (giới thiệu tác giả, tác phẩm, vấn đề) → Thân bài (từng ý: nội dung + nghệ thuật + cảm nhận) → Kết bài (khẳng định giá trị, liên hệ).</p>`
      : `<div class="van-dy"><p><b>Mở bài:</b> ${dy.mo.join(' ')}</p><p><b>Thân bài:</b></p><ol>${dy.than.map(t => `<li>${t}</li>`).join('')}</ol><p><b>Kết bài:</b> ${dy.ket.join(' ')}</p></div>
        ${muc === 'day' && vt.mau ? `<p class="van-mau">✍️ Mở bài mẫu: <i>${vt.mau}</i></p>` : ''}`;
    const tu = vt.tu.length ? `<p class="van-tu"><b>Từ ngữ dùng được:</b> ${vt.tu.join(' · ')}</p>` : '';
    return `<section class="sh-page van-page">${head('BÀI LÀM CÓ GỢI Ý', `Đề ${esc(e.ma)} · mức gợi ý: ${MUC[muc]}`)}
      <h1 class="sh-title">BÀI LÀM – ĐỀ ${esc(e.ma)}</h1>
      <p class="sh-info">Họ và tên: ........................................................ Lớp: .............. Ngày: ......../......../........</p>
      <div class="sh-check"><b>Tự soát:</b><span>☐ Mỗi câu đọc hiểu có dẫn chứng từ văn bản</span><span>☐ Đoạn văn đúng hình thức một đoạn, khoảng 200 chữ</span><span>☐ Bài văn đủ mở bài – thân bài – kết bài</span><span>☐ Chính tả, dấu câu, không gạch xoá nhiều</span></div>
      <h2 class="van-phan">PHẦN I. ĐỌC HIỂU</h2>
      ${c.map(x => `<div class="van-q"><p><b>Câu ${x.so}</b> <i>(${pt(x.diem)}đ · ${NhapDL.DANG_VAN[x.dang] || 'Khác'})</i></p>${goiCau(x)}${lines(x.dong)}</div>`).join('')}
      <div class="van-q"><p><b>Câu ${dv.so}</b> <i>(${pt(dv.diem)}đ · đoạn văn khoảng 200 chữ)</i></p>${khung}${lines(15)}</div>
      <h2 class="van-phan">PHẦN II. VIẾT <i>(khoảng 500 chữ)</i></h2>
      <div class="van-q">${dyHTML}${tu}${lines(34)}</div>
</section>`;
  }
  function pageCham(e) {
    const row = (lab, dap, cham) => `<tr class="van-row-h"><td><b>${lab}</b></td><td colspan="2">${dap}</td></tr>${cham.map(([s, p]) => `<tr><td></td><td>${s}</td><td class="num">${pt(p)}</td></tr>`).join('')}`;
    const dv = e.dh.dv, vt = e.viet;
    const loi = [...dv.loi, ...vt.loi];
    return `<section class="sh-page van-page">${head('HƯỚNG DẪN CHẤM', `Đề ${esc(e.ma)}`)}
      <h1 class="sh-title">HƯỚNG DẪN CHẤM – ĐỀ ${esc(e.ma)}</h1>
      <table class="sh-barem van-barem"><thead><tr><th>Câu</th><th>Đáp án – ý cần đạt</th><th>Điểm</th></tr></thead><tbody>
        <tr class="van-row-p"><td colspan="3"><b>PHẦN I. ĐỌC HIỂU (${pt1(e.dh.diem)} điểm)</b></td></tr>
        ${e.dh.cau.map(x => row(`Câu ${x.so}`, x.dap, x.cham)).join('')}
        ${row(`Câu ${dv.so}`, 'Đoạn văn khoảng 200 chữ', dv.cham)}
        <tr class="van-row-p"><td colspan="3"><b>PHẦN II. VIẾT (${pt1(vt.diem)} điểm)</b></td></tr>
        ${row('Bài văn', 'Bài văn khoảng 500 chữ', vt.cham)}
        <tr><td colspan="2"><b>Tổng</b></td><td class="num"><b>${pt(e.dh.diem + vt.diem)}</b></td></tr></tbody></table>
      ${loi.length ? `<p class="sh-loi"><b>Hay bị trừ điểm:</b> ${loi.join(' · ')}</p>` : ''}
      ${e.checklist.length ? `<p class="sh-loi"><b>Bẫy của đề này:</b> ${e.checklist.join(' · ')}</p>` : ''}
      <p class="ld-src">Ngữ liệu: ${[e.dh.vb, vt.vb].filter(Boolean).map(v => `${v.ten || 'văn bản'} – ${nguonTxt(v)}`).join('; ')}.${e.theo ? ` Cấu trúc theo: ${e.theo}.` : ''} Giám khảo linh hoạt khi học sinh diễn đạt khác nhưng đúng ý.</p></section>`;
  }
  // o.phan: các phần in ('de', 'goi', 'cham'); o.muc: 'day' | 'vua' | 'it'
  function sheetHTML(e, o = {}) {
    const ph = o.phan || ['de', 'goi', 'cham'], muc = o.muc || mucAuto(e);
    return `<div class="sheet van-sheet">${ph.includes('de') ? pageDe(e) : ''}${ph.includes('goi') ? pageGoi(e, muc) : ''}${ph.includes('cham') ? pageCham(e) : ''}</div>`;
  }

  async function printHTML(html, btn) {
    const lab = btn.textContent; btn.disabled = true; btn.textContent = 'Đang chuẩn bị…';
    let root = document.getElementById('print-root');
    if (!root) { root = document.createElement('div'); root.id = 'print-root'; document.body.appendChild(root); }
    root.innerHTML = html;
    document.body.classList.add('printing');
    const end = () => { document.body.classList.remove('printing'); root.innerHTML = ''; btn.disabled = false; btn.textContent = lab; window.removeEventListener('afterprint', end); };
    window.addEventListener('afterprint', end);
    setTimeout(() => { window.print(); setTimeout(() => { if (document.body.classList.contains('printing')) end(); }, 1500); }, 60);
  }
  const doneKey = ma => 'van:xong:' + ma;

  /* ---------- Trang danh sách ---------- */
  function listPage() {
    const es = list();
    const cards = es.map(e => {
      const vt = e.viet.vb || e.dh.vb, tho = vt && isTho(vt);
      return `<a class="tcard" href="#/van-10/de/${encodeURIComponent(e.ma)}"><span class="tno">${esc(e.ma)}</span><span class="tbody">
        <span class="tbai">${tho ? 'Phân tích thơ' : 'Phân tích truyện'} · ${e.phut} phút</span><span class="ttitle">${e.dh.vb ? e.dh.vb.ten || 'Văn bản đọc hiểu' : ''}</span>
        <span class="tdesc">${e.viet.de.replace(/<[^>]+>/g, '').slice(0, 140)}</span>
        <span class="chips">${U.get(doneKey(e.ma), false) ? '<span class="chip ok">Đã làm</span>' : ''}${e.src === 'may-nay' ? '<span class="chip warnc">Chỉ trên máy này</span>' : ''}${/^mau|^v?00$/i.test(e.ma) ? '<span class="chip">Đề mẫu</span>' : ''}</span></span></a>`;
    }).join('');
    view().innerHTML = `${App.topBar()}<main class="wrap"><div class="toolbar"><a class="back" href="#/">← Chọn lớp</a></div>
      <section class="card hero"><p class="pill">📖 Ngữ văn vào 10 · dành cho học sinh lực học trung bình</p><h2>Làm chắc từng câu, viết đúng khung</h2>
      <p>Mỗi đề in thành PDF gồm <b>đề</b>, <b>bài làm có gợi ý</b> (khung trả lời, câu mở đầu, dàn ý – gợi ý giảm dần qua các đề) và <b>hướng dẫn chấm</b> từng ý để tự chấm.</p></section>
      <h2 class="sec">Cấu trúc đề (120 phút)</h2>
      <div class="card table-wrap"><table class="struct"><thead><tr><th>Phần</th><th>Điểm</th><th>Nội dung</th><th>Thời gian gợi ý</th></tr></thead><tbody>
        <tr><th scope="row">I. Đọc hiểu</th><td class="num">6,0</td><td>Câu hỏi về thể loại, chủ đề, thông điệp, bài học, tiếng Việt; viết đoạn văn khoảng 200 chữ</td><td>45 phút</td></tr>
        <tr><th scope="row">II. Viết</th><td class="num">4,0</td><td>Bài văn khoảng 500 chữ phân tích, cảm nhận một bài thơ hoặc truyện ngắn</td><td>65 phút</td></tr>
        <tr><th scope="row">Soát bài</th><td></td><td>Chính tả, dấu câu, đủ ý theo khung</td><td>10 phút</td></tr></tbody></table></div>
      <div class="two"><a class="card link-card" href="#/van-10/phuong-phap"><span class="big">🧭</span><b>Phương pháp làm bài</b><span>Khung trả lời từng loại câu, khung đoạn 200 chữ, dàn ý bài 500 chữ</span></a>
        <a class="card link-card" href="#/xuong"><span class="big">🧰</span><b>Xưởng dữ liệu (thầy cô)</b><span>Tạo prompt cho AI, nhập đề mới vào web</span></a></div>
      <h2 class="sec">Đề luyện (${es.length})</h2>
      ${es.length ? `<div class="tgrid">${cards}</div>` : '<p class="empty">Chưa có đề. Thầy cô tạo đề bằng Xưởng dữ liệu → Menu prompt, rồi nhập JSON vào web.</p>'}</main>`;
  }

  /* ---------- Trang phương pháp ---------- */
  function methodPage() {
    const tr = (a, b) => `<tr><th scope="row">${a}</th><td>${b}</td></tr>`;
    view().innerHTML = `${App.topBar()}<main class="wrap"><div class="toolbar"><a class="back" href="#/van-10">← Ngữ văn vào 10</a></div>
      <section class="card hero"><h2>Phương pháp làm bài Ngữ văn</h2><p>Học sinh lực học trung bình lấy điểm bằng cách <b>trả lời đúng khung</b>: mỗi loại câu có một khung cố định, thuộc khung là có chữ để viết.</p></section>
      <h2 class="sec">1. Câu hỏi đọc hiểu</h2>
      <div class="card table-wrap"><table class="struct"><tbody>
        ${tr('Thể loại', TIP.the_loai)}${tr('Phương thức biểu đạt', TIP.phuong_thuc)}${tr('Biện pháp tu từ', TIP.bien_phap + ' Mẫu: "Biện pháp … qua từ ngữ "…" làm cho câu thơ sinh động, gợi hình; nhấn mạnh …; thể hiện tình cảm … của tác giả."')}
        ${tr('Chủ đề', TIP.chu_de)}${tr('Nội dung, chi tiết', TIP.chi_tiet)}${tr('Thông điệp', TIP.thong_diep)}${tr('Bài học', TIP.bai_hoc)}${tr('Tiếng Việt', TIP.tieng_viet)}</tbody></table></div>
      <div class="card"><h3>Ba bước cho mọi câu hỏi</h3><ol><li><b>Gạch chân từ khoá</b> của câu hỏi (xác định, chỉ ra, nêu tác dụng, theo em…).</li><li><b>Tìm dẫn chứng</b> trong văn bản, đánh dấu ngay trên đề.</li><li><b>Trả lời đủ ý</b>: câu 0,5 điểm viết 2–3 dòng; câu 1,0 điểm viết 4–6 dòng, có trích dẫn.</li></ol></div>
      <h2 class="sec">2. Đoạn văn khoảng 200 chữ</h2>
      <div class="card"><ol class="van-khung">${KHUNG_DV.map((k, i) => `<li><b>${k}</b>${['', ': … là gì, biểu hiện thế nào', ': vì sao quan trọng + một ví dụ người thật, việc thật', ': nếu không có / nếu ngược lại thì sao', ': phê phán biểu hiện trái ngược', ': em rút ra điều gì, sẽ làm gì'][i]}</li>`).join('')}</ol>
      <p>Viết thành <b>một đoạn</b> (lùi đầu dòng một lần, không xuống dòng giữa chừng), khoảng 12–15 dòng vở.</p></div>
      <h2 class="sec">3. Bài văn khoảng 500 chữ</h2>
      <div class="two"><div class="card"><h3>Phân tích bài thơ</h3><ol><li><b>Mở bài:</b> giới thiệu tác giả, bài thơ, cảm nhận chung.</li><li><b>Thân bài:</b> đi theo khổ hoặc theo ý; mỗi ý gồm <i>nội dung</i> (thơ nói gì) + <i>nghệ thuật</i> (từ ngữ, hình ảnh, biện pháp tu từ, nhịp, vần) + <i>cảm nhận</i> của em.</li><li><b>Đánh giá:</b> nét đặc sắc về nội dung, nghệ thuật.</li><li><b>Kết bài:</b> khẳng định giá trị, liên hệ bản thân.</li></ol></div>
        <div class="card"><h3>Phân tích truyện ngắn</h3><ol><li><b>Mở bài:</b> giới thiệu tác giả, truyện, vấn đề cần phân tích.</li><li><b>Thân bài:</b> tóm tắt ngắn; phân tích tình huống truyện, nhân vật (ngoại hình, lời nói, hành động, suy nghĩ), chi tiết đặc sắc, ngôi kể.</li><li><b>Đánh giá:</b> chủ đề, thông điệp, nghệ thuật kể chuyện.</li><li><b>Kết bài:</b> khẳng định giá trị, liên hệ bản thân.</li></ol></div></div>
      <div class="card"><h3>Câu chuyển ý dùng được ngay</h3><ul><li>Mở đầu bài thơ / câu chuyện, tác giả đã …</li><li>Không chỉ … mà còn …, đến khổ thơ tiếp theo, …</li><li>Đặc sắc hơn cả là chi tiết …</li><li>Qua đó, ta thấy …; Có thể nói, …</li></ul></div>
      <h2 class="sec">4. Luyện mỗi ngày 15 phút</h2>
      <div class="card"><ul><li>Thứ Hai – Tư – Sáu: 3 câu đọc hiểu theo khung (in phần Bài làm có gợi ý).</li><li>Thứ Ba – Năm: một đoạn văn 200 chữ theo khung 6 câu.</li><li>Cuối tuần: một đề đủ 120 phút, tự chấm theo hướng dẫn chấm, ghi lỗi vào sổ.</li></ul></div></main>`;
  }

  /* ---------- Trang một đề ---------- */
  function dePage(e) {
    const d = U.get(doneKey(e.ma), false), auto = mucAuto(e);
    view().innerHTML = `${App.topBar()}<main class="wrap"><div class="toolbar"><a class="back" href="#/van-10">← Ngữ văn vào 10</a></div>
      <section class="card sheet-tools"><h2>Đề ${esc(e.ma)}</h2>
        <p class="lead">In ra làm trên giấy: trang <b>Đề</b>, trang <b>Bài làm có gợi ý</b> (viết thẳng vào dòng kẻ) và <b>Hướng dẫn chấm</b> để tự chấm sau khi làm xong.</p>
        <div class="opts-row"><label class="tog">Mức gợi ý <select id="vMuc"><option value="${auto}">Tự động (${MUC[auto]})</option><option value="day">Đầy đủ</option><option value="vua">Vừa</option><option value="it">Ít</option></select></label>
          <label class="tog"><input type="checkbox" id="vDe" checked> Đề</label><label class="tog"><input type="checkbox" id="vGoi" checked> Bài làm có gợi ý</label><label class="tog"><input type="checkbox" id="vCham"> Hướng dẫn chấm</label>
          <label class="tog"><input type="checkbox" id="vXong" ${d ? 'checked' : ''}> Em đã làm xong đề này</label></div>
        <div class="row"><button class="btn primary" type="button" id="vIn">🖨️ In / Lưu PDF</button></div></section>
      <div class="paper-wrap" id="paper"></div></main>`;
    const $i = id => document.getElementById(id);
    const o = () => ({ muc: $i('vMuc').value, phan: [['de', 'vDe'], ['goi', 'vGoi'], ['cham', 'vCham']].filter(x => $i(x[1]).checked).map(x => x[0]) });
    const draw = () => { $i('paper').innerHTML = sheetHTML(e, o()); };
    ['vMuc', 'vDe', 'vGoi', 'vCham'].forEach(id => $i(id).addEventListener('change', draw));
    $i('vXong').addEventListener('change', ev => U.set(doneKey(e.ma), ev.target.checked));
    $i('vIn').addEventListener('click', ev => printHTML(sheetHTML(e, o()), ev.currentTarget));
    draw();
  }

  function route(parts) {
    if (parts[0] !== 'van-10') return false;
    if (parts[1] === 'phuong-phap') methodPage();
    else if (parts[1] === 'de' && get(decodeURIComponent(parts[2] || ''))) dePage(get(decodeURIComponent(parts[2])));
    else listPage();
    return true;
  }
  return { add, get, list, sheetHTML, route, isTho, TIP, MUC };
})();

</script>
<script>/* assets/js/ontap.js */
/* =====================================================================
   PHIẾU ÔN TẬP 90 PHÚT THEO CHỦ ĐỀ (Toán vào 10) – bài tập do AI (NotebookLM / Gem) tìm trong tài liệu,
   xếp từ cơ bản đến nâng cao; mỗi đợt một phiếu, đợt sau không lặp bài của đợt trước (NhapDL.check so dấu vân tay).
   #/on-tap            danh sách phiếu theo chủ đề (Bài 1 … Bài 7c)
   #/on-tap/<mã>       một phiếu: in PDF (mục tiêu, nhắc nhanh → các phần có dòng kẻ → gợi ý cuối phiếu → tự đánh giá → lời giải)
   Dữ liệu: JSON "loai":"on_tap_toan" hoặc Markdown chuẩn (NhapDL), tạo bằng Xưởng dữ liệu → Menu prompt.
   ===================================================================== */
const OnTap = (() => {
  const store = [];
  const THU = ['1', '2', '3', '4', '5', '6', '7a', '7b', '7c'];
  const TEN = { 1: 'Bài 1 – Hàm số y = ax² và đồ thị', 2: 'Bài 2 – Phương trình bậc hai, Viète', 3: 'Bài 3 – Xác suất', 4: 'Bài 4 – Thực tế đại số – hình học',
    5: 'Bài 5 – Hình học không gian thực tế', 6: 'Bài 6 – Hệ phương trình thực tế', '7a': 'Bài 7a – Hình học phẳng (câu a)', '7b': 'Bài 7b – Hình học phẳng (câu b)', '7c': 'Bài 7c – Hình học phẳng (câu c)' };
  const CHU = 'ABCDEFGH';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const view = () => document.getElementById('view');
  const key = e => `${THU.indexOf(e.bai)}-${String(e.dot).padStart(3, '0')}-${e.ma}`;
  function add(e) { const i = store.findIndex(x => x.ma === e.ma); if (i >= 0) store[i] = e; else store.push(e); store.sort((a, b) => key(a).localeCompare(key(b))); }
  const get = ma => store.find(x => x.ma === ma);
  const list = () => store.slice();
  const ofTopic = id => store.filter(e => e.id === id);
  const nextDot = bai => Math.max(0, ...store.filter(e => e.bai === String(bai)).map(e => e.dot)) + 1;
  const allBai = e => e.phan.flatMap(p => p.bai);
  // danh sách đã dùng (nguồn – tóm tắt) để đưa vào lệnh cho AI
  const daDung = bai => store.filter(e => e.bai === String(bai)).flatMap(e => allBai(e).map(b => {
    const t = b.de.replace(/\\\(|\\\)|\\\[|\\\]/g, '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    return `${b.nguon ? b.nguon.replace(/<[^>]+>/g, '') + ' – ' : ''}${t.slice(0, 70)}${t.length > 70 ? '…' : ''} (${e.ma})`;
  }));

  /* ---------- Phiếu in ---------- */
  const lines = n => `<div class="sh-lines">${'<i></i>'.repeat(n)}</div>`;
  const head = (l, r) => `<div class="sh-head"><span>${l}</span><span>${r}</span></div>`;
  function pagePhieu(e) {
    const goi = allBai(e).filter(b => b.goi);
    return `<section class="sh-page ot-page">${head('CON ĐƯỜNG TỚI TRƯỜNG · PHIẾU ÔN TẬP TOÁN VÀO 10', `${esc(e.ma)} · đợt ${e.dot}`)}
      <h1 class="sh-title">PHIẾU ÔN TẬP ${e.phut} PHÚT</h1><p class="sh-sub">${e.chu_de || TEN[e.bai]} · từ cơ bản đến nâng cao</p>
      <p class="sh-info">Họ và tên: ........................................................ Lớp: .............. Ngày: ......../......../........ Thời gian bắt đầu: ............</p>
      ${e.muc_tieu.length || e.kt.length ? `<div class="sh-remind ot-kt">${e.muc_tieu.length ? `<p><b>Mục tiêu:</b> ${e.muc_tieu.join('; ')}.</p>` : ''}${e.kt.length ? `<b>Kiến thức cần nhớ:</b><ul>${e.kt.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}</div>` : ''}
      ${e.phan.map((p, k) => `<h2 class="sh-h">PHẦN ${CHU[k]} – ${p.muc.toUpperCase()} (${p.phut} phút)</h2>
        ${p.bai.map(b => `<div class="sh-q"><div class="sh-de"><b>Bài ${b.so}.</b> ${b.de}</div>${b.can ? `<p class="ot-can">🔑 Cần nhớ: ${b.can}</p>` : ''}${lines(b.dong)}</div>`).join('')}`).join('')}
      ${goi.length ? `<div class="sh-hints"><h2 class="sh-h">GỢI Ý – CHỈ XEM KHI BÍ</h2><div class="ot-goi">${goi.map(b => `<p><b>Bài ${b.so}:</b> ${b.goi}</p>`).join('')}</div></div>` : ''}
      <div class="sh-check"><b>Tự đánh giá:</b>${(e.tdg.length ? e.tdg : ['Làm hết phần Cơ bản trong thời gian', 'Trình bày đủ bước, có kết luận', 'Đánh dấu bài sai để làm lại sau 3 ngày']).map(x => `<span>☐ ${x}</span>`).join('')}
        <span>Thời gian làm: ............ phút · Số bài đúng: ......../${allBai(e).length}</span></div></section>`;
  }
  function pageLoiGiai(e) {
    return `<section class="sh-page ot-page">${head('ĐÁP ÁN – LỜI GIẢI', `${esc(e.ma)} · đợt ${e.dot}`)}<h1 class="sh-title">LỜI GIẢI PHIẾU ÔN TẬP</h1><p class="sh-sub">${e.chu_de || TEN[e.bai]}</p>
      ${e.phan.map((p, k) => `<h2 class="sh-h">PHẦN ${CHU[k]} – ${p.muc.toUpperCase()}</h2>${p.bai.map(b => `<div class="sh-vd"><p><b>Bài ${b.so}.</b> <b>Đáp số:</b> ${b.dap}</p>
        ${b.can ? `<p class="ot-can">🔑 Kiến thức dùng: ${b.can}</p>` : ''}<ol class="sh-lg">${b.lg.map(x => `<li>${x}</li>`).join('')}</ol>${b.nguon ? `<p class="ld-src">Nguồn: ${b.nguon}</p>` : ''}</div>`).join('')}`).join('')}</section>`;
  }
  const sheetHTML = (e, o = {}) => `<div class="sheet math ot-sheet">${pagePhieu(e)}${o.key ? pageLoiGiai(e) : ''}</div>`;

  // Markdown chuẩn (đọc lại được bằng NhapDL.parse) – để thầy dùng ở công cụ khác (Typst, Word…)
  const plain = s => String(s || '').replace(/<br\s*\/?>/g, '\n').replace(/\\\(\s*/g, '$').replace(/\s*\\\)/g, '$').replace(/\\\[\s*/g, '$$$$').replace(/\s*\\\]/g, '$$$$')
    .replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
  function toMd(e) {
    const L = [`---`, `loai: on_tap_toan`, `ma: ${e.ma}`, `bai: ${e.bai}`, `chu_de: ${plain(e.chu_de || TEN[e.bai])}`, `dot: ${e.dot}`, `thoi_gian: ${e.phut}`, `---`, '',
      `# Phiếu ôn tập ${e.phut} phút – ${plain(e.chu_de || TEN[e.bai])} (đợt ${e.dot})`, ''];
    if (e.muc_tieu.length) L.push('## Mục tiêu', ...e.muc_tieu.map(x => `- ${plain(x)}`), '');
    if (e.kt.length) L.push('## Kiến thức cần nhớ', ...e.kt.map(x => `- ${plain(x)}`), '');
    e.phan.forEach((p, k) => {
      L.push(`## Phần ${CHU[k]} – ${plain(p.muc)} (${p.phut} phút)`, '');
      p.bai.forEach(b => { L.push(`### Bài ${b.so}`, plain(b.de)); if (b.nguon) L.push(`*Nguồn:* ${plain(b.nguon)}`); if (b.can) L.push(`*Cần nhớ:* ${plain(b.can)}`); if (b.goi) L.push(`> Gợi ý: ${plain(b.goi)}`); L.push(`*Dòng kẻ:* ${b.dong}`, ''); });
    });
    if (e.tdg.length) L.push('## Tự đánh giá', ...e.tdg.map(x => `- [ ] ${plain(x)}`), '');
    L.push('## Đáp án và lời giải', '');
    allBai(e).forEach(b => L.push(`### Bài ${b.so}`, `**Đáp số:** ${plain(b.dap)}`, ...b.lg.map((x, i) => `${i + 1}. ${plain(x)}`), ''));
    return L.join('\n');
  }

  async function printHTML(html, btn) {
    const lab = btn.textContent; btn.disabled = true; btn.textContent = 'Đang chuẩn bị…';
    let root = document.getElementById('print-root');
    if (!root) { root = document.createElement('div'); root.id = 'print-root'; document.body.appendChild(root); }
    root.innerHTML = html; await MathTS.done(root); document.body.classList.add('printing');
    const end = () => { document.body.classList.remove('printing'); root.innerHTML = ''; btn.disabled = false; btn.textContent = lab; window.removeEventListener('afterprint', end); };
    window.addEventListener('afterprint', end);
    setTimeout(() => { window.print(); setTimeout(() => { if (document.body.classList.contains('printing')) end(); }, 1500); }, 60);
  }
  function download(name, text, type) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  /* ---------- Trang ---------- */
  const doneKey = ma => 'ontap:xong:' + ma;
  function listPage() {
    const sec = THU.map(b => {
      const es = store.filter(e => e.bai === b);
      return `<h2 class="sec">${TEN[b]}</h2>${es.length ? `<div class="tgrid">${es.map(e => `<a class="tcard" href="#/on-tap/${encodeURIComponent(e.ma)}"><span class="tno">${e.dot}</span><span class="tbody">
        <span class="tbai">Đợt ${e.dot} · ${e.phut} phút · ${allBai(e).length} bài</span><span class="ttitle">${esc(e.ma)}</span><span class="tdesc">${e.phan.map(p => `${p.muc}: ${p.bai.length} bài`).join(' · ')}</span>
        <span class="chips">${U.get(doneKey(e.ma), false) ? '<span class="chip ok">Đã làm</span>' : ''}${e.src === 'may-nay' ? '<span class="chip warnc">Chỉ trên máy này</span>' : ''}</span></span></a>`).join('')}</div>`
        : '<p class="empty">Chưa có phiếu. Thầy cô tạo bằng Xưởng dữ liệu → Menu prompt → Phiếu ôn tập 90 phút.</p>'}`;
    }).join('');
    view().innerHTML = `${App.topBar()}<main class="wrap"><div class="toolbar"><a class="back" href="#/vao-10">← Ôn thi vào 10</a></div>
      <section class="card hero"><p class="pill">🗂️ Phiếu ôn tập 90 phút</p><h2>Ôn từng chủ đề, từ cơ bản đến nâng cao</h2>
      <p>Mỗi phiếu là một buổi ôn 90 phút: làm <b>phần Cơ bản</b> cho chắc, rồi <b>Khá</b>, cuối cùng thử <b>Nâng cao</b>. Bí thì xem <b>gợi ý</b> cuối phiếu, làm xong in kèm <b>lời giải</b> để tự chấm. Mỗi đợt là bài mới, không lặp đợt trước.</p></section>${sec}</main>`;
  }
  function phieuPage(e) {
    view().innerHTML = `${App.topBar()}<main class="wrap"><div class="toolbar"><a class="back" href="#/on-tap">← Phiếu ôn tập</a></div>
      <section class="card sheet-tools"><h2>${esc(e.ma)} · đợt ${e.dot}</h2><p class="lead">${e.chu_de || TEN[e.bai]} – ${e.phan.map(p => `${p.muc} ${p.phut} phút`).join(' → ')}.</p>
        <div class="opts-row"><label class="tog"><input type="checkbox" id="oKey"> Kèm lời giải (trang sau)</label><label class="tog"><input type="checkbox" id="oXong" ${U.get(doneKey(e.ma), false) ? 'checked' : ''}> Em đã làm xong phiếu này</label></div>
        <div class="row"><button class="btn primary" type="button" id="oIn">🖨️ In / Lưu PDF</button><button class="btn" type="button" id="oMd">⬇️ Tải Markdown (.md)</button><a class="btn" href="#/cd/${e.id}/lt">📘 Học lại chủ đề</a></div></section>
      <div class="paper-wrap" id="paper"></div></main>`;
    const $i = id => document.getElementById(id);
    const draw = () => { $i('paper').innerHTML = sheetHTML(e, { key: $i('oKey').checked }); };
    $i('oKey').addEventListener('change', draw);
    $i('oXong').addEventListener('change', ev => U.set(doneKey(e.ma), ev.target.checked));
    $i('oIn').addEventListener('click', ev => printHTML(sheetHTML(e, { key: $i('oKey').checked }), ev.currentTarget));
    $i('oMd').addEventListener('click', () => download(`${e.ma}.md`, toMd(e), 'text/markdown'));
    draw();
  }
  function route(parts) {
    if (parts[0] !== 'on-tap') return false;
    const e = parts[1] && get(decodeURIComponent(parts[1]));
    if (e) phieuPage(e); else listPage();
    return true;
  }
  return { add, get, list, ofTopic, nextDot, daDung, sheetHTML, toMd, route, TEN, THU };
})();

</script>
<script>/* assets/js/baihoc.js */
/* =====================================================================
   BÀI GIẢNG – LUYỆN TẬP ONLINE (lớp 9, 10, 11, 12) – bài học xếp theo mục lục SGK Toán "Kết nối tri thức với cuộc sống"
   #/bai-hoc                    chọn lớp
   #/bai-hoc/<lớp>              mục lục: Tập 1, Tập 2 → chương → bài (tìm nhanh theo tên)
   #/bai-hoc/<lớp>/<bài>        📘 Bài giảng: mục tiêu, kiến thức từng mục, ví dụ có lời giải, lưu ý hay sai, cần nhớ
   #/bai-hoc/<lớp>/<bài>/luyen  ✍️ Luyện tập online: Phần I trắc nghiệm, Phần II đúng – sai, Phần III trả lời ngắn; chấm ngay, lưu điểm cao nhất
   Mục lục: data/bai-hoc/muc-luc-kntt.js (BaiHoc.mucLuc). Trình chiếu, trò chơi HTML của thầy gắn vào bài: data/bai-hoc/tai-nguyen.js
   (BaiHoc.taiNguyen, tệp trong tuong-tac/) – hiện ở đầu tab Bài giảng, có nút toàn màn hình. Nội dung từng bài: JSON "loai":"bai_hoc" tạo bằng Xưởng dữ liệu
   (NotebookLM / Gem) → NhapDL (assets/js/nhap.js) → BaiHoc.add. Bài chưa có nội dung vẫn hiện trong mục lục.
   ===================================================================== */
const BaiHoc = (() => {
  const { esc, $, $$, get, set, shuffle } = U;
  const LOP = [9, 10, 11, 12];
  const ML = {};                       // lớp → { lop, ten, chuong: [{ tap, so, ten, bai: [{ so, ten }] }] }
  const LS = {};                       // 'lớp-bài' → bài học
  const TN = {};                       // 'lớp-bài' → [{ ten, mo_ta, file, nguon }] trình chiếu, trò chơi HTML
  let NHUNG = {};                      // bản gộp dist/: nội dung các tệp tuong-tac/ (tools/build.py nhúng vào)
  const key = (l, b) => `${l}-${b}`;
  // Bài lớp 9 gắn với chủ đề ôn thi vào 10; lớp 10–12 tự tìm chủ đề vận dụng – VDC có cùng số bài.
  const LIEN_9 = { 1: 'he-phuong-trinh-thuc-te', 2: 'he-phuong-trinh-thuc-te', 3: 'he-phuong-trinh-thuc-te', 11: 'kien-thuc-thong-nhat', 12: 'kien-thuc-thong-nhat',
    15: 'thuc-te-dai-so-hinh-hoc', 18: 'ham-so-parabol', 19: 'pt-bac-hai-viete', 20: 'pt-bac-hai-viete', 21: 'thuc-te-dai-so-hinh-hoc',
    25: 'xac-suat', 26: 'xac-suat', 27: 'hinh-7a', 28: 'hinh-7a', 29: 'hinh-7a', 31: 'hinh-khong-gian', 32: 'hinh-khong-gian' };

  /* ---------- Dữ liệu ---------- */
  function mucLuc(lop, ten, chuong) {
    ML[lop] = { lop, ten, chuong: chuong.map(([tap, so, t, bai]) => ({ tap, so, ten: t, bai: bai.map(([s, n]) => ({ so: s, ten: n })) })) };
  }
  const all = lop => (ML[lop] ? ML[lop].chuong.flatMap(c => c.bai.map(b => ({ ...b, chuong: c }))) : []);
  const baiOf = (lop, so) => all(lop).find(b => b.so === +so) || null;
  function add(e) { LS[key(e.lop, e.bai)] = e; }
  function taiNguyen(lop, bai, arr) { (TN[key(lop, bai)] = TN[key(lop, bai)] || []).push(...arr); }
  const tnOf = (lop, bai) => TN[key(lop, bai)] || [];
  function nhung(m) { NHUNG = Object.assign(NHUNG, m); }
  const blobs = {};
  // Thư mục web: dùng đường dẫn tệp. Bản gộp một tệp: tạo địa chỉ blob từ nội dung đã nhúng.
  const srcOf = f => NHUNG[f] ? (blobs[f] = blobs[f] || URL.createObjectURL(new Blob([NHUNG[f]], { type: 'text/html' }))) : f;
  const get_ = (lop, bai) => LS[key(lop, bai)];
  const list = () => Object.values(LS);
  const prog = (lop, bai) => get('bh:' + key(lop, bai), null);

  /* ---------- Khung trang ---------- */
  const view = () => $('#view');
  const shell = (back, label, body) => `${App.topBar()}<main class="wrap"><div class="toolbar"><a class="back" href="${back}">← ${label}</a></div>${body}</main>`;
  const fold = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');

  function pickLop() {
    const cards = LOP.map(l => {
      const n = all(l).length, k = all(l).filter(b => get_(l, b.so)).length, t = all(l).filter(b => tnOf(l, b.so).length).length;
      return `<a class="card grade-card" href="#/bai-hoc/${l}"><span class="g-big">${l}</span><span class="g-body"><b>Toán ${l}</b>
        <span>${ML[l] ? esc(ML[l].ten) : 'Kết nối tri thức với cuộc sống'} · ${ML[l] ? ML[l].chuong.length : 0} chương</span>
        <span class="chips"><span class="chip">${n} bài</span>${k ? `<span class="chip ok">${k} bài có bài giảng</span>` : ''}${t ? `<span class="chip ok">🎬 ${t} bài có trình chiếu</span>` : ''}</span></span></a>`;
    }).join('');
    view().innerHTML = shell('#/', 'Chọn lớp', `<section class="card hero"><p class="pill">📚 Học theo SGK</p><h2>Bài giảng – Luyện tập online</h2>
      <p>Học đúng thứ tự mục lục SGK Toán <b>Kết nối tri thức với cuộc sống</b>. Mỗi bài có bài giảng ngắn (kiến thức, ví dụ có lời giải, lưu ý hay sai) và bài luyện tập làm ngay trên máy theo ba dạng của đề thi: trắc nghiệm, đúng – sai, trả lời ngắn.</p></section>
      <div class="grade-grid">${cards}</div>`);
  }

  function mucLucPage(lop) {
    const M = ML[lop]; if (!M) return pickLop();
    const row = b => {
      const e = get_(lop, b.so), p = prog(lop, b.so), t = tnOf(lop, b.so);
      return `<a class="bh-row${e || t.length ? '' : ' trong'}" href="#/bai-hoc/${lop}/${b.so}" data-s="${esc(fold(`bai ${b.so} ${b.ten} ${b.chuong.ten}`))}">
        <span class="bh-no">${b.so}</span><span class="bh-ten">Bài ${b.so}. ${esc(b.ten)}</span>
        <span class="chips">${t.length ? '<span class="chip ok">🎬 Trình chiếu</span>' : ''}${e ? `<span class="chip ok">📘 ✍️ ${e.tn.length + e.ds.length + e.tln.length} câu</span>` : t.length ? '' : '<span class="chip">Đang soạn</span>'}${p ? `<span class="chip">✓ ${p.best}/${p.total}</span>` : ''}</span></a>`;
    };
    const taps = [...new Set(M.chuong.map(c => c.tap))];
    view().innerHTML = shell('#/bai-hoc', 'Chọn lớp', `<section class="card hero"><p class="pill soft">Lớp ${lop}</p><h2>${esc(M.ten)}</h2>
      <p>${all(lop).length} bài trong ${M.chuong.length} chương. Bấm vào bài để xem bài giảng và luyện tập.</p>
      <label class="bh-find">🔎 <input id="bhFind" type="search" placeholder="Tìm bài: ví dụ “cực trị”, “Bài 12”…" autocomplete="off"></label></section>
      ${taps.map(t => `<h2 class="sec bh-tap" data-tap="${t}">Tập ${t}</h2>${M.chuong.filter(c => c.tap === t).map(c => `<details class="card bh-ch" data-tap="${t}" open>
        <summary><span>Chương ${c.so}. ${esc(c.ten)}</span><span class="chip">${c.bai.length} bài</span></summary>
        <div class="bh-rows">${c.bai.map(b => row({ ...b, chuong: c })).join('')}</div></details>`).join('')}`).join('')}
      <p class="empty" id="bhNone" hidden>Không thấy bài nào khớp.</p>`);
    $('#bhFind').addEventListener('input', e => {
      const q = fold(e.target.value.trim()); let any = false;
      $$('.bh-ch').forEach(d => { let n = 0; $$('.bh-row', d).forEach(r => { const ok = !q || r.dataset.s.includes(q); r.hidden = !ok; if (ok) n++; }); d.hidden = !n; if (n) any = true; if (q) d.open = true; });
      $$('.bh-tap').forEach(h => { h.hidden = !$$('.bh-ch').some(d => !d.hidden && d.dataset.tap === h.dataset.tap); });
      $('#bhNone').hidden = any;
    });
  }

  /* ---------- Trang một bài ---------- */
  function lienQuan(lop, so) {
    const out = [];
    if (lop === 9 && LIEN_9[so] && typeof Topics !== 'undefined' && Topics.get(LIEN_9[so])) {
      const t = Topics.get(LIEN_9[so]); out.push(`<a href="#/cd/${t.id}/lt">🎯 Ôn thi vào 10 – Chủ đề ${t.no}: ${t.title}</a>`);
    }
    if (lop >= 10 && typeof Vdc !== 'undefined') Vdc.ofGrade('lop' + lop)
      .filter(t => [...String(t.bai || '').matchAll(/Bài (\d+)\./g)].some(m => +m[1] === so))
      .forEach(t => out.push(`<a href="#/lop${lop}/${t.id}">🚀 Vận dụng – vận dụng cao: ${t.title}</a>`));
    return out.length ? `<div class="card bh-lien"><b>Học tiếp sau bài này</b>${out.map(x => `<p>${x}</p>`).join('')}</div>` : '';
  }
  function lesson(lop, so, tab) {
    const b = baiOf(lop, so); if (!b) return mucLucPage(lop);
    const e = get_(lop, so), ds = all(lop), i = ds.findIndex(x => x.so === b.so), prev = ds[i - 1], next = ds[i + 1];
    const tabs = [['', '📘', 'Bài giảng'], ['luyen', '✍️', 'Luyện tập online']].map(([k, ic, n]) =>
      `<a class="tab${k === tab ? ' on' : ''}" href="#/bai-hoc/${lop}/${so}${k ? '/' + k : ''}" ${k === tab ? 'aria-current="page"' : ''}><span aria-hidden="true">${ic}</span> ${n}</a>`).join('');
    view().innerHTML = `${App.topBar()}<main class="wrap">
      <div class="toolbar"><a class="back" href="#/bai-hoc/${lop}">← Mục lục Toán ${lop}</a>
        <span class="nav-mini">${prev ? `<a href="#/bai-hoc/${lop}/${prev.so}">‹ Bài ${prev.so}</a>` : ''}${next ? `<a href="#/bai-hoc/${lop}/${next.so}">Bài ${next.so} ›</a>` : ''}</span></div>
      <section class="thead card"><span class="tno big">${b.so}</span><div><p class="tbai">Toán ${lop} · Tập ${b.chuong.tap} · Chương ${b.chuong.so}. ${esc(b.chuong.ten)}</p>
        <h2>Bài ${b.so}. ${esc(b.ten)}</h2>${e ? `<p class="tdesc">${e.mau ? '<span class="chip warnc">Mẫu minh họa</span> ' : ''}${e.nguon ? `Nguồn: ${e.nguon}` : ''}</p>` : ''}</div></section>
      ${e ? `<nav class="tabs" aria-label="Bài học">${tabs}</nav><section id="pane" class="pane"></section>` : `<section id="pane" class="pane"></section>`}
      ${lienQuan(lop, b.so)}
      <div class="pane-foot">${e && !tab ? `<a class="btn primary" href="#/bai-hoc/${lop}/${so}/luyen">Luyện tập ngay ✍️ →</a>` : next ? `<a class="btn primary" href="#/bai-hoc/${lop}/${next.so}">Sang Bài ${next.so} →</a>` : `<a class="btn primary" href="#/bai-hoc/${lop}">Về mục lục</a>`}</div></main>`;
    const pane = $('#pane');
    if (!e) { paneTrong(lop, b, pane); return ttMount(lop, b.so, pane); }
    if (tab === 'luyen') paneLuyen(e, pane); else { paneGiang(e, pane); ttMount(lop, b.so, pane); }
  }
  // Trình chiếu, trò chơi HTML của bài: khung 16:9 ở đầu tab Bài giảng, nút toàn màn hình, mở tab mới.
  function ttMount(lop, so, pane) {
    const ts = tnOf(lop, so); if (!ts.length) return;
    pane.insertAdjacentHTML('afterbegin', ts.map((t, i) => `<article class="card bh-tt"><h3>🎬 ${esc(t.ten)}</h3>${t.mo_ta ? `<p class="muted small">${esc(t.mo_ta)}</p>` : ''}
      <div class="bh-frame"><iframe src="${esc(srcOf(t.file))}" title="${esc(t.ten)}" allow="fullscreen" allowfullscreen loading="lazy" data-tt="${i}"></iframe></div>
      <div class="row"><button class="btn primary" type="button" data-fs="${i}">⛶ Toàn màn hình</button><a class="btn ghost" href="${esc(srcOf(t.file))}" target="_blank" rel="noopener">↗ Mở trong tab mới</a>${t.nguon ? `<span class="muted small">${esc(t.nguon)}</span>` : ''}</div></article>`).join(''));
    $$('[data-fs]', pane).forEach(btn => btn.addEventListener('click', () => {
      const f = $(`iframe[data-tt="${btn.dataset.fs}"]`, pane), go = f.requestFullscreen || f.webkitRequestFullscreen;
      if (go) Promise.resolve(go.call(f)).then(() => { try { f.contentWindow.focus(); } catch (e) { /* khác nguồn */ } }).catch(() => window.open(f.src, '_blank'));
      else window.open(f.src, '_blank');
    }));
  }
  function paneTrong(lop, b, pane) {
    if (tnOf(lop, b.so).length) {
      pane.innerHTML = `<div class="card"><p>📭 Bài giảng tóm tắt và bài luyện tập online của bài này đang được soạn. Trong lúc chờ, em xem phần trình chiếu ở trên và làm bài tập trong SGK.</p>
        <button class="btn ghost" type="button" id="bhMake">🧰 Thầy cô: tạo prompt cho bài này</button></div>`;
      $('#bhMake').addEventListener('click', () => { set('xuong:prompt', Object.assign(get('xuong:prompt', {}), { loai: 'baihoc', bhLop: String(lop), bhBai: String(b.so) })); location.hash = '#/xuong/prompt'; });
      return;
    }
    pane.innerHTML = `<div class="card"><h3>📭 Bài này đang được soạn</h3><p>Em vẫn học được: đọc SGK Toán ${lop} – Bài ${b.so}, làm các ví dụ và bài tập trong sách, rồi quay lại đây khi bài giảng online có trên web.</p>
      <p class="muted small">Thầy cô: tạo nội dung bài này bằng Xưởng dữ liệu (NotebookLM / Gem có gắn SGK, sách bài tập).</p>
      <button class="btn" type="button" id="bhMake">🧰 Tạo prompt cho bài này</button></div>`;
    $('#bhMake').addEventListener('click', () => { set('xuong:prompt', Object.assign(get('xuong:prompt', {}), { loai: 'baihoc', bhLop: String(lop), bhBai: String(b.so) })); location.hash = '#/xuong/prompt'; });
  }

  /* ---------- 📘 Bài giảng ---------- */
  const vdHTML = (v, k) => `<div class="bh-vd"><p><b>Ví dụ ${k}.</b> ${v.de}</p><details><summary>Xem lời giải</summary><ol class="lg-steps">${v.lg.map(x => `<li>${x}</li>`).join('')}</ol>
    ${v.ds ? `<p class="ds-box"><b>Đáp số:</b> ${v.ds}</p>` : ''}</details></div>`;
  function giangHTML(e) {
    let k = 0;
    return (e.muc_tieu.length ? `<div class="card remind"><h3>🎯 Học xong bài này, em</h3><ul>${e.muc_tieu.map(x => `<li>${x}</li>`).join('')}</ul></div>` : '')
      + e.giang.map((m, i) => `<article class="card kt"><h3>${/^\d+\./.test(m.t) ? '' : `<span class="kno">${i + 1}</span>`}${m.t}</h3><div class="kb">${m.b}</div>
        ${m.vd.map(v => vdHTML(v, ++k)).join('')}${m.luu_y ? `<p class="warn">⚠️ ${m.luu_y}</p>` : ''}</article>`).join('')
      + (e.can_nho.length ? `<article class="card remind bh-can"><h3>🔑 Cần nhớ</h3><ul>${e.can_nho.map(x => `<li>${x}</li>`).join('')}</ul></article>` : '');
  }
  function paneGiang(e, pane) { pane.innerHTML = giangHTML(e); set('bh:doc:' + key(e.lop, e.bai), 1); }

  /* ---------- ✍️ Luyện tập online ---------- */
  const numOf = s => {
    const t = String(s).trim().replace(/\s+/g, '').replace(/,/g, '.').replace(/−/g, '-');
    let m = t.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/); if (m) return +m[2] ? +m[1] / +m[2] : NaN;
    return /^-?\d*\.?\d+$/.test(t) ? +t : NaN;
  };
  const sameAns = (x, ans) => { const a = numOf(x), b = numOf(ans); return !isNaN(a) && !isNaN(b) ? Math.abs(a - b) < 1e-9 : fold(x).replace(/\s+/g, '') === fold(ans).replace(/\s+/g, ''); };
  const YL = 'abcd';
  function paneLuyen(e, pane) {
    const tn = e.tn.map(q => ({ ...q, good: q.a[0], opts: shuffle(q.a) }));
    const total = tn.length + 4 * e.ds.length + e.tln.length, nQ = tn.length + e.ds.length + e.tln.length;
    let done = 0, right = 0;
    pane.innerHTML = `<p class="lead">Làm lần lượt ba phần như đề thi. Mỗi câu bấm <b>Kiểm tra</b> là biết đúng sai ngay và đọc lời giải thích. Câu đúng – sai: mỗi ý đúng được 1 điểm.</p>
      ${tn.length ? `<h3 class="sub">Phần I. Trắc nghiệm nhiều phương án (${tn.length} câu)</h3><div class="quiz">${tn.map((q, k) => `<article class="card qcard bh-q" data-k="${k}">
        <p class="qtext"><b>Câu ${k + 1}.</b> ${q.q}</p><div class="opts">${q.opts.map((o, j) => `<button type="button" class="opt" data-j="${j}"><span class="ol">${'ABCD'[j]}</span><span>${o}</span></button>`).join('')}</div>
        <div class="why" hidden></div></article>`).join('')}</div>` : ''}
      ${e.ds.length ? `<h3 class="sub">Phần II. Đúng – Sai (${e.ds.length} câu)</h3>${e.ds.map((q, k) => `<article class="card bh-dsq" data-k="${k}"><p class="qtext"><b>Câu ${k + 1}.</b> ${q.q}</p>
        <ol class="bh-ds">${q.y.map((y, j) => `<li data-j="${j}"><span class="bh-y"><b>${YL[j]})</b> ${y[0]}</span><span class="bh-dsb"><button type="button" class="tog" data-v="1">Đúng</button><button type="button" class="tog" data-v="0">Sai</button></span></li>`).join('')}</ol>
        <div class="row"><button class="btn primary" type="button" data-chk disabled>Kiểm tra</button></div><div class="why" hidden></div></article>`).join('')}` : ''}
      ${e.tln.length ? `<h3 class="sub">Phần III. Trả lời ngắn (${e.tln.length} câu)</h3>${e.tln.map((q, k) => `<article class="card bh-tl" data-k="${k}"><p class="qtext"><b>Câu ${k + 1}.</b> ${q.q}</p>
        <div class="row bh-tlrow"><label>Đáp số: <input class="bh-in" type="text" inputmode="decimal" autocomplete="off" aria-label="Đáp số câu ${k + 1}"></label><button class="btn primary" type="button" data-chk>Kiểm tra</button></div>
        <div class="why" hidden></div></article>`).join('')}<p class="muted small">Trả lời ngắn: ghi số, dùng dấu phẩy hoặc dấu chấm cho số thập phân (2,5 hoặc 2.5); được ghi phân số dạng 3/4.</p>` : ''}
      <div class="card score bh-score" id="bhScore"><p>Đã làm <b id="bhDone">0</b>/${nQ} câu · đúng <b id="bhRight">0</b>/${total} ý</p></div>`;
    const tick = (ok, pts = ok ? 1 : 0) => { done++; right += pts; $('#bhDone').textContent = done; $('#bhRight').textContent = right; if (done === nQ) finish(); };
    const why = (card, ok, txt) => { const w = $('.why', card); w.hidden = false; w.innerHTML = `${ok ? '<b class="okc">Đúng rồi!</b>' : '<b class="badc">Chưa đúng.</b>'} ${txt || ''}`; };
    $$('.bh-q', pane).forEach(card => {
      const q = tn[+card.dataset.k];
      $$('.opt', card).forEach(btn => btn.addEventListener('click', () => {
        if (card.classList.contains('locked')) return; card.classList.add('locked');
        const ok = q.opts[+btn.dataset.j] === q.good;
        $$('.opt', card).forEach(x => { x.disabled = true; if (q.opts[+x.dataset.j] === q.good) x.classList.add('good'); });
        if (!ok) btn.classList.add('bad');
        why(card, ok, q.why); tick(ok);
      }));
    });
    $$('.bh-dsq', pane).forEach(card => {
      const q = e.ds[+card.dataset.k], pick = [null, null, null, null], chk = $('[data-chk]', card);
      $$('.bh-ds li', card).forEach(li => $$('button', li).forEach(btn => btn.addEventListener('click', () => {
        if (card.classList.contains('locked')) return;
        pick[+li.dataset.j] = btn.dataset.v === '1'; $$('button', li).forEach(x => x.classList.toggle('on', x === btn));
        chk.disabled = pick.some(x => x === null);
      })));
      chk.addEventListener('click', () => {
        if (card.classList.contains('locked')) return; card.classList.add('locked'); chk.disabled = true;
        let n = 0;
        $$('.bh-ds li', card).forEach(li => { const j = +li.dataset.j, ok = pick[j] === q.y[j][1]; if (ok) n++;
          li.classList.add(ok ? 'good' : 'bad'); li.insertAdjacentHTML('beforeend', `<span class="bh-mark">${ok ? '✓' : '✗'} ${q.y[j][1] ? 'Đúng' : 'Sai'}</span>`);
          $$('button', li).forEach(x => { x.disabled = true; }); });
        const w = $('.why', card); w.hidden = false;
        w.innerHTML = `<b class="${n === 4 ? 'okc' : 'badc'}">Đúng ${n}/4 ý.</b> ${q.why || ''}`; tick(n === 4, n);
      });
    });
    $$('.bh-tl', pane).forEach(card => {
      const q = e.tln[+card.dataset.k], inp = $('.bh-in', card), chk = $('[data-chk]', card);
      const go = () => {
        if (card.classList.contains('locked') || !inp.value.trim()) { if (!inp.value.trim()) inp.focus(); return; }
        card.classList.add('locked'); chk.disabled = true; inp.readOnly = true;
        const ok = sameAns(inp.value, q.ans); inp.classList.add(ok ? 'good' : 'bad');
        why(card, ok, `${ok ? '' : `Đáp số đúng: <b>${esc(q.ans)}</b>. `}${q.why || ''}`); tick(ok);
      };
      chk.addEventListener('click', go); inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') go(); });
    });
    function finish() {
      const old = prog(e.lop, e.bai), best = Math.max(right, old ? old.best : 0);
      set('bh:' + key(e.lop, e.bai), { best, total, luc: Date.now() });
      const s = $('#bhScore'), r = right / total;
      s.innerHTML = `<p class="big-score">${right}/${total}</p><p>${r === 1 ? 'Xuất sắc! Em đã nắm chắc bài này.' : r >= 0.8 ? 'Tốt lắm. Đọc lại lời giải thích các câu sai rồi làm lại để đạt điểm tối đa.' : r >= 0.5 ? 'Em hiểu được phần lớn bài. Mở lại Bài giảng, xem mục Cần nhớ và các ví dụ rồi làm lại.' : 'Em nên học lại Bài giảng (đọc kĩ ví dụ) trước khi làm lại.'}</p>
        <p class="muted">Điểm cao nhất của em: ${best}/${total}</p><div class="row" style="justify-content:center"><button class="btn" type="button" id="bhRedo">↻ Làm lại (đảo phương án)</button><a class="btn ghost" href="#/bai-hoc/${e.lop}/${e.bai}">📘 Xem lại bài giảng</a></div>`;
      $('#bhRedo').addEventListener('click', () => { paneLuyen(e, pane); pane.scrollIntoView({ block: 'start' }); });
      s.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  /* ---------- Xem trước khi nhập (Xưởng dữ liệu): bài giảng + mọi câu kèm đáp án ---------- */
  function previewHTML(e) {
    const b = baiOf(e.lop, e.bai);
    return `<div class="bh-pre math"><h2>Toán ${e.lop} – Bài ${e.bai}. ${esc(b ? b.ten : e.ten)}</h2>${giangHTML(e)}
      <h3 class="sub">Luyện tập – đáp án</h3><ol>${e.tn.map(q => `<li>${q.q}<br><b>Đúng:</b> ${q.a[0]} · <span class="muted">sai: ${q.a.slice(1).join(' | ')}</span>${q.why ? `<br><i>${q.why}</i>` : ''}</li>`).join('')}</ol>
      <ol>${e.ds.map(q => `<li>${q.q}<ul>${q.y.map((y, j) => `<li>${YL[j]}) ${y[0]} → <b>${y[1] ? 'Đúng' : 'Sai'}</b></li>`).join('')}</ul>${q.why ? `<i>${q.why}</i>` : ''}</li>`).join('')}</ol>
      <ol>${e.tln.map(q => `<li>${q.q} → <b>${esc(q.ans)}</b>${q.why ? `<br><i>${q.why}</i>` : ''}</li>`).join('')}</ol></div>`;
  }

  function route(parts) {
    if (parts[0] !== 'bai-hoc') return false;
    const lop = +parts[1], so = +parts[2];
    if (!LOP.includes(lop)) pickLop(); else if (!so) mucLucPage(lop); else lesson(lop, so, parts[3] === 'luyen' ? 'luyen' : '');
    return true;
  }
  return { LOP, LIEN_9, mucLuc, all, baiOf, add, get: get_, list, prog, route, previewHTML, numOf, sameAns, ML, taiNguyen, tnOf, nhung, TN };
})();

</script>
<script>/* assets/js/nhap.js */
/* =====================================================================
   NHẬP DỮ LIỆU TỪ AI (NotebookLM / Gem Gemini) – một chỗ dùng chung cho web, kiem-tra.js và nhap-du-lieu.py
   - Tách JSON từ câu trả lời của AI (khối ```json hoặc từ "{" đầu tới "}" cuối), sửa lỗi hay gặp:
     dấu \ của LaTeX viết đơn (\frac → \f…), dấu phẩy thừa, số trích dẫn [1] của NotebookLM.
   - Chuẩn hoá chuỗi: $…$ → \( … \), $$…$$ → \[ … \], < > trong công thức → \lt \gt, xuống dòng → <br>.
   - Kiểm: đủ trường, điểm bội 0,25, tổng điểm từng bước = điểm câu; Ngữ văn: ngữ liệu phải là
     tác phẩm trước 1929 hoặc văn bản tự viết (quy ước dự án, tránh vi phạm bản quyền).
   - Hai loại dữ liệu (mẫu JSON đầy đủ ở Xưởng dữ liệu → Menu prompt):
     "loai":"luyen_de_toan" → thêm đề vào bộ Luyện đề của bài tương ứng (LuyenDe)
     "loai":"de_van"        → đề Ngữ văn vào 10 (Van)
     "loai":"on_tap_toan"   → phiếu ôn tập 90 phút theo chủ đề, cơ bản → nâng cao (OnTap); đọc được cả Markdown chuẩn
     "loai":"bai_hoc"       → bài giảng – luyện tập online một bài SGK Toán 9–12 KNTT (BaiHoc): bài giảng, cần nhớ,
                              trắc nghiệm, đúng – sai, trả lời ngắn
   - Dữ liệu của hệ thống: data/nhap/*.js gọi NhapDL.add(<json>) (tạo bằng tools/nhap-du-lieu.py).
     Dữ liệu chỉ trên máy này: lưu trong trình duyệt (U.get('nhap:may')), nạp ở App.start().
   ===================================================================== */
const NhapDL = (() => {
  const BAI = { 1: 'ham-so-parabol', 2: 'pt-bac-hai-viete', 3: 'xac-suat', 4: 'thuc-te-dai-so-hinh-hoc', 5: 'hinh-khong-gian',
    6: 'he-phuong-trinh-thuc-te', '7a': 'hinh-7a', '7b': 'hinh-7b', '7c': 'hinh-7c' };
  const DANG_VAN = { the_loai: 'Thể loại', phuong_thuc: 'Phương thức biểu đạt', chu_de: 'Chủ đề', noi_dung: 'Nội dung', chi_tiet: 'Chi tiết, hình ảnh',
    bien_phap: 'Biện pháp tu từ', tieng_viet: 'Tiếng Việt', thong_diep: 'Thông điệp', bai_hoc: 'Bài học', khac: 'Khác' };
  const NGUON_OK = ['truoc_1929', 'tu_viet'];
  const LATEX = 'dfrac|tfrac|frac|times|text|theta|neq|notin|ne|Rightarrow|rightarrow|right|Leftrightarrow|leftrightarrow|left|leq|le|geq|ge|beta|bar|sqrt|cdot|cdots|ldots|pi|alpha|gamma|Delta|delta|infty|in|approx|perp|parallel|widehat|hat|triangle|angle|overline|sin|cos|tan|cot|log|lim|sum|int|begin|end|quad|circ|backsim|sim|equiv|iff|mathbb|varnothing|emptyset|cup|cap|subset|pm|mp|div|lt|gt|vec|mathrm|displaystyle|Big|big';
  const items = [];                     // { json, src: 'he-thong' | 'may-nay', key?, r }
  const q4 = x => Math.abs(x * 4 - Math.round(x * 4)) < 1e-9;
  const near = (a, b) => Math.abs(a - b) < 1e-9;
  const sum = a => a.reduce((s, x) => s + (+x || 0), 0);
  const num = x => typeof x === 'string' ? parseFloat(x.replace(',', '.')) : x;

  /* ---------- 1. Tách và đọc JSON ---------- */
  function extract(raw) {
    let t = String(raw || '').replace(/^﻿/, '').trim();
    const m = t.match(/```(?:json|JSON)?\s*([\s\S]*?)```/);
    if (m) t = m[1].trim();
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a > 0 || (b >= 0 && b < t.length - 1)) t = t.slice(Math.max(a, 0), b + 1);
    return t;
  }
  const BAD = /[\x08\x0b\x0c]|\t(?:imes|ext|heta|riangle|an\b)|\r(?:ight)|\n(?:eq|otin)\b/;
  const hasBad = v => typeof v === 'string' ? BAD.test(v) : (v && typeof v === 'object' ? Object.values(v).some(hasBad) : false);
  function repair(t) {
    // Đọc từng cặp "\x" từ trái sang phải: "\\" giữ nguyên; "\" + lệnh LaTeX (frac, neq, times…) hoặc + kí tự
    // không phải mã thoát của JSON (\Omega, \{, \(…) → nhân đôi dấu gạch.
    return t
      .replace(new RegExp(`\\\\(\\\\|(?:${LATEX})(?![a-zA-Z])|[^"\\\\/bfnrtu])`, 'g'), (m, g) => g === '\\' ? m : '\\\\' + g)
      .replace(/,\s*([}\]])/g, '$1')                                                   // dấu phẩy thừa
      .replace(/[“”]/g, '"');
  }
  function parse(raw) {
    const md = mdOf(raw);
    if (md) return { data: mdToJson(md), notes: ['Đọc từ Markdown chuẩn.'] };
    const notes = [], t = extract(raw);
    if (!t) throw new Error('Không thấy dữ liệu JSON. Hãy dán nguyên câu trả lời của AI (có khối ```json).');
    let v = null, e1 = null;
    try { v = JSON.parse(t); } catch (e) { e1 = e; }
    if (v === null || hasBad(v)) {
      try { const v2 = JSON.parse(repair(t)); if (!hasBad(v2) || v === null) { v = v2; notes.push('Đã sửa dấu \\ của công thức (AI viết một dấu thay vì hai).'); } }
      catch (e2) { if (v === null) throw new Error('JSON sai cú pháp: ' + (e1 ? e1.message : e2.message) + '. Bấm "Chép lệnh sửa" rồi dán cho AI.'); }
    }
    return { data: v, notes };
  }

  /* ---------- 1b. Markdown chuẩn của phiếu ôn tập (mẫu: Xuong.MAU_MD_ONTAP; xuất ngược: OnTap.toMd) ---------- */
  function mdOf(raw) {
    let t = String(raw || '').replace(/^\uFEFF/, '').trim();
    const m = t.match(/```(?:markdown|md)\s*([\s\S]*?)```/i); if (m) t = m[1].trim();
    return /^---\s*\n[\s\S]*?loai:\s*on_tap_toan/.test(t) ? t : '';
  }
  function mdToJson(t) {
    const fm = t.match(/^---\s*\n([\s\S]*?)\n---/), j = { loai: 'on_tap_toan', muc_tieu: [], kien_thuc: [], phan: [], tu_danh_gia: [] };
    (fm ? fm[1] : '').split('\n').forEach(l => { const m = l.match(/^(\w+):\s*(.*)$/); if (m) j[m[1]] = /^\d+$/.test(m[2].trim()) ? +m[2].trim() : m[2].trim().replace(/^"|"$/g, ''); });
    const body = fm ? t.slice(fm[0].length) : t, bai = {};
    let sec = '', cur = null, phan = null;
    body.split('\n').forEach(raw => {
      const l = raw.replace(/\s+$/, ''); let m;
      if ((m = l.match(/^##\s+(.*)$/))) {
        const h = m[1]; cur = null;
        if (/^Mục tiêu/i.test(h)) sec = 'mt'; else if (/^(Nhắc nhanh|Kiến thức cần nhớ)/i.test(h)) sec = 'kt'; else if (/^Tự đánh giá/i.test(h)) sec = 'tdg';
        else if (/^Đáp án/i.test(h)) sec = 'da';
        else if ((m = h.match(/^Phần\s+\S+\s*[–-]\s*(.+?)\s*\((\d+)\s*phút\)/i))) { sec = 'ph'; phan = { muc: m[1].trim(), phut: +m[2], bai: [] }; j.phan.push(phan); }
        else sec = '';
        return;
      }
      if ((m = l.match(/^###\s+Bài\s+(\d+)/i))) {
        const n = +m[1];
        if (sec === 'ph' && phan) { cur = bai[n] = { so: n, de: '', loi_giai: [] }; phan.bai.push(cur); }
        else if (sec === 'da') cur = bai[n] || null;
        return;
      }
      if (sec === 'mt' && (m = l.match(/^[-*]\s+(.*)/))) j.muc_tieu.push(m[1]);
      else if (sec === 'kt' && (m = l.match(/^[-*]\s+(.*)/))) j.kien_thuc.push(m[1]);
      else if (sec === 'tdg' && (m = l.match(/^[-*]\s+(?:\[[ x]\]\s*)?(.*)/))) j.tu_danh_gia.push(m[1]);
      else if (sec === 'ph' && cur) {
        if ((m = l.match(/^\*Nguồn:\*\s*(.*)/i))) cur.nguon = m[1];
        else if ((m = l.match(/^\*Cần nhớ:\*\s*(.*)/i))) cur.can_nho = m[1];
        else if ((m = l.match(/^>\s*Gợi ý:\s*(.*)/i))) cur.goi_y = m[1];
        else if ((m = l.match(/^\*Dòng kẻ:\*\s*(\d+)/i))) cur.dong_ke = +m[1];
        else if (l.trim()) cur.de += (cur.de ? '\n' : '') + l.trim();
      } else if (sec === 'da' && cur) {
        if ((m = l.match(/^\*\*Đáp số:\*\*\s*(.*)/i))) cur.dap_so = m[1];

    return [`Bài: ${b[1]} (${PT(b[2])} điểm) | Đề số ${a}–${z} (${o.moi} đề) | Mức: ${o.muc} | Cấu trúc theo: ${o.theo || 'các đề tuyển sinh và đề tham khảo trong notebook'}`,
      `Tổng hợp các đề, hướng dẫn chấm và bài tập trong notebook; mỗi đề đúng dạng ${b[1].split(' – ')[0]} của đề tuyển sinh, ${PT(b[2])} điểm; đổi số liệu và bối cảnh; các đề khác nhau về dạng câu hỏi.`,
      o.rieng ? `Yêu cầu riêng: ${o.rieng}` : '',
      `Trả về đúng một khối ${BT}json theo mẫu trong hướng dẫn ("loai":"luyen_de_toan", "bai":${/^\d+$/.test(o.bai) ? o.bai : `"${o.bai}"`}, đủ ${o.moi} đề, "loi_giai" chia bước, công thức trong $...$).`].filter(Boolean).join('\n');
  }

  /* ---------- Giao diện ---------- */
  const shell = (back, body) => `${App.topBar()}<main class="wrap"><div class="toolbar"><a class="back" href="${back}">← ${back === '#/' ? 'Chọn lớp' : 'Xưởng dữ liệu'}</a></div>${body}</main>`;
  const box = (id, title, text, note) => `<div class="card xw-box"><div class="xw-h"><b>${title}</b><button class="btn" type="button" data-copy="${id}">📋 Chép</button></div>
    ${note ? `<p class="muted">${note}</p>` : ''}<textarea id="${id}" class="xw-ta" readonly rows="8">${esc(text)}</textarea></div>`;
  function bindCopy(root) {
    root.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
      const ok = await U.copy($i(b.dataset.copy).value);
      U.toast(ok ? 'Đã chép. Dán vào Gem (hoặc NotebookLM) và gửi.' : 'Không chép được – chọn chữ trong ô rồi chép tay.');
    }));
  }
  function download(name, text, type = 'application/json') {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

      <div class="two"><a class="card link-card" href="#/xuong/prompt"><span class="big">🧾</span><b>Menu prompt</b><span>Ngữ văn vào 10 · Toán luyện đề theo bài · Phiếu ôn tập 90 phút · Bài giảng lớp 9–12</span></a>
        <a class="card link-card" href="#/xuong/nhap"><span class="big">📥</span><b>Nhập dữ liệu</b><span>Dán câu trả lời AI hoặc kéo tệp .json</span></a></div>

      <h2 class="sec">Đã có trong hệ thống (${he.length} tệp)</h2>
      ${he.length ? `<div class="card"><ul class="xw-list">${he.map(x => `<li><b>${esc(x.r.ten || '')}</b> <span class="muted">${esc(x.file || '')}</span>${x.r.errs.length ? ` <span class="chip warnc">${x.r.errs.length} lỗi – chưa hiện</span>` : ''}</li>`).join('')}</ul></div>` : '<p class="empty">Chưa có tệp nào trong data/nhap/.</p>'}`);
    view().querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => { NhapDL.removeLocal(b.dataset.rm); location.reload(); }));

  function promptPage() {
    const st = Object.assign({ loai: 'van', noi: 'gem', tien: 'V', so: 1, n: 5, muc: 'TB', viet: 'xen', ngl: 'ai', theo: '', rieng: '', bai: '3', moi: 5, lan: 2, mucT: 'KHA' }, U.get('xuong:prompt', {}));

          <label class="tog"><input type="radio" name="xLoai" value="ontap" ${st.loai === 'ontap' ? 'checked' : ''}> 🗂️ Toán vào 10 – phiếu ôn tập 90 phút theo chủ đề</label>
          <label class="tog"><input type="radio" name="xLoai" value="baihoc" ${st.loai === 'baihoc' ? 'checked' : ''}> 📚 Bài giảng – luyện tập online lớp 9–12 (SGK KNTT)</label></div>
        <div class="opts-row"><label class="tog"><input type="radio" name="xNoi" value="gem" ${st.noi === 'gem' ? 'checked' : ''}> Gem có gắn notebook (lệnh ngắn)</label>
          <label class="tog"><input type="radio" name="xNoi" value="nb" ${st.noi === 'nb' ? 'checked' : ''}> Dán thẳng vào NotebookLM (lệnh đầy đủ)</label></div>
        <div class="xw-grid" id="xVan">
          <label>Kí hiệu mã đề <input id="xTien" value="${esc(st.tien)}" maxlength="4"></label><label>Bắt đầu từ số <input id="xSo" type="number" min="0" value="${st.so}"></label>
          <label>Số đề <input id="xN" type="number" min="1" max="20" value="${st.n}"></label>
          <label>Mức <select id="xMuc"><option ${st.muc === 'TB' ? 'selected' : ''}>TB</option><option ${st.muc === 'KHA' ? 'selected' : ''}>KHA</option></select></label>

          <label>Ngữ liệu <select id="xNgl"><option value="ai" ${st.ngl === 'ai' ? 'selected' : ''}>Trước 1929 hoặc tự viết</option><option value="tu" ${st.ngl === 'tu' ? 'selected' : ''}>Văn bản tự viết mới</option><option value="cu" ${st.ngl === 'cu' ? 'selected' : ''}>Tác phẩm trước 1929</option></select></label></div>
        <div class="xw-grid" id="xToan">
          <label>Bài <select id="xBai">${BAI_TOAN.map(b => `<option value="${b[0]}" ${st.bai === b[0] ? 'selected' : ''}>${b[1]} (${PT(b[2])}đ)</option>`).join('')}</select></label>
          <label>Bắt đầu từ đề số <input id="xSoT" type="number" min="1" value="${st.so || 1}"></label><label>Số đề mỗi lệnh <input id="xMoi" type="number" min="1" max="10" value="${st.moi}"></label>
          <label>Số lệnh <input id="xLan" type="number" min="1" max="10" value="${st.lan}"></label>

        <div id="xOnTap">
          <div class="xw-grid">
            <label>Chủ đề <select id="oBai">${BAI_TOAN.map(b => `<option value="${b[0]}" ${st.oBai === b[0] ? 'selected' : ''}>${b[1]}</option>`).join('')}</select></label>
            <label>Đợt số (tự tăng) <input id="oDot" type="number" min="1"></label><label>Số phiếu (đợt liên tiếp) <input id="oN" type="number" min="1" max="5" value="${st.oN || 1}"></label>
            <label>Định dạng AI trả về <select id="oDd"><option value="json" ${st.oDd !== 'md' ? 'selected' : ''}>JSON (nhập thẳng vào web)</option><option value="md" ${st.oDd === 'md' ? 'selected' : ''}>Markdown .md chuẩn</option></select></label>
            <label>Bài lấy từ tài liệu <select id="oGoc"><option value="giu" ${st.oGoc !== 'doi' ? 'selected' : ''}>Giữ nguyên đề gốc, ghi nguồn</option><option value="doi" ${st.oGoc === 'doi' ? 'selected' : ''}>Đổi số liệu</option></select></label></div>
          <div class="xw-grid xw-3">
            <label>Cơ bản: số bài <input id="oN1" type="number" min="1" max="8" value="${st.n1 || 4}"></label><label>Cơ bản: phút <input id="oP1" type="number" min="5" max="60" value="${st.p1 || 25}"></label>
            <label>Khá: số bài <input id="oN2" type="number" min="1" max="8" value="${st.n2 || 4}"></label><label>Khá: phút <input id="oP2" type="number" min="5" max="60" value="${st.p2 || 35}"></label>
            <label>Nâng cao: số bài <input id="oN3" type="number" min="1" max="6" value="${st.n3 || 2}"></label><label>Nâng cao: phút <input id="oP3" type="number" min="5" max="60" value="${st.p3 || 25}"></label></div>
          <p class="muted" id="oTong"></p>
          <label class="xw-wide">Bài đã dùng thêm (ngoài các phiếu đã nhập vào web – mỗi dòng một bài: nguồn – tóm tắt) <textarea id="oThem" rows="3" class="xw-ta"></textarea></label>
          <label class="xw-wide">Tài liệu trong notebook để xoay vòng (tuỳ chọn, mỗi dòng một tên; mỗi đợt ưu tiên một nhóm khác) <textarea id="oTl" rows="3" class="xw-ta">${esc(U.get('xuong:tailieu', ''))}</textarea></label>
          <p class="muted" id="oDung"></p></div>
        <div id="xBaiHoc">
          <div class="xw-grid">
            <label>Lớp <select id="bLop">${BaiHoc.LOP.map(l => `<option value="${l}" ${String(st.bhLop || 10) === String(l) ? 'selected' : ''}>Toán ${l}</option>`).join('')}</select></label>
            <label class="xw-wide2">Bài (theo mục lục SGK) <select id="bBai"></select></label>
            <label>Số bài liên tiếp (mỗi bài một lệnh) <input id="bN" type="number" min="1" max="10" value="${st.bN || 1}"></label>
            <label>Học sinh <select id="bMuc"><option value="TB" ${st.bMuc === 'TB' ? 'selected' : ''}>Trung bình</option><option value="KHA" ${!st.bMuc || st.bMuc === 'KHA' ? 'selected' : ''}>Khá</option><option value="GIOI" ${st.bMuc === 'GIOI' ? 'selected' : ''}>Khá, giỏi</option></select></label></div>
          <div class="xw-grid xw-3">
            <label>Trắc nghiệm: số câu <input id="bN1" type="number" min="4" max="20" value="${st.bN1 || 8}"></label>
            <label>Đúng – sai: số câu <input id="bN2" type="number" min="1" max="6" value="${st.bN2 || 2}"></label>
            <label>Trả lời ngắn: số câu <input id="bN3" type="number" min="1" max="10" value="${st.bN3 || 4}"></label></div>
          <p class="muted" id="bCo"></p></div>
        <label class="xw-wide">Cấu trúc theo (tên đề trong notebook, bỏ trống nếu theo cấu trúc chung) <input id="xTheo" value="${esc(st.theo)}"></label>
        <label class="xw-wide">Yêu cầu riêng (lỗi học sinh hay mắc, chủ đề muốn có…) <input id="xRieng" value="${esc(st.rieng)}"></label>
      </div><div id="xOut"></div>`);
    const draw = () => {
      const loai = document.querySelector('[name=xLoai]:checked').value, noi = document.querySelector('[name=xNoi]:checked').value;
      $i('xVan').hidden = loai !== 'van'; $i('xToan').hidden = loai !== 'toan'; $i('xOnTap').hidden = loai !== 'ontap'; $i('xBaiHoc').hidden = loai !== 'baihoc';
      $i('xTheo').parentElement.hidden = loai === 'ontap' || loai === 'baihoc';
      const bLop = $i('bLop').value;
      if ($i('bLop').dataset.last !== bLop) {
        const want = $i('bLop').dataset.last ? '' : String(st.bhBai || '');
        $i('bBai').innerHTML = BaiHoc.all(+bLop).map(b => `<option value="${b.so}" ${String(b.so) === want ? 'selected' : ''}>Bài ${b.so}. ${esc(b.ten)}${BaiHoc.get(+bLop, b.so) ? ' ✓' : ''}</option>`).join('');
        $i('bLop').dataset.last = bLop;
      }
      const oBai = $i('oBai').value; if ($i('oBai').dataset.last !== oBai) { $i('oDot').value = OnTap.nextDot(oBai); $i('oThem').value = U.get('xuong:them:' + oBai, ''); $i('oBai').dataset.last = oBai; }
      const o = { loai, noi, tien: $i('xTien').value.trim() || 'V', so: loai === 'van' ? +$i('xSo').value || 0 : +$i('xSoT').value || 1, n: Math.min(+$i('xN').value || 1, 20), muc: $i('xMuc').value,
        viet: $i('xViet').value, ngl: $i('xNgl').value, theo: $i('xTheo').value.trim(), rieng: $i('xRieng').value.trim(),
        bai: $i('xBai').value, moi: Math.min(+$i('xMoi').value || 5, 10), lan: Math.min(+$i('xLan').value || 1, 10), mucT: $i('xMucT').value,
        oBai, oN: Math.min(+$i('oN').value || 1, 5), oDd: $i('oDd').value, oGoc: $i('oGoc').value,
        bhLop: bLop, bhBai: $i('bBai').value, bN: Math.min(+$i('bN').value || 1, 10), bMuc: $i('bMuc').value,
        bN1: Math.min(Math.max(+$i('bN1').value || 8, 4), 20), bN2: Math.min(+$i('bN2').value || 2, 6), bN3: Math.min(+$i('bN3').value || 4, 10),
        n1: +$i('oN1').value || 4, n2: +$i('oN2').value || 4, n3: +$i('oN3').value || 2, p1: +$i('oP1').value || 25, p2: +$i('oP2').value || 35, p3: +$i('oP3').value || 25 };
      U.set('xuong:prompt', o); U.set('xuong:tailieu', $i('oTl').value); U.set('xuong:them:' + oBai, $i('oThem').value);
      const soat = 90 - o.p1 - o.p2 - o.p3;
      $i('oTong').textContent = `Tổng: ${o.n1 + o.n2 + o.n3} bài · ${o.p1 + o.p2 + o.p3} phút làm + ${soat} phút soát = 90 phút${soat < 0 || soat > 15 ? ' ⚠️ chỉnh lại để thời gian soát từ 0 đến 15 phút' : ''}.`;
      $i('oDung').textContent = `Đã dùng ở các phiếu ${OnTap.TEN[oBai] ? 'của chủ đề này' : ''} trong web: ${OnTap.daDung(oBai).length} bài – lệnh tự đưa vào danh sách "Đã dùng" để đợt mới không lặp.`;
      const coBH = BaiHoc.all(+bLop).filter(b => BaiHoc.get(+bLop, b.so));
      $i('bCo').textContent = `Toán ${bLop}: ${coBH.length}/${BaiHoc.all(+bLop).length} bài đã có bài giảng trên web (đánh dấu ✓). Bài đã có thì lệnh tự liệt kê câu cũ để AI soạn câu mới; nhập bản mới sẽ thay bản cũ.`;
      const hd = loai === 'van' ? HD_VAN : loai === 'ontap' ? HD_ONTAP(o.oDd === 'md') : loai === 'baihoc' ? HD_BAIHOC : HD_TOAN;
      const ls = loai === 'van' ? Array.from({ length: o.n }, (_, k) => lenhVan(o, k))
        : loai === 'ontap' ? Array.from({ length: o.oN }, (_, k) => lenhOnTap({ bai: oBai, dot: +$i('oDot').value || 1, dd: o.oDd, goc: o.oGoc, n1: o.n1, n2: o.n2, n3: o.n3, p1: o.p1, p2: o.p2, p3: o.p3, rieng: o.rieng, them: $i('oThem').value, tl: $i('oTl').value }, k))
        : loai === 'baihoc' ? Array.from({ length: o.bN }, (_, k) => lenhBaiHoc({ lop: bLop, bai: o.bhBai, muc: o.bMuc, n1: o.bN1, n2: o.bN2, n3: o.bN3, rieng: o.rieng }, k)).filter(Boolean)
        : Array.from({ length: o.lan }, (_, k) => lenhToan({ ...o, muc: o.mucT }, k));
      const full = l => noi === 'nb' ? `${hd}\n\n=== LỆNH ===\n${l}` : l;
      $i('xOut').innerHTML = (noi === 'gem' ? box('xHd', '① Hướng dẫn Gem (dán một lần vào mục Hướng dẫn của Gem)', hd, 'Mục Kiến thức của Gem: thêm notebook NotebookLM chứa tài liệu.') : '')
        + `<div class="card xw-box"><div class="xw-h"><b>${noi === 'gem' ? '②' : '①'} Lệnh ${loai === 'ontap' ? 'từng phiếu' : loai === 'baihoc' ? 'từng bài' : 'từng đề'} (${ls.length})</b><button class="btn" type="button" id="xAll">⬇️ Tải tất cả lệnh (.txt)</button></div>
          <p class="muted">${noi === 'gem' ? 'Mỗi lệnh gửi trong một cuộc trò chuyện mới của Gem.' : 'NotebookLM có thể cắt câu trả lời dài: nếu JSON bị cụt, dùng Gem hoặc giảm số đề mỗi lệnh.'}</p>
          ${ls.map((l, i) => `<div class="xw-h"><span>Lệnh ${i + 1}</span><button class="btn ghost" type="button" data-copy="xL${i}">📋 Chép lệnh ${i + 1}</button></div><textarea id="xL${i}" class="xw-ta" readonly rows="${noi === 'nb' ? 6 : 5}">${esc(full(l))}</textarea>`).join('')}</div>`
        + box('xSua', `${noi === 'gem' ? '③' : '②'} Lệnh sửa (khi AI trả về sai mẫu, thiếu chấm điểm)`, SUA(loai === 'van' ? 'de_van' : loai === 'ontap' ? 'on_tap_toan' : loai === 'baihoc' ? 'bai_hoc' : 'luyen_de_toan'), 'Trang Nhập dữ liệu tự tạo lệnh sửa kèm danh sách lỗi cụ thể (cả bài bị trùng đợt trước).');
      bindCopy($i('xOut'));
      $i('xAll').addEventListener('click', () => download(`lenh-${loai}-${new Date().toISOString().slice(0, 10)}.txt`, ls.map(full).join('\n=====\n'), 'text/plain'));
    };
    view().querySelectorAll('input, select, textarea').forEach(x => x.addEventListener('input', draw));
    draw();
  }

  /* ---------- Nhập dữ liệu ---------- */
  function previewHTML(j, r) {
    if (r.loai === 'de_van') return Van.sheetHTML(NhapDL.vanEntry(j, 'xem'), { muc: 'day' });

<script>/* assets/js/math.js */
/* =====================================================================
   MATH – cấu hình MathJax 3 (bản đặt sẵn trong assets/vendor/mathjax, chạy không cần mạng)
   và tự vẽ công thức mỗi khi nội dung trang đổi. Nạp TRƯỚC tex-chtml.js.
   ===================================================================== */
window.MathJax = {
  loader: { load: [] },
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']], processEscapes: false },
  chtml: { scale: 1.02, matchFontHeight: false, displayAlign: 'left', displayIndent: '0' },
  options: { enableMenu: false, ignoreHtmlClass: 'no-math', processHtmlClass: 'math' },
  startup: {
    typeset: false,
    ready() {
      MathJax.startup.defaultReady();
      MathJax.startup.promise.then(() => MathTS.start());
    },
  },
};

const MathTS = (() => {
  const queued = new Set(); let timer = null, busy = Promise.resolve(), started = false;
  const HAS = /\\\(|\\\[/;
  function flush() {
    timer = null;
    const nodes = [...queued]; queued.clear();
    if (!window.MathJax || !MathJax.typesetPromise) return;
    busy = busy.then(async () => {
      for (const n of nodes) {
        if (!n.isConnected || !HAS.test(n.textContent)) continue;
        try { await MathJax.typesetPromise([n]); fit(n); }
        catch (e) { if (n.isConnected) setTimeout(() => add(n), 30); }
      }
    });
  }
  // Công thức dài hơn khung (điện thoại): cho cuộn ngang riêng công thức đó, trang không bị tràn.
  function fit(root) {
    (root || document.body).querySelectorAll('mjx-container').forEach(c => {
      c.classList.remove('mjx-wide');
      const box = c.parentElement && c.parentElement.closest('li, p, div, td, th, section, article');
      const inner = c.firstElementChild, w = Math.max(c.getBoundingClientRect().width, inner ? inner.getBoundingClientRect().width : 0);
      if (box && w > box.clientWidth + 1) c.classList.add('mjx-wide');
    });
  }
  let rz = null;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => fit(document.body), 150); });
  function add(n) {
    if (!n || n.nodeType !== 1) n = n && n.parentElement;
    if (!n || n.closest('mjx-container')) return;
    queued.add(n); if (!timer) timer = setTimeout(flush, 0);
  }
  function start() {
    started = true;
    add(document.body);
    new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(add)))
      .observe(document.body, { childList: true, subtree: true });
  }
  // Chờ vẽ xong công thức trong một vùng (dùng trước khi in). Không có MathJax thì trả về ngay.
  async function done(node) {
    for (let i = 0; i < 100 && !started; i++) await new Promise(r => setTimeout(r, 100));
    if (!window.MathJax || !MathJax.typesetPromise) return;
    await busy;
    try { await MathJax.typesetPromise([node || document.body]); fit(node); } catch (e) { /* bỏ qua */ }
  }
  return { start, typeset: add, done, fit };
})();

</script>

<script>/* data/vao-10/cd02-pt-bac-hai-viete.js */
/* Chủ đề 2 – Bài 2 (1 điểm): Phương trình bậc hai – điều kiện có nghiệm, định lí Viète. */
Topics.add({
  id: 'pt-bac-hai-viete', no: 2, bai: 'Bài 2 · 1 điểm',
  title: 'Phương trình bậc hai – điều kiện có nghiệm, định lí Viète',
  desc: 'Xét dấu Δ để biết số nghiệm; dùng Viète tính giá trị biểu thức của hai nghiệm mà không giải phương trình.',
  remind: [
    S`\(\Delta = b^2 - 4ac\); \(b = 2b'\) thì \(\Delta' = b'^2 - ac\).`,
    S`\(\Delta \gt 0\): 2 nghiệm phân biệt; \(\Delta = 0\): nghiệm kép; \(\Delta \lt 0\): vô nghiệm.`,
    S`\(a \cdot c \lt 0 \Rightarrow\) luôn có 2 nghiệm phân biệt trái dấu.`,
    S`Viète: \(S = x_1 + x_2 = -\dfrac{b}{a}\), \(P = x_1 x_2 = \dfrac{c}{a}\).`,
  ],
  theory: [
    { t: 'Số nghiệm theo biệt thức',
      b: S`<p>Phương trình \(ax^2 + bx + c = 0\ (a \ne 0)\), biệt thức \(\Delta = b^2 - 4ac\).</p>
        <table><tr><th>\(\Delta\)</th><th>Số nghiệm</th><th>Công thức</th></tr>
        <tr><td>\(\Delta \gt 0\)</td><td>2 nghiệm phân biệt</td><td>\(x_{1,2} = \dfrac{-b \pm \sqrt\Delta}{2a}\)</td></tr>
        <tr><td>\(\Delta = 0\)</td><td>nghiệm kép</td><td>\(x_1 = x_2 = -\dfrac{b}{2a}\)</td></tr>
        <tr><td>\(\Delta \lt 0\)</td><td>vô nghiệm</td><td>—</td></tr></table>
        <p>Khi \(b = 2b'\) (hệ số b chẵn) dùng \(\Delta' = b'^2 - ac\), nghiệm \(x_{1,2} = \dfrac{-b' \pm \sqrt{\Delta'}}{a}\).</p>` },
    { t: 'Điều kiện có nghiệm',
      b: S`<ul><li>Có nghiệm \(\iff \Delta \ge 0\) (hoặc \(\Delta' \ge 0\)).</li><li>Có 2 nghiệm phân biệt \(\iff \Delta \gt 0\).</li>
        <li>Nếu \(a \cdot c \lt 0\) thì \(\Delta = b^2 - 4ac \gt 0\): phương trình chắc chắn có 2 nghiệm phân biệt, trái dấu.</li></ul>`,
      warn: S`Phương trình có tham số m: tìm điều kiện có nghiệm TRƯỚC, cuối bài phải đối chiếu giá trị m tìm được với điều kiện đó.` },
    { t: 'Định lí Viète',
      b: S`<p>Nếu \(x_1, x_2\) là hai nghiệm của \(ax^2 + bx + c = 0\ (a \ne 0)\) thì
        \[S = x_1 + x_2 = -\frac{b}{a}, \qquad P = x_1 x_2 = \frac{c}{a}.\]</p>
        <p>Nhẩm nghiệm: \(a + b + c = 0 \Rightarrow x_1 = 1,\ x_2 = \dfrac{c}{a}\); \(a - b + c = 0 \Rightarrow x_1 = -1,\ x_2 = -\dfrac{c}{a}\).</p>` },
    { t: 'Biểu thức đối xứng – đưa về S và P',
      b: S`<table><tr><th>Biểu thức</th><th>Theo S, P</th></tr>
        <tr><td>\(x_1^2 + x_2^2\)</td><td>\(S^2 - 2P\)</td></tr>
        <tr><td>\((x_1 - x_2)^2\)</td><td>\(S^2 - 4P\)</td></tr>
        <tr><td>\(\dfrac{1}{x_1} + \dfrac{1}{x_2}\)</td><td>\(\dfrac{S}{P}\)</td></tr>
        <tr><td>\(\dfrac{x_1}{x_2} + \dfrac{x_2}{x_1}\)</td><td>\(\dfrac{S^2 - 2P}{P}\)</td></tr>
        <tr><td>\(x_1^3 + x_2^3\)</td><td>\(S^3 - 3SP\)</td></tr></table>
        <p><b>Biểu thức không đối xứng</b> (ví dụ có \(x_1^2\) mà không có \(x_2^2\)): dùng \(x_1\) là nghiệm, \(a x_1^2 = -b x_1 - c\), để hạ bậc rồi mới dùng Viète.</p>` },
  ],
  tips: [
    { t: 'Tổng trừ b, tích c chia a', b: S`\(S = -\dfrac{b}{a}\) (nhớ dấu trừ), \(P = \dfrac{c}{a}\) (không có dấu trừ).` },
    { t: 'a, c trái dấu – chắc chắn có nghiệm', b: S`Thấy \(a \cdot c \lt 0\) là kết luận ngay hai nghiệm phân biệt, khỏi tính \(\Delta\).` },
    { t: 'Trước Viète phải có nghiệm', b: 'Luôn viết một dòng: "Vì Δ > 0 (hoặc a·c < 0) nên phương trình có hai nghiệm x₁, x₂. Theo Viète…". Thiếu dòng này là mất điểm.' },
    { t: 'Bình phương tổng trừ hai tích', b: S`\(x_1^2 + x_2^2 = (x_1 + x_2)^2 - 2x_1x_2 = S^2 - 2P\).` },
    { t: 'Không đối xứng thì hạ bậc', b: S`Thay \(x_1^2\) bằng \(\dfrac{-b x_1 - c}{a}\) (vì \(x_1\) là nghiệm) rồi gom về \(S, P\).` },
  ],
  quiz: [
    { q: S`Phương trình \(2x^2 - 5x - 3 = 0\) có \(\Delta\) bằng`, a: ['49', '1', '−1', '25'], why: S`\(\Delta = (-5)^2 - 4 \cdot 2 \cdot (-3) = 25 + 24 = 49\).` },
    { q: S`Phương trình \(x^2 + 4x + 5 = 0\)`, a: ['Vô nghiệm', 'Có nghiệm kép', 'Có hai nghiệm phân biệt', 'Có hai nghiệm trái dấu'], why: S`\(\Delta' = 2^2 - 5 = -1 \lt 0\) nên vô nghiệm.` },
    { q: S`Nếu \(a \cdot c \lt 0\) thì phương trình \(ax^2 + bx + c = 0\)`, a: ['Luôn có hai nghiệm phân biệt trái dấu', 'Luôn vô nghiệm', 'Luôn có nghiệm kép', 'Có hai nghiệm cùng dấu'], why: S`\(\Delta = b^2 - 4ac \gt 0\) vì \(-4ac \gt 0\); tích hai nghiệm \(\dfrac{c}{a} \lt 0\) nên trái dấu.` },
    { q: S`Phương trình \(x^2 - 7x + 10 = 0\) có tổng và tích hai nghiệm là`, a: ['S = 7, P = 10', 'S = −7, P = 10', 'S = 7, P = −10', 'S = 10, P = 7'], why: S`\(S = -\dfrac{-7}{1} = 7\), \(P = \dfrac{10}{1} = 10\).` },
    { q: S`\(x_1^2 + x_2^2\) viết theo \(S, P\) là`, a: [S`\(S^2 - 2P\)`, S`\(S^2 + 2P\)`, S`\(S^2 - 4P\)`, S`\(S - 2P\)`], why: S`\((x_1 + x_2)^2 = x_1^2 + x_2^2 + 2x_1x_2\) nên \(x_1^2 + x_2^2 = S^2 - 2P\).` },
    { q: S`Phương trình \(3x^2 - 5x + 2 = 0\) có hai nghiệm là`, a: [S`\(1\) và \(\dfrac23\)`, S`\(-1\) và \(-\dfrac23\)`, S`\(1\) và \(-\dfrac23\)`, S`\(\dfrac32\) và \(1\)`], why: S`\(a + b + c = 3 - 5 + 2 = 0\) nên \(x_1 = 1,\ x_2 = \dfrac{c}{a} = \dfrac23\).` },
    { q: S`Phương trình \(x^2 - 2x + m = 0\) có nghiệm khi và chỉ khi`, a: [S`\(m \le 1\)`, S`\(m \lt 1\)`, S`\(m \ge 1\)`, S`\(m \le 4\)`], why: S`\(\Delta' = 1 - m \ge 0 \iff m \le 1\). "Có nghiệm" thì lấy cả dấu bằng.` },
    { q: 'Vì sao phải khẳng định phương trình có nghiệm trước khi dùng Viète?', a: ['Vì Viète chỉ đúng khi phương trình có nghiệm', 'Vì giám khảo thích như vậy', 'Vì để tính Δ cho nhanh', 'Không cần, Viète luôn đúng'], why: S`Phương trình vô nghiệm thì không có \(x_1, x_2\) để nói tổng hay tích. Thiếu bước này bị trừ điểm.` },
  ],
  models: [
    { title: 'Chứng minh có hai nghiệm và tính giá trị biểu thức', pts: 1,
      de: S`Cho phương trình \(2x^2 - 5x - 3 = 0\).<br>a) Chứng minh phương trình có hai nghiệm phân biệt \(x_1, x_2\).<br>b) Không giải phương trình, tính \(A = x_1^2 + x_2^2 - 3x_1x_2\).`,
      steps: [
        { part: 'a) Chứng minh có hai nghiệm – 0,5 điểm' },
        { s: S`\(\Delta = (-5)^2 - 4 \cdot 2 \cdot (-3) = 25 + 24 = 49\).`, p: 0.25 },
        { s: S`Vì \(\Delta = 49 \gt 0\) nên phương trình có hai nghiệm phân biệt \(x_1, x_2\). <i>(Cách khác: \(a \cdot c = 2 \cdot (-3) = -6 \lt 0\).)</i>`, p: 0.25 },
        { part: 'b) Tính A – 0,5 điểm' },
        { s: S`Theo định lí Viète: \(S = x_1 + x_2 = \dfrac52\); \(P = x_1x_2 = -\dfrac32\).`, p: 0.25, warn: 'Sai dấu S (viết −5/2) là lỗi phổ biến nhất.' },
        { s: S`\(A = (x_1 + x_2)^2 - 2x_1x_2 - 3x_1x_2 = S^2 - 5P = \dfrac{25}{4} + \dfrac{15}{2} = \dfrac{55}{4}\).`, p: 0.25 },
      ],
      loi: ['Không kết luận "phương trình có hai nghiệm" trước khi dùng Viète.', 'Viết S = −5/2 (quên dấu trừ của −b/a).', 'Giải phương trình ra nghiệm rồi thay vào khi đề yêu cầu "không giải phương trình".'] },
    { title: 'Biểu thức không đối xứng – hạ bậc bằng nghiệm', pts: 0.5,
      de: S`Gọi \(x_1, x_2\) là hai nghiệm của phương trình \(x^2 - 3x - 1 = 0\). Tính \(E = x_1^2 + 3x_2 - x_1x_2\).`,
      steps: [
        { s: S`\(a \cdot c = -1 \lt 0\) nên phương trình có hai nghiệm phân biệt. Theo Viète: \(S = 3,\ P = -1\).`, p: 0.25 },
        { s: S`Vì \(x_1\) là nghiệm nên \(x_1^2 - 3x_1 - 1 = 0 \Rightarrow x_1^2 = 3x_1 + 1\). Do đó \(E = 3x_1 + 1 + 3x_2 - x_1x_2 = 3S + 1 - P = 9 + 1 + 1 = 11\).`, p: 0.25 },

      loi: ['Cố biến đổi E thành S, P trực tiếp (không được vì E không đối xứng).', 'Quên dấu: −x₁x₂ = −P = +1.'] },

  present: [
    'Tính Δ (hoặc Δ′, hoặc a·c) và viết câu kết luận số nghiệm.',
    'Viết rõ "Theo định lí Viète: S = …, P = …" trước khi biến đổi.',

<script>/* data/vao-10/cd03-xac-suat.js */
/* Chủ đề 3 – Bài 3 (1,5 điểm): Xác suất của biến cố (dạng đơn giản). */
