        de: S`Bác Tư có một mảnh đất hình chữ nhật chiều rộng \(x\) (m) (\(x \gt 10\)), chiều dài hơn chiều rộng 10 m. Bác dùng một phần đất hình chữ nhật có các cạnh 12 m và \(x - 10\) (m) để xây nhà như hình vẽ.<br>a) Viết biểu thức thu gọn biểu diễn diện tích phần làm nhà và diện tích phần đất còn lại theo \(x\).<br>b) Tìm chiều dài, chiều rộng của mảnh đất, biết diện tích phần đất còn lại lớn hơn diện tích phần làm nhà 360 m².`,
        figQ: G({ pts: { A: [0, 20], B: [30, 20], C: [30, 0], D: [0, 0], E: [18, 20], F: [18, 10], H: [30, 10], Z: [-8, 0] }, segs: 'AB BC CD DA EF F-H', hide: 'A B C D E F H Z', texts: [[15, -3.2, 'x + 10 (m)'], [-4.5, 10, 'x (m)'], [24, 14.5, 'Nhà ở'], [24, 8, '12 m'], [12.5, 14.5, 'x − 10']], w: 240 }),
        ans: S`a) Nhà: \(12x - 120\) (m²); còn lại: \(x^2 - 2x + 120\) (m²). b) Rộng 20 m, dài 30 m.`,
        barem: ab([S`a) Diện tích làm nhà: \(12(x - 10) = 12x - 120\) (m²)`, S`Diện tích mảnh đất \(x(x + 10)\); phần còn lại \(x^2 + 10x - (12x - 120) = x^2 - 2x + 120\) (m²)`],
          [S`b) \((x^2 - 2x + 120) - (12x - 120) = 360 \iff x^2 - 14x - 120 = 0\)`, S`\(\iff (x - 20)(x + 6) = 0 \iff x = 20\) (nhận, vì \(x \gt 10\)) hoặc \(x = -6\) (loại). Mảnh đất rộng 20 m, dài 30 m`]),
        loi: ['Không thu gọn biểu thức ở câu a', 'Không đối chiếu điều kiện x > 10 khi nhận nghiệm'] },
      { ten: 'Lối đi quanh vườn – diện tích trồng hoa', nguon: 'Đề tuyển sinh lớp 10 môn Toán năm 2025 – 2026 sở GD&ĐT TP Hồ Chí Minh, Bài 4 (lối đi quanh khu vườn)', pts: 1, h: 120,
        de: S`Một khu vườn hình chữ nhật có chiều dài \(3x\) (m), chiều rộng \(x\) (m) (\(x \gt 3\)). Người ta làm một lối đi rộng 1,5 m chạy sát bên trong, quanh khu vườn; phần đất còn lại để trồng hoa.<br>a) Viết biểu thức thu gọn theo \(x\) biểu diễn diện tích phần đất trồng hoa.<br>b) Biết diện tích phần đất trồng hoa là 969 m². Tính chiều dài và chiều rộng của khu vườn.`,
        figQ: G({ pts: { A: [0, 20], B: [60, 20], C: [60, 0], D: [0, 0], E: [1.5, 18.5], F: [58.5, 18.5], K: [58.5, 1.5], L: [1.5, 1.5], Z: [-16, -8] }, segs: 'AB BC CD DA', dash: 'EF F-K K-L L-E', hide: 'A B C D E F K L Z', texts: [[30, -6.5, '3x (m)'], [-8.5, 9, 'x (m)'], [30, 9, 'Trồng hoa']], w: 260 }),
        ans: S`a) \(3x^2 - 12x + 9\) (m²). b) Dài 60 m, rộng 20 m.`,
        barem: ab([S`a) Phần trồng hoa là hình chữ nhật có các cạnh \(3x - 3\) và \(x - 3\) (m)`, S`Diện tích \((3x - 3)(x - 3) = 3x^2 - 12x + 9\) (m²)`],
          [S`b) \(3x^2 - 12x + 9 = 969 \iff x^2 - 4x - 320 = 0\)`, S`\(\iff (x - 20)(x + 16) = 0 \iff x = 20\) (nhận) hoặc \(x = -16\) (loại). Khu vườn dài 60 m, rộng 20 m`]),
        loi: ['Trừ chiều rộng lối đi một lần (phải trừ 2 · 1,5 m mỗi chiều)', 'Trả lời x mà không tính chiều dài 3x'] },
      { ten: 'Hồ tròn trong vườn hình chữ nhật', nguon: 'Đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP Hồ Chí Minh, Bài 4; Tuyển tập đề tham khảo 2026 – 2027 sở GD&ĐT TP HCM (Cụm 1, đề 2)', pts: 1, h: 120,
        de: S`Một khu vườn hình chữ nhật có chiều rộng \(x\) (m), chiều dài \(y\) (m) (\(y \gt x \gt 0\)). Người ta xây một hồ nước hình tròn tiếp xúc với hai cạnh dài và một cạnh rộng của khu vườn như hình vẽ.<br>a) Viết biểu thức tính diện tích phần còn lại của khu vườn theo \(x\) và \(y\).<br>b) Biết chiều dài gấp 2,5 lần chiều rộng và diện tích phần còn lại là 109,76 m². Tìm kích thước khu vườn (lấy \(\pi \approx 3{,}14\)).`,
        figQ: G({ pts: { A: [0, 8], B: [20, 8], C: [20, 0], D: [0, 0], Z: [-5, -3] }, circles: [{ c: [4, 4], r: 4 }], segs: 'AB BC CD DA', hide: 'A B C D Z', texts: [[10, -2.2, 'y (m)'], [-2.8, 3.6, 'x (m)'], [4, 3.6, 'Hồ']], w: 240 }),
        ans: S`a) \(xy - \dfrac{\pi x^2}{4}\) (m²). b) Rộng 8 m, dài 20 m.`,
        barem: ab([S`a) Hồ tiếp xúc hai cạnh dài nên đường kính bằng \(x\), bán kính \(\tfrac x2\); diện tích hồ \(\pi \cdot \dfrac{x^2}{4}\)`, S`Diện tích còn lại \(xy - \dfrac{\pi x^2}{4}\) (m²)`],
          [S`b) \(y = 2{,}5x\): \(2{,}5x^2 - 0{,}785x^2 = 109{,}76 \iff 1{,}715x^2 = 109{,}76 \iff x^2 = 64\)`, S`\(x = 8\) (vì \(x \gt 0\)), \(y = 20\). Khu vườn rộng 8 m, dài 20 m`]),
        loi: ['Lấy bán kính hồ bằng x', 'Viết x = ±8 mà không loại nghiệm âm'] },
      { ten: 'Hình vành khăn – lối đi quanh hồ tròn', nguon: 'Bộ 15 đề ôn thi tuyển sinh vào lớp 10 THPT môn Toán năm 2026 TP Hồ Chí Minh (Đề luyện 01: lối đi vành khăn)', pts: 1, h: 120,
        de: S`Quanh một hồ nước hình tròn bán kính \(R\) (m), người ta làm một lối đi có dạng hình vành khăn rộng \(w\) (m).<br>a) Viết biểu thức thu gọn tính diện tích \(S\) của lối đi theo \(R\), \(w\) và \(\pi\).<br>b) Biết lối đi rộng 1,5 m và có diện tích 65,94 m². Tính bán kính của hồ (lấy \(\pi \approx 3{,}14\)).`,
        figQ: G({ pts: { O: [0, 0], M: [3, 0], N: [4.5, 0] }, circles: [{ c: 'O', r: 4.5 }, { c: 'O', r: 3 }], fill: [(X, Y, P, u) => ring(X, Y, P, u, 4.5, 3)], segs: 'O-N', dots: 'O', hide: 'M N', lab: { O: [-10, -8] }, texts: [[1.5, 0.35, 'R'], [3.75, 0.35, 'w']], w: 200 }),
        ans: S`a) \(S = \pi(2Rw + w^2)\). b) \(R = 6{,}25\) m.`,
        barem: ab([S`a) Lối đi là phần giữa hai đường tròn bán kính \(R + w\) và \(R\): \(S = \pi(R + w)^2 - \pi R^2\)`, S`\(S = \pi(2Rw + w^2)\)`],
          [S`b) \(3{,}14(3R + 2{,}25) = 65{,}94 \iff 3R + 2{,}25 = 21\)`, S`\(\iff R = 6{,}25\). Bán kính hồ là 6,25 m`]),
        loi: ['Dùng (R + w)² − R² = w² (sai hằng đẳng thức)', 'Thay w = 1,5 nhưng quên bình phương'] },
      { ten: 'Hình quạt – vườn hoa có bờ kè', nguon: 'Bộ 15 đề ôn thi tuyển sinh vào lớp 10 THPT môn Toán năm 2026 TP Hồ Chí Minh (Đề luyện 03: khu vườn hình quạt)', pts: 1, h: 120,
        de: S`Một vườn hoa có dạng hình quạt tròn bán kính \(R\) (m), góc ở tâm \(n^\circ\); xung quanh vườn (gồm hai bán kính và cung tròn) có bờ kè.<br>a) Viết biểu thức tính độ dài cung \(l\) và diện tích \(S\) của vườn theo \(R\), \(n\). Chứng minh \(S = \dfrac{lR}{2}\).<br>b) Biết \(R = 12\) m và tổng chiều dài bờ kè là 40 m. Tính diện tích vườn hoa và số đo góc ở tâm (làm tròn đến hàng phần mười của độ, lấy \(\pi \approx 3{,}14\)).`,
        ans: S`a) \(l = \dfrac{\pi Rn}{180}\), \(S = \dfrac{\pi R^2 n}{360} = \dfrac{lR}{2}\). b) \(S = 96\) m², \(n \approx 76{,}4^\circ\).`,
        barem: ab([S`a) \(l = \dfrac{\pi R n}{180}\); \(S = \dfrac{\pi R^2 n}{360}\)`, S`\(S = \dfrac R2 \cdot \dfrac{\pi R n}{180} = \dfrac{lR}{2}\)`],
          [S`b) Bờ kè: \(2R + l = 40 \Rightarrow l = 40 - 24 = 16\) (m); \(S = \dfrac{16 \cdot 12}{2} = 96\) (m²)`, S`\(n = \dfrac{180\,l}{\pi R} = \dfrac{180 \cdot 16}{3{,}14 \cdot 12} \approx 76{,}4^\circ\)`]),
        loi: ['Quên hai bán kính khi tính chiều dài bờ kè', 'Dùng công thức độ dài cung với n tính bằng radian'] },
      { ten: 'Sân vận động – chu vi đường chạy', nguon: 'Bộ 15 đề ôn thi tuyển sinh vào lớp 10 THPT môn Toán năm 2026 TP Hồ Chí Minh (Đề luyện 04: sân điền kinh); Tuyển tập đề tham khảo 2026 – 2027 sở GD&ĐT TP HCM (Cụm 3, đề 1)', pts: 1, h: 120,
        de: S`Mặt sân của một sân vận động gồm một hình chữ nhật có chiều dài \(x\) (m), chiều rộng \(y\) (m) và hai nửa hình tròn đường kính \(y\) gắn vào hai đầu.<br>a) Viết biểu thức tính chu vi \(P\) (độ dài đường chạy bao quanh) và diện tích \(S\) của mặt sân theo \(x\), \(y\).<br>b) Biết \(y = 50\) m và đường chạy dài 400 m. Tính \(x\) và diện tích mặt sân (lấy \(\pi \approx 3{,}14\)).`,
        ans: S`a) \(P = 2x + \pi y\); \(S = xy + \dfrac{\pi y^2}{4}\). b) \(x = 121{,}5\) m; \(S = 8037{,}5\) m².`,
        barem: ab([S`a) Hai nửa đường tròn ghép thành một đường tròn đường kính \(y\): \(P = 2x + \pi y\)`, S`\(S = xy + \pi\left(\dfrac y2\right)^2 = xy + \dfrac{\pi y^2}{4}\)`],
          [S`b) \(2x + 3{,}14 \cdot 50 = 400 \iff x = 121{,}5\) (m)`, S`\(S = 121{,}5 \cdot 50 + \dfrac{3{,}14 \cdot 2500}{4} = 6075 + 1962{,}5 = 8037{,}5\) (m²)`]),
        loi: ['Cộng cả hai chiều rộng y vào chu vi đường chạy', 'Dùng bán kính bằng y khi tính diện tích hai nửa hình tròn'] },
      { ten: 'Tấm tôn cắt hình tròn – phần bỏ đi', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 16, đề 1: tấm tôn cắt nắp tròn)', pts: 1, h: 120,
        de: S`Từ một tấm tôn hình vuông cạnh \(x\) (cm), người thợ cắt ra một hình tròn có đường kính \(x\) để làm nắp thùng; phần còn lại bị bỏ đi.<br>a) Viết biểu thức thu gọn tính diện tích phần tôn bỏ đi theo \(x\) (lấy \(\pi \approx 3{,}14\)).<br>b) Biết phần tôn bỏ đi có diện tích 774 cm². Tính cạnh tấm tôn và diện tích chiếc nắp.`,
        ans: S`a) \(0{,}215x^2\) (cm²). b) Cạnh 60 cm; nắp 2826 cm².`,
        barem: ab([S`a) Hình tròn bán kính \(\tfrac x2\), diện tích \(\dfrac{\pi x^2}{4} = 0{,}785x^2\)`, S`Phần bỏ đi: \(x^2 - 0{,}785x^2 = 0{,}215x^2\) (cm²)`],
          [S`b) \(0{,}215x^2 = 774 \iff x^2 = 3600 \iff x = 60\) (vì \(x \gt 0\))`, S`Diện tích nắp \(0{,}785 \cdot 3600 = 2826\) (cm²)`]),
        loi: ['Lấy bán kính bằng x', 'Làm tròn π · x²/4 quá sớm'] },
      { ten: 'Hàm số bậc nhất – lợi nhuận quán cà phê', nguon: 'Bộ 15 đề ôn thi tuyển sinh vào lớp 10 THPT môn Toán năm 2026 TP Hồ Chí Minh (Đề luyện 11: quán cà phê)', pts: 1, h: 120,
        de: S`Một quán cà phê mỗi ngày tốn chi phí cố định 1 200 000 đồng (mặt bằng, điện nước, nhân viên). Mỗi ly cà phê có giá vốn 9 000 đồng và bán ra 25 000 đồng.<br>a) Viết hàm số \(L(x)\) (nghìn đồng) biểu diễn lợi nhuận một ngày khi quán bán được \(x\) ly. Bán 60 ly thì quán lãi hay lỗ bao nhiêu?<br>b) Mỗi ngày quán phải bán ít nhất bao nhiêu ly để lợi nhuận đạt ít nhất 1 000 000 đồng?`,
        ans: S`a) \(L(x) = 16x - 1200\); bán 60 ly lỗ 240 nghìn đồng. b) Ít nhất 138 ly.`,
        barem: ab([S`a) Mỗi ly lãi \(25 - 9 = 16\) (nghìn đồng): \(L(x) = 16x - 1200\)`, S`\(L(60) = 960 - 1200 = -240\): bán 60 ly thì lỗ 240 000 đồng`],
          [S`b) \(16x - 1200 \ge 1000 \iff 16x \ge 2200 \iff x \ge 137{,}5\)`, S`\(x\) là số tự nhiên nên ít nhất 138 ly`]),
        loi: ['Quên trừ chi phí cố định', 'Làm tròn 137,5 xuống 137 ly'] },
      { ten: 'Lập phương trình – khuyến mãi mua giày', nguon: '53 đề ôn tập tuyển sinh lớp 10 môn Toán năm 2024 – 2025 sở GD&ĐT TP HCM (Đề 1, Đề 40, Đề 50: khuyến mãi mua giày)', pts: 1, h: 120,
        de: S`Một cửa hàng giày có chương trình khuyến mãi: mua đôi thứ hai được giảm 25% giá niêm yết, đôi thứ ba chỉ phải trả 60% giá niêm yết. Các đôi giày có cùng giá niêm yết \(x\) (đồng).<br>a) Viết biểu thức thu gọn \(T\) là số tiền phải trả khi mua 3 đôi theo chương trình trên.<br>b) Bạn Bình mua 3 đôi giày và trả 1 410 000 đồng. Tính giá niêm yết một đôi. Nếu cửa hàng thay bằng chương trình "giảm 20% mỗi đôi" thì Bình nên chọn chương trình nào?`,
        ans: S`a) \(T = 2{,}35x\). b) \(x = 600\,000\) đồng; chọn chương trình ban đầu (1 410 000 đồng so với 1 440 000 đồng).`,
        barem: ab([S`a) \(T = x + 0{,}75x + 0{,}6x\)`, S`\(T = 2{,}35x\) (đồng)`],
          [S`b) \(2{,}35x = 1\,410\,000 \iff x = 600\,000\) (đồng)`, S`Giảm 20% mỗi đôi: \(3 \cdot 0{,}8 \cdot 600\,000 = 1\,440\,000 \gt 1\,410\,000\). Nên chọn chương trình ban đầu`]),
        loi: ['Hiểu "đôi thứ ba trả 60%" là giảm 60%', 'Không so sánh hai cách khi kết luận'] },
      { ten: 'Lối đi chữ thập – diện tích trồng hoa', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 5, đề 1: hai lối đi trong vườn hoa)', pts: 1, h: 120,
        de: S`Một vườn hoa hình chữ nhật dài 24 m, rộng 16 m. Người ta làm hai lối đi vuông góc với nhau, cùng rộng \(x\) (m) (\(0 \lt x \lt 16\)): một lối song song với chiều dài, một lối song song với chiều rộng, như hình vẽ; phần còn lại trồng hoa.<br>a) Viết biểu thức thu gọn tính diện tích phần trồng hoa theo \(x\).<br>b) Biết diện tích trồng hoa là 273 m². Tìm \(x\).`,
        figQ: G({ pts: { A: [0, 16], B: [24, 16], C: [24, 0], D: [0, 0], E: [0, 8], F: [24, 8], K: [0, 11], L: [24, 11], M: [10, 0], N: [10, 16], P: [13, 0], Q: [13, 16], Z: [-6, 0], W: [27, 0] }, segs: 'AB BC CD DA', dash: 'EF K-L M-N P-Q', hide: 'A B C D E F K L M N P Q Z W', texts: [[12, -2.2, '24 m'], [-3, 4, '16 m'], [11.5, 17, 'x'], [25.2, 9.5, 'x']], w: 240 }),
        ans: S`a) \(x^2 - 40x + 384\) (m²). b) \(x = 3\) m.`,
        barem: ab([S`a) Ghép bốn mảnh trồng hoa được hình chữ nhật có các cạnh \(24 - x\) và \(16 - x\)`, S`Diện tích \((24 - x)(16 - x) = x^2 - 40x + 384\) (m²)`],
          [S`b) \(x^2 - 40x + 384 = 273 \iff x^2 - 40x + 111 = 0 \iff (x - 3)(x - 37) = 0\)`, S`\(x = 3\) (nhận, vì \(0 \lt x \lt 16\)); \(x = 37\) (loại). Lối đi rộng 3 m`]),
        loi: ['Trừ diện tích hai lối đi mà quên phần giao nhau x² được trừ hai lần', 'Không loại nghiệm x = 37'] },
      { ten: 'Độ dài cung – chu vi sân có hai đầu là cung tròn', nguon: '53 đề ôn tập tuyển sinh lớp 10 môn Toán năm 2024 – 2025 sở GD&ĐT TP HCM (Đề 7: chu vi sân vận động có cung tròn, góc AOB = 150°)', pts: 1, h: 120,
        de: S`Mặt sân của một khu thể thao gồm một hình chữ nhật dài 100 m, rộng 60 m; hai đầu sân (hai cạnh rộng) được thay bằng hai cung tròn bằng nhau, mỗi cung có dây cung là cạnh rộng 60 m và có số đo \(120^\circ\).<br>a) Tính bán kính \(R\) của mỗi cung tròn.<br>b) Tính chu vi mặt sân (làm tròn đến hàng phần mười, lấy \(\pi \approx 3{,}14\), \(\sqrt3 \approx 1{,}732\)).`,
        ans: S`a) \(R = 20\sqrt3 \approx 34{,}64\) m. b) Chu vi \(\approx 345{,}0\) m.`,
        barem: ab([S`a) Gọi \(O\) là tâm, dây \(AB = 60\) m, \(\widehat{AOB} = 120^\circ\). Tam giác \(OAB\) cân, kẻ \(OH \perp AB\) thì \(H\) là trung điểm \(AB\) và \(\widehat{AOH} = 60^\circ\)`, S`\(R = OA = \dfrac{AH}{\sin 60^\circ} = \dfrac{30}{\sqrt3/2} = 20\sqrt3 \approx 34{,}64\) (m)`],
          [S`b) Độ dài mỗi cung: \(l = \dfrac{\pi R \cdot 120}{180} = \dfrac{2\pi R}{3} \approx \dfrac{2 \cdot 3{,}14 \cdot 34{,}64}{3} \approx 72{,}52\) (m)`, S`Chu vi \(= 2 \cdot 100 + 2l \approx 200 + 145{,}03 \approx 345{,}0\) (m)`]),
        loi: ['Lấy bán kính bằng nửa dây cung (30 m)', 'Cộng cả hai cạnh rộng 60 m vào chu vi'] },

      loi: ['Viết thời gian làm "một phần ba công việc" là a : 3 nhưng quên phần còn lại là hai phần ba', 'Không thử lại, không loại nghiệm âm'] },
    { ten: 'Chuyển động có sự cố – chuyển sang đi bộ', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 1, đề 2: xe hỏng, đi bộ); Bộ 15 đề ôn thi tuyển sinh vào lớp 10 THPT môn Toán năm 2026 TP Hồ Chí Minh (đề tham khảo: ván trượt)', pts: 1, h: 165,
      de: S`Lan và Mai cùng lúc đạp xe từ nhà Lan đến trường. Khi đạp xe bình thường, vận tốc của Lan gấp 1,5 lần vận tốc của Mai. Đi được 20 phút thì xe của Lan bị hỏng, Lan gửi xe và đi bộ nốt quãng đường còn lại. Biết vận tốc đạp xe của Mai gấp 3 lần vận tốc đi bộ của Lan và hai bạn đến trường cùng lúc. Hỏi hai bạn đi từ nhà Lan đến trường hết bao nhiêu phút? (Các vận tốc không đổi.)`,
      ans: 'Hết 35 phút.',
      barem: [
        [S`Gọi \(v\) (m/phút) là vận tốc đạp xe của Mai và \(t\) (phút) là thời gian hai bạn đi đến trường (\(v \gt 0,\ t \gt 20\)). Vận tốc đạp xe của Lan là \(1{,}5v\), đi bộ là \(\tfrac v3\)`, 0.25],
        [S`Quãng đường Mai đi: \(vt\). Quãng đường Lan đi: \(1{,}5v \cdot 20 + \tfrac v3(t - 20)\)`, 0.25],
        [S`Hai bạn đi cùng quãng đường nên \(30v + \tfrac v3(t - 20) = vt \iff 30 + \tfrac t3 - \tfrac{20}{3} = t\) (chia hai vế cho \(v \gt 0\))`, 0.25],
        [S`\(\iff \tfrac{2t}{3} = \tfrac{70}{3} \iff t = 35\) (thỏa \(t \gt 20\)). Kết luận: 35 phút`, 0.25]],
      loi: ['Đặt quá nhiều ẩn mà không nhận ra có thể chia cho v', 'Quên rằng Lan chỉ đi bộ trong (t − 20) phút'] },
    { ten: 'Chuyển động có sự cố – giảm tốc độ', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 3, đề 1: xe hỏng giảm tốc)', pts: 1, h: 165,
      de: 'Hai xe máy cùng lúc xuất phát từ A đến B. Tốc độ của xe thứ nhất gấp 1,25 lần tốc độ của xe thứ hai. Đi được 40 phút thì xe thứ nhất gặp trục trặc nên phải giảm tốc độ, chỉ còn bằng một nửa tốc độ của xe thứ hai, và chạy với tốc độ đó đến B. Biết hai xe đến B cùng lúc. Hỏi xe thứ hai đi từ A đến B hết bao nhiêu phút?',
      ans: 'Hết 60 phút (1 giờ).',
      barem: [
        [S`Gọi \(v\) (km/phút) là tốc độ xe thứ hai, \(t\) (phút) là thời gian đi từ A đến B (\(v \gt 0,\ t \gt 40\)). Xe thứ nhất: \(1{,}25v\) trong 40 phút đầu, \(0{,}5v\) trong \(t - 40\) phút sau`, 0.25],
        [S`Hai xe đi cùng quãng đường AB: \(1{,}25v \cdot 40 + 0{,}5v(t - 40) = vt\)`, 0.25],
        [S`Chia cho \(v \gt 0\): \(50 + 0{,}5t - 20 = t \iff 0{,}5t = 30\)`, 0.25],
        [S`\(t = 60\) (thỏa \(t \gt 40\)). Kết luận: xe thứ hai đi hết 60 phút`, 0.25]],
      loi: ['Tính tốc độ sau sự cố là một nửa tốc độ cũ của chính xe thứ nhất', 'Không đối chiếu điều kiện t > 40'] },
    { ten: 'Pha trộn theo tỉ lệ – dùng hết nguyên liệu', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 4, đề 1: nhiên liệu từ chất A và B)', pts: 1, h: 165,
      de: 'Một kho có 200 lít chất A và 600 lít chất B. Người ta dùng hai chất này để pha chế hai loại nhiên liệu: loại I có tỉ lệ thể tích A : B = 1 : 4, loại II có tỉ lệ thể tích A : B = 1 : 2. Nếu dùng hết lượng chất A và chất B trong kho thì pha chế được bao nhiêu lít nhiên liệu mỗi loại?',
      ans: '500 lít loại I và 300 lít loại II.',
      barem: [
        [S`Gọi \(x, y\) (lít) là thể tích nhiên liệu loại I, loại II (\(x, y \gt 0\)). Loại I chứa \(\tfrac x5\) lít A và \(\tfrac{4x}{5}\) lít B; loại II chứa \(\tfrac y3\) lít A và \(\tfrac{2y}{3}\) lít B`, 0.25],
        [S`Dùng hết chất A, B: \(\dfrac x5 + \dfrac y3 = 200\); \(\dfrac{4x}{5} + \dfrac{2y}{3} = 600\)`, 0.25],
        [S`Nhân phương trình đầu với 2 rồi trừ vế: \(\tfrac{2x}{5} = 200 \Rightarrow x = 500\); suy ra \(\tfrac y3 = 100 \Rightarrow y = 300\)`, 0.25],
        [S`Thử lại: A dùng \(100 + 100 = 200\), B dùng \(400 + 200 = 600\). Kết luận`, 0.25]],
      loi: ['Hiểu tỉ lệ 1 : 4 là A chiếm 1/4 (đúng là 1/5)', 'Lập phương trình theo số lít A, B thay vì theo lượng nhiên liệu cần tìm rồi trả lời nhầm đại lượng'] },
    { ten: 'Phần trăm – mua sắm khuyến mãi', nguon: '53 đề ôn tập tuyển sinh lớp 10 môn Toán năm 2024 – 2025 sở GD&ĐT TP HCM (Đề số 11: tủ lạnh, máy giặt giảm 40%, 25%)', pts: 1, h: 165,
      de: 'Bạn Lan mua 2 chiếc áo và 3 chiếc quần với tổng giá niêm yết là 1 550 000 đồng. Nhân dịp khuyến mãi, áo được giảm 20%, quần được giảm 10% so với giá niêm yết nên Lan chỉ phải trả 1 330 000 đồng. Tính giá niêm yết của mỗi chiếc áo và mỗi chiếc quần.',
      ans: 'Áo 325 000 đồng/chiếc, quần 300 000 đồng/chiếc.',
      barem: [
        [S`Gọi \(x, y\) (nghìn đồng) là giá niêm yết một chiếc áo, một chiếc quần (\(x, y \gt 0\))`, 0.25],
        [S`Lập hệ \(2x + 3y = 1550\); \(2 \cdot 0{,}8x + 3 \cdot 0{,}9y = 1330 \iff 1{,}6x + 2{,}7y = 1330\)`, 0.25],
        [S`Nhân phương trình đầu với 0,8: \(1{,}6x + 2{,}4y = 1240\); trừ vế: \(0{,}3y = 90 \Rightarrow y = 300\), \(x = 325\)`, 0.25],
        [S`Đối chiếu điều kiện, kết luận: áo 325 000 đồng, quần 300 000 đồng`, 0.25]],
      loi: ['Lấy giảm 20% là nhân 0,2 (đúng là nhân 0,8)', 'Nhân phần trăm cho tổng thay vì cho từng loại'] },
    { ten: 'Chuyển động quanh hình vuông – hai lần gặp nhau', nguon: 'Đề tuyển sinh lớp 10 môn Toán năm 2025 – 2026 sở GD&ĐT TP Hồ Chí Minh, Bài 6', pts: 1, h: 98,
      de: S`Từ vị trí \(A\) của một công viên hình vuông \(ABCD\) cạnh \(a\) (km), hai bạn Hòa và Bình cùng lúc chạy bộ dọc theo các cạnh với vận tốc không đổi, theo hai hướng ngược nhau: Hòa chạy theo hướng \(A \to B \to C \to D\), Bình chạy theo hướng \(A \to D \to C \to B\). Hai bạn gặp nhau lần thứ nhất tại \(E\) trên cạnh \(CD\) với \(AE = 1{,}5\) km, gặp nhau lần thứ hai tại \(F\) trên cạnh \(AB\) với \(AF = 0{,}6\) km. Gọi \(x, y\) (km/h) lần lượt là vận tốc của Hòa và Bình.<br>a) Chứng minh \(\dfrac xy = \dfrac{AB + BC + CE}{AD + DE}\).<br>b) Tìm \(a\) và tỉ số \(\dfrac xy\).`,
      figQ: Fig.geo({ pts: { A: [0, 1.2], B: [1.2, 1.2], C: [1.2, 0], D: [0, 0], E: [0.9, 0], F: [0.6, 1.2] }, segs: 'AB BC CD DA', dash: 'AE', dots: 'E F', lab: { A: [-10, -4], B: [10, -4], C: [10, 10], D: [-10, 10], E: [0, 14], F: [0, -10] }, w: 170 }),
      ans: S`a) Thời gian đến lần gặp thứ nhất bằng nhau. b) \(a = 1{,}2\) km, \(\dfrac xy = \dfrac97\).`,
      barem: [
        [S`a) Hai bạn xuất phát cùng lúc, gặp nhau tại \(E\) nên thời gian bằng nhau: \(\dfrac{AB + BC + CE}{x} = \dfrac{AD + DE}{y} \Rightarrow \dfrac xy = \dfrac{AB + BC + CE}{AD + DE}\)`, 0.25],
        [S`b) Đến lần gặp thứ nhất, hai bạn chạy tổng cộng \(4a\); đến lần gặp thứ hai tổng cộng \(8a\), nên thời gian gấp đôi và quãng đường của Bình cũng gấp đôi: \(AD + DC + CB + BF = 2(AD + DE)\)`, 0.25],
        [S`\(\iff 3a + (a - 0{,}6) = 2a + 2DE \iff DE = a - 0{,}3\). Tam giác \(ADE\) vuông tại \(D\): \(a^2 + (a - 0{,}3)^2 = 1{,}5^2\)`, 0.25],
        [S`\(\iff a^2 - 0{,}3a - 1{,}08 = 0 \iff a = 1{,}2\) (loại \(a = -0{,}9\)). \(DE = 0{,}9\), \(CE = 0{,}3\): \(\dfrac xy = \dfrac{2{,}4 + 0{,}3}{1{,}2 + 0{,}9} = \dfrac97\)`, 0.25]],
      loi: ['Không giải thích vì sao thời gian đến lần gặp thứ hai gấp đôi lần thứ nhất', 'Quên điều kiện 0 < DE < a khi nhận nghiệm'] },
    { ten: 'Năng suất – vượt kế hoạch', nguon: 'Bộ đề tham khảo tuyển sinh lớp 10 môn Toán 2025 – 2026 sở GD&ĐT TP Hồ Chí Minh (Đề 02: hai cửa hàng vượt 15%, 20%); Bộ đề tham khảo môn Toán tuyển sinh 10 năm 2024 – 2025 sở GD&ĐT TP Hồ Chí Minh (Nhà Bè, đề 1)', pts: 1, h: 165,
      de: 'Theo kế hoạch, trong một tháng hai tổ sản xuất phải làm 720 sản phẩm. Thực tế tổ I làm vượt mức kế hoạch 15%, tổ II làm vượt mức kế hoạch 12% nên cả hai tổ làm được 819 sản phẩm. Tính số sản phẩm mỗi tổ phải làm theo kế hoạch.',
      ans: 'Tổ I: 420 sản phẩm; tổ II: 300 sản phẩm.',
      barem: [
        [S`Gọi \(x, y\) (sản phẩm) là số sản phẩm tổ I, II làm theo kế hoạch (\(x, y \in \mathbb N^*\), \(x, y \lt 720\))`, 0.25],
        [S`Lập hệ \(x + y = 720\); \(1{,}15x + 1{,}12y = 819\)`, 0.25],
        [S`Từ đó \(0{,}15x + 0{,}12y = 99\); thay \(y = 720 - x\): \(0{,}03x = 12{,}6 \Rightarrow x = 420\), \(y = 300\)`, 0.25],
        [S`Đối chiếu điều kiện, kết luận`, 0.25]],
      loi: ['Lập 0,15x + 0,12y = 819 (quên phần kế hoạch)', 'Trả lời số sản phẩm thực tế thay vì theo kế hoạch'] },
    { ten: 'Điện năng tiêu thụ – hai loại bóng đèn', nguon: 'Bộ 15 đề ôn thi tuyển sinh vào lớp 10 THPT môn Toán năm 2026 TP Hồ Chí Minh (Đề luyện số 01: bóng đèn tiết kiệm)', pts: 1, h: 165,
      de: 'Một lớp học dùng 15 bóng đèn gồm hai loại: loại A công suất 12 W, loại B công suất 20 W. Mỗi ngày mỗi bóng thắp sáng 6 giờ. Trong 30 ngày, lượng điện năng các bóng đèn tiêu thụ là 39,6 kWh. Hỏi lớp học dùng bao nhiêu bóng mỗi loại? (Điện năng tiêu thụ = công suất × thời gian; 1 kWh = 1000 Wh.)',
      ans: '10 bóng loại A và 5 bóng loại B.',
      barem: [
        [S`Gọi \(x, y\) là số bóng loại A, B (\(x, y \in \mathbb N\)): \(x + y = 15\)`, 0.25],
        [S`Thời gian thắp mỗi bóng trong 30 ngày: \(6 \cdot 30 = 180\) giờ. Điện năng: \((12x + 20y) \cdot 180 = 39\,600\) (Wh) \(\iff 12x + 20y = 220\)`, 0.25],
        [S`Thay \(x = 15 - y\): \(180 + 8y = 220 \Rightarrow y = 5\), \(x = 10\)`, 0.25],
        [S`Đối chiếu điều kiện, kết luận`, 0.25]],
      loi: ['Không đổi kWh ra Wh (hoặc ngược lại)', 'Quên nhân số giờ trong 30 ngày'] },
    { ten: 'Hệ phương trình đếm – thiệp và hạc giấy', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 9, đề 3: thiệp và hạc giấy)', pts: 1, h: 165,
      de: 'Lớp 9B có 24 học sinh nam và 16 học sinh nữ chuẩn bị quà cho ngày hội. Mỗi bạn nam làm 4 tấm thiệp; mỗi bạn nữ xếp 3 con hạc hoặc 7 con hạc. Biết tổng số tấm thiệp bằng tổng số con hạc. Hỏi có bao nhiêu bạn nữ xếp 3 con hạc và bao nhiêu bạn nữ xếp 7 con hạc?',
      ans: '4 bạn nữ xếp 3 con hạc, 12 bạn nữ xếp 7 con hạc.',
      barem: [
        [S`Gọi \(x, y\) là số bạn nữ xếp 3 con hạc, 7 con hạc (\(x, y \in \mathbb N\), \(x, y \le 16\)): \(x + y = 16\)`, 0.25],
        [S`Số tấm thiệp: \(24 \cdot 4 = 96\). Số con hạc: \(3x + 7y = 96\)`, 0.25],
        [S`Thay \(x = 16 - y\): \(48 + 4y = 96 \Rightarrow y = 12\), \(x = 4\)`, 0.25],
        [S`Đối chiếu điều kiện, kết luận`, 0.25]],
      loi: ['Đặt ẩn là số con hạc thay vì số bạn nữ', 'Không kiểm tra nghiệm là số tự nhiên'] },
    { ten: 'Chuyển động ngược chiều – gặp nhau', nguon: 'Đề tuyển sinh lớp 10 môn Toán năm 2024 – 2025 sở GD&ĐT TP Hồ Chí Minh, Bài 6 (xe máy và ô tô đi ngược chiều)', pts: 1, h: 165,
      de: 'Hai thành phố A và B cách nhau 180 km. Hai xe máy khởi hành cùng lúc từ A và B, đi ngược chiều nhau thì gặp nhau sau 2 giờ. Nếu xe đi từ A khởi hành trước xe đi từ B 54 phút thì hai xe gặp nhau sau khi xe đi từ B đi được 1 giờ 30 phút. Tính vận tốc mỗi xe.',
      ans: 'Xe đi từ A: 50 km/h; xe đi từ B: 40 km/h.',
      barem: [
        [S`Gọi \(x, y\) (km/h) là vận tốc xe đi từ A, từ B (\(x, y \gt 0\)). Đổi 54 phút \(= 0{,}9\) giờ, 1 giờ 30 phút \(= 1{,}5\) giờ`, 0.25],
        [S`Lần 1: \(2x + 2y = 180\). Lần 2: xe từ A đi \(0{,}9 + 1{,}5 = 2{,}4\) giờ: \(2{,}4x + 1{,}5y = 180\)`, 0.25],
        [S`Từ \(y = 90 - x\): \(2{,}4x + 135 - 1{,}5x = 180 \Rightarrow 0{,}9x = 45 \Rightarrow x = 50\), \(y = 40\)`, 0.25],
        [S`Đối chiếu điều kiện, kết luận`, 0.25]],
      loi: ['Quên cộng 54 phút vào thời gian của xe đi trước', 'Đổi 54 phút thành 0,54 giờ'] },
    { ten: 'Phần trăm – điều chỉnh giá căn hộ', nguon: 'Bộ đề tham khảo tuyển sinh lớp 10 môn Toán 2025 – 2026 sở GD&ĐT TP Hồ Chí Minh (Huyện Bình Chánh, Bài 5: 100 căn hộ hai loại, tăng 10%, giảm 5%)', pts: 1, h: 165,
      de: S`Một công ty có 100 căn hộ gồm hai loại. Giá dự kiến căn loại I là 1,5 tỉ đồng, căn loại II là 2,4 tỉ đồng. Khi mở bán, công ty tăng giá căn loại I thêm 10% và giảm giá căn loại II 5% so với giá dự kiến. Bán hết 100 căn, công ty thu được 190,2 tỉ đồng. Hỏi có bao nhiêu căn hộ mỗi loại?`,
      ans: S`60 căn loại I và 40 căn loại II.`,
      barem: [
        [S`Gọi \(x, y\) là số căn loại I, loại II (\(x, y \in \mathbb N\)): \(x + y = 100\)`, 0.25],
        [S`Giá bán: loại I \(1{,}5 \cdot 1{,}1 = 1{,}65\) tỉ, loại II \(2{,}4 \cdot 0{,}95 = 2{,}28\) tỉ: \(1{,}65x + 2{,}28y = 190{,}2\)`, 0.25],
        [S`Thay \(x = 100 - y\): \(165 + 0{,}63y = 190{,}2 \Rightarrow y = 40\), \(x = 60\)`, 0.25],
        [S`Đối chiếu điều kiện, kết luận`, 0.25]],
      loi: ['Tính giá sau điều chỉnh sai: 1,5 + 10% thay vì 1,5 · 1,1', 'Lấy giảm 5% là nhân 0,05'] },
    { ten: 'Đếm bằng hệ – giấy thi trong phòng thi', nguon: '53 đề ôn tập tuyển sinh lớp 10 môn Toán năm 2024 – 2025 sở GD&ĐT TP HCM (Đề số 36: thí sinh làm 1, 2, 3 tờ giấy thi)', pts: 1, h: 165,
      de: S`Một phòng thi có 30 thí sinh; cuối buổi thu được tất cả 70 tờ giấy thi. Có 4 thí sinh chỉ làm 1 tờ, các thí sinh còn lại mỗi người làm 2 tờ hoặc 3 tờ. Hỏi có bao nhiêu thí sinh làm 2 tờ, bao nhiêu thí sinh làm 3 tờ?`,
      ans: S`12 thí sinh làm 2 tờ và 14 thí sinh làm 3 tờ.`,
      barem: [
        [S`Gọi \(x, y\) là số thí sinh làm 2 tờ, 3 tờ (\(x, y \in \mathbb N\)): \(x + y = 30 - 4 = 26\)`, 0.25],
        [S`Số tờ giấy: \(4 + 2x + 3y = 70 \iff 2x + 3y = 66\)`, 0.25],
        [S`Thay \(x = 26 - y\): \(52 + y = 66 \Rightarrow y = 14\), \(x = 12\)`, 0.25],
        [S`Đối chiếu điều kiện, kết luận`, 0.25]],
      loi: ['Quên trừ 4 thí sinh làm 1 tờ', 'Quên cộng 4 tờ của các thí sinh đó'] },
    { ten: 'Phần trăm – tỉ lệ trúng tuyển hai trường', nguon: '53 đề ôn tập tuyển sinh lớp 10 môn Toán năm 2024 – 2025 sở GD&ĐT TP HCM (Đề số 35, Bài 5: hai trường, tỉ lệ đậu 80%, 90%)', pts: 1, h: 165,
      de: S`Hai trường A và B có tổng cộng 450 học sinh dự thi vào lớp 10, trong đó 360 em trúng tuyển. Tỉ lệ trúng tuyển của trường A là 75%, của trường B là 90%. Tính số học sinh dự thi và số học sinh trúng tuyển của mỗi trường.`,
      ans: S`Trường A: 300 dự thi, 225 trúng tuyển; trường B: 150 dự thi, 135 trúng tuyển.`,
      barem: [
        [S`Gọi \(x, y\) là số học sinh dự thi của trường A, B (\(x, y \in \mathbb N^*\)): \(x + y = 450\)`, 0.25],

        ans: S`\(B, F, E, C\) thuộc đường tròn đường kính \(BC\), tâm là trung điểm \(M\) của \(BC\).`,
        barem: q4(S`\(BE, CF\) là đường cao nên \(\widehat{BEC} = \widehat{BFC} = 90^\circ\)`, S`Gọi \(M\) là trung điểm \(BC\). Tam giác \(BEC\) vuông tại \(E\) có \(EM\) là trung tuyến nên \(ME = \dfrac{BC}{2}\)`,
          S`Tương tự \(MF = \dfrac{BC}{2}\); lại có \(MB = MC = \dfrac{BC}{2}\)`, S`Vậy \(B, F, E, C\) cùng thuộc đường tròn tâm \(M\), bán kính \(\dfrac{BC}{2}\)`),
        loi: ['Dùng "hai góc bằng nhau cùng nhìn cạnh BC" (dấu hiệu bị cấm)', 'Không chỉ rõ tâm M'] },
      b: { q: S`Chứng minh \(\triangle ABD \backsim \triangle AKC\) và \(AB \cdot AC = 2R \cdot AD\).`,
        ans: S`\(AB \cdot AC = AD \cdot AK = 2R \cdot AD\).`,
        barem: q4(S`\(\widehat{ACK} = 90^\circ\) (góc nội tiếp chắn nửa đường tròn); \(\widehat{ADB} = 90^\circ\). Vậy \(\widehat{ADB} = \widehat{ACK}\)`, S`\(\widehat{ABD} = \widehat{ABC} = \widehat{AKC}\) (hai góc nội tiếp cùng chắn cung \(AC\))`,
          S`Do đó \(\triangle ABD \backsim \triangle AKC\) (g.g)`, S`\(\Rightarrow \dfrac{AB}{AK} = \dfrac{AD}{AC} \Rightarrow AB \cdot AC = AD \cdot AK = 2R \cdot AD\)`),
        loi: ['Viết sai thứ tự đỉnh tương ứng khi lập tỉ số', 'Không giải thích vì sao hai góc nội tiếp bằng nhau'] },
      c: { q: S`Biết \(\widehat{BAC} = 60^\circ\). Tính độ dài \(BC\) và \(EF\) theo \(R\).`,
        ans: S`\(BC = R\sqrt3\); \(EF = \dfrac{R\sqrt3}{2}\).`,
        barem: q4(S`\(\widehat{BOC} = 2\widehat{BAC} = 120^\circ\) (góc ở tâm và góc nội tiếp cùng chắn cung \(BC\)). Tam giác \(OBC\) cân tại \(O\), kẻ \(OM \perp BC\) thì \(M\) là trung điểm \(BC\), \(\widehat{BOM} = 60^\circ\)`, S`\(BM = OB \sin 60^\circ = \dfrac{R\sqrt3}{2}\), nên \(BC = R\sqrt3\)`,
          S`Tam giác \(ABE\) vuông tại \(E\) có \(\widehat A = 60^\circ\): \(AE = AB\cos 60^\circ = \tfrac12 AB\); tương tự \(AF = \tfrac12 AC\). Suy ra \(\dfrac{AE}{AB} = \dfrac{AF}{AC} = \dfrac12\)`, S`\(\triangle AEF \backsim \triangle ABC\) (c.g.c, \(\widehat A\) chung) \(\Rightarrow EF = \tfrac12 BC = \dfrac{R\sqrt3}{2}\)`),
        loi: ['Dùng "đường kính vuông góc dây đi qua trung điểm" mà không chứng minh lại bằng tam giác cân', 'Lấy tỉ số đồng dạng AE/AC (sai cặp tương ứng)'] } },

    { ten: 'Nửa đường tròn, hai tiếp tuyến Ax, By', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 10, đề 1: nửa đường tròn, tiếp tuyến Ax, By)',
      ch: S`Cho nửa đường tròn tâm \(O\), đường kính \(AB = 2R\). Vẽ các tiếp tuyến \(Ax, By\) với nửa đường tròn (cùng phía với nửa đường tròn). Lấy điểm \(M\) trên nửa đường tròn (\(M \ne A, B\)); tiếp tuyến tại \(M\) cắt \(Ax, By\) lần lượt tại \(C, D\).`,
      fig: G({ pts: { A: [-2, 0], B: [2, 0], O: [0, 0], M: [-1.2, 1.6], C: [-2, 1], D: [2, 4] }, segs: 'A-B A-C B-D C-D O-C O-D O-M', dots: 'O', rights: [['C', 'M', 'O']], rs: 0.18, lab: { O: [0, 14], M: [-8, -6], C: [-12, 0], D: [10, 0] }, fill: [], w: 220, texts: [] }),
      a: { q: S`Chứng minh \(CD = AC + BD\) và \(\widehat{COD} = 90^\circ\).`,
        ans: S`\(CM = CA\), \(DM = DB\); \(OC, OD\) là phân giác của hai góc kề bù \(\widehat{AOM}\), \(\widehat{MOB}\).`,
        barem: q4(S`Theo tính chất hai tiếp tuyến cắt nhau: \(CA = CM\), \(DB = DM\)`, S`Suy ra \(CD = CM + MD = AC + BD\)`,
          S`Cũng theo tính chất đó: \(OC\) là phân giác \(\widehat{AOM}\), \(OD\) là phân giác \(\widehat{MOB}\)`, S`Mà \(\widehat{AOM} + \widehat{MOB} = 180^\circ\) nên \(\widehat{COD} = \tfrac12 \cdot 180^\circ = 90^\circ\)`),
        loi: ['Chỉ viết "theo tính chất" mà không nêu hai tiếp tuyến xuất phát từ điểm nào', 'Quên giải thích hai góc AOM, MOB kề bù'] },
      b: { q: S`Chứng minh \(AC \cdot BD = R^2\).`,
        ans: S`\(AC \cdot BD = CM \cdot MD = OM^2 = R^2\).`,
        barem: q4(S`\(OM \perp CD\) (tiếp tuyến vuông góc bán kính) và \(\widehat{COD} = 90^\circ\)`, S`\(\triangle CMO \backsim \triangle OMD\) (\(\widehat{CMO} = \widehat{OMD} = 90^\circ\), \(\widehat{MCO} = \widehat{MOD}\) cùng phụ \(\widehat{MOC}\))`,
          S`\(\Rightarrow \dfrac{CM}{OM} = \dfrac{OM}{MD} \Rightarrow CM \cdot MD = OM^2 = R^2\)`, S`Mà \(CM = AC\), \(MD = BD\) nên \(AC \cdot BD = R^2\)`),
        loi: ['Dùng thẳng hệ thức h² = b′c′ (phải chứng minh đồng dạng)', 'Không đổi CM, MD về AC, BD ở bước cuối'] },
      c: { q: S`Biết \(AC = \dfrac R2\). Tính \(BD\), \(CD\) và diện tích tứ giác \(ABDC\) theo \(R\).`,
        ans: S`\(BD = 2R\), \(CD = \dfrac{5R}{2}\), \(S_{ABDC} = \dfrac{5R^2}{2}\).`,
        barem: q4(S`Từ \(AC \cdot BD = R^2\): \(BD = \dfrac{R^2}{R/2} = 2R\)`, S`\(CD = AC + BD = \dfrac R2 + 2R = \dfrac{5R}{2}\)`,
          S`\(AC \perp AB\), \(BD \perp AB\) nên \(AC \parallel BD\): \(ABDC\) là hình thang vuông, chiều cao \(AB = 2R\)`, S`\(S_{ABDC} = \dfrac{(AC + BD) \cdot AB}{2} = \dfrac{\tfrac{5R}{2} \cdot 2R}{2} = \dfrac{5R^2}{2}\)`),
        loi: ['Không chứng minh ABDC là hình thang trước khi dùng công thức', 'Nhầm chiều cao là CD'] } },

    { ten: 'Tiếp tuyến và cát tuyến từ một điểm', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 14, đề 3: tiếp tuyến và cát tuyến MAB, I trung điểm AB; Cụm 6, đề 2)',
      ch: S`Từ điểm \(M\) nằm ngoài đường tròn \((O;\ R)\), kẻ tiếp tuyến \(MA\) (\(A\) là tiếp điểm) và cát tuyến \(MBC\) không đi qua \(O\) (\(B\) nằm giữa \(M\) và \(C\)). Gọi \(I\) là trung điểm của \(BC\).`,
      fig: G({ pts: { O: [0, 0], M: [5.2, 0], A: [0.769, 1.846], B: [1.834, -0.798], C: [-1.28, -1.537], I: [0.277, -1.168] }, circles: [{ c: 'O', r: 2 }], segs: 'M-A M-C O-A O-I O-M O-B O-C', dots: 'O I', rights: [['M', 'A', 'O'], ['M', 'I', 'O']], rs: 0.2, lab: { O: [-12, 6], I: [0, 16], B: [8, 14], C: [-10, 12] }, w: 260 }),
      a: { q: S`Chứng minh \(OI \perp BC\) và bốn điểm \(M, A, O, I\) cùng thuộc một đường tròn.`,
        ans: S`\(M, A, O, I\) thuộc đường tròn đường kính \(MO\).`,
        barem: q4(S`\(OB = OC = R\) nên tam giác \(OBC\) cân tại \(O\); \(OI\) là trung tuyến nên cũng là đường cao: \(OI \perp BC\)`, S`\(MA\) là tiếp tuyến nên \(\widehat{MAO} = 90^\circ\); \(\widehat{MIO} = 90^\circ\)`,
          S`Tam giác \(MAO\), \(MIO\) vuông tại \(A, I\) nên \(A, I\) thuộc đường tròn đường kính \(MO\)`, S`Vậy \(M, A, O, I\) cùng thuộc đường tròn tâm là trung điểm \(MO\), bán kính \(\dfrac{MO}{2}\)`),
        loi: ['Viết "đường kính đi qua trung điểm dây thì vuông góc với dây" (bị cấm, phải chứng minh lại)', 'Không nêu tâm, bán kính'] },
      b: { q: S`Chứng minh \(MA^2 = MB \cdot MC = MO^2 - R^2\).`,
        ans: S`Cả hai đều bằng \(MO^2 - R^2\).`,
        barem: q4(S`Tam giác \(MAO\) vuông tại \(A\): \(MA^2 = MO^2 - OA^2 = MO^2 - R^2\)`, S`\(MB \cdot MC = (MI - IB)(MI + IC) = (MI - IB)(MI + IB) = MI^2 - IB^2\) (vì \(IB = IC\))`,
          S`Pythagore: \(MI^2 = MO^2 - OI^2\), \(IB^2 = OB^2 - OI^2 = R^2 - OI^2\)`, S`\(\Rightarrow MB \cdot MC = MO^2 - R^2 = MA^2\)`),
        loi: ['Dùng góc tạo bởi tiếp tuyến và dây cung (không có trong chương trình) mà không giải thích', 'Quên IB = IC khi khai triển'] },
      c: { q: S`Cho \(R = 5\) cm, \(OM = 13\) cm và \(BC = 8\) cm. Tính \(MA\), \(MB\), \(MC\).`,
        ans: S`\(MA = 12\) cm; \(MB = 4\sqrt{10} - 4 \approx 8{,}65\) cm; \(MC = 4\sqrt{10} + 4 \approx 16{,}65\) cm.`,
        barem: q4(S`\(MA = \sqrt{13^2 - 5^2} = 12\) (cm)`, S`\(IB = 4\), \(OI = \sqrt{OB^2 - IB^2} = \sqrt{25 - 16} = 3\) (cm)`,
          S`\(MI = \sqrt{OM^2 - OI^2} = \sqrt{169 - 9} = 4\sqrt{10}\) (cm)`, S`\(MB = MI - IB = 4\sqrt{10} - 4 \approx 8{,}65\) cm; \(MC = 4\sqrt{10} + 4 \approx 16{,}65\) cm (thử lại \(MB \cdot MC = 160 - 16 = 144 = MA^2\))`),
        loi: ['Nhầm MI = MO − OI', 'Làm tròn √10 quá sớm'] } },

    { ten: 'Tam giác vuông, đường tròn đường kính đường cao', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 13, đề 3: đường cao AH, hình chiếu của H trên AB, AC)',
      ch: S`Cho tam giác \(ABC\) vuông tại \(A\) (\(AB \lt AC\)), đường cao \(AH\). Đường tròn đường kính \(AH\) cắt \(AB, AC\) lần lượt tại \(E, F\) (khác \(A\)).`,
      fig: G({ pts: { A: [0, 4.8], B: [-3.6, 0], C: [6.4, 0], H: [0, 0], E: [-2.304, 1.728], F: [2.304, 3.072], I: [0, 2.4] }, circles: [{ c: 'I', r: 2.4, dash: true }], segs: 'A-B B-C C-A A-H H-E H-F E-F', dots: 'I', rights: [['A', 'H', 'C'], ['B', 'A', 'C']], rs: 0.18, rsUnit: 2, lab: { I: [10, 4], H: [0, 14] }, w: 260 }),
      a: { q: S`Chứng minh tứ giác \(AEHF\) là hình chữ nhật và \(EF = AH\).`,
        ans: S`Tứ giác có ba góc vuông là hình chữ nhật; hai đường chéo bằng nhau.`,
        barem: q4(S`\(\widehat{AEH} = 90^\circ\) (góc nội tiếp chắn nửa đường tròn đường kính \(AH\))`, S`Tương tự \(\widehat{AFH} = 90^\circ\); lại có \(\widehat{EAF} = 90^\circ\)`,
          S`Tứ giác \(AEHF\) có ba góc vuông nên là hình chữ nhật`, S`Hai đường chéo của hình chữ nhật bằng nhau: \(EF = AH\)`),
        loi: ['Chỉ nêu hai góc vuông mà kết luận hình chữ nhật', 'Không giải thích vì sao góc AEH vuông'] },
      b: { q: S`Chứng minh \(AE \cdot AB = AF \cdot AC\).`,
        ans: S`Cả hai tích đều bằng \(AH^2\).`,
        barem: q4(S`\(\triangle AEH \backsim \triangle AHB\) (\(\widehat A\) chung, \(\widehat{AEH} = \widehat{AHB} = 90^\circ\))`, S`\(\Rightarrow \dfrac{AE}{AH} = \dfrac{AH}{AB} \Rightarrow AE \cdot AB = AH^2\)`,
          S`Tương tự \(\triangle AFH \backsim \triangle AHC\) \(\Rightarrow AF \cdot AC = AH^2\)`, S`Vậy \(AE \cdot AB = AF \cdot AC\)`),
        loi: ['Dùng thẳng hệ thức lượng AE·AB = AH² mà không chứng minh', 'Ghép sai cặp tam giác đồng dạng'] },
      c: { q: S`Cho \(AB = 6\) cm, \(AC = 8\) cm. Tính \(AH\), \(AE\), \(AF\) và diện tích hình chữ nhật \(AEHF\).`,
        ans: S`\(AH = 4{,}8\); \(AE = 3{,}84\); \(AF = 2{,}88\) (cm); \(S = 11{,}0592\) cm².`,
        barem: q4(S`\(BC = \sqrt{36 + 64} = 10\); \(AH \cdot BC = AB \cdot AC\) (cùng bằng hai lần diện tích) \(\Rightarrow AH = \dfrac{48}{10} = 4{,}8\) (cm)`, S`\(AE = \dfrac{AH^2}{AB} = \dfrac{23{,}04}{6} = 3{,}84\) (cm)`,
          S`\(AF = \dfrac{AH^2}{AC} = \dfrac{23{,}04}{8} = 2{,}88\) (cm)`, S`\(S_{AEHF} = AE \cdot AF = 3{,}84 \cdot 2{,}88 = 11{,}0592\) (cm²)`),
        loi: ['Tính AH = AB·AC/BC mà không giải thích (dùng diện tích)', 'Nhầm AE với AF'] } },

    { ten: 'Hai tiếp tuyến, đường kính CD song song với OA', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 11, đề 3: hai tiếp tuyến, đường kính CD, BD // OA)',
      ch: S`Từ điểm \(A\) nằm ngoài đường tròn \((O;\ R)\), kẻ hai tiếp tuyến \(AB, AC\) (\(B, C\) là tiếp điểm). Gọi \(H\) là giao điểm của \(OA\) và \(BC\). Vẽ đường kính \(CD\) của \((O)\).`,
      fig: G({ pts: { A: [3.333, 0], B: [1.2, 1.6], C: [1.2, -1.6], D: [-1.2, 1.6], O: [0, 0], H: [1.2, 0] }, circles: [{ c: 'O', r: 2 }], segs: 'A-B A-C B-C O-A C-D B-D O-B', dots: 'O', rights: [['A', 'B', 'O'], ['B', 'H', 'A']], rs: 0.18, lab: { O: [-10, 12], H: [9, 14] }, w: 240 }),
      a: { q: S`Chứng minh \(OA\) là đường trung trực của \(BC\) và \(OA \perp BC\) tại \(H\).`,
        ans: S`\(AB = AC\), \(OB = OC\) nên \(OA\) là trung trực của \(BC\).`,
        barem: q4(S`Theo tính chất hai tiếp tuyến cắt nhau: \(AB = AC\)`, S`\(OB = OC = R\)`,
          S`Hai điểm \(A, O\) cách đều \(B, C\) nên \(OA\) là đường trung trực của \(BC\)`, S`Do đó \(OA \perp BC\) tại trung điểm \(H\) của \(BC\)`),
        loi: ['Chỉ nêu AB = AC mà quên OB = OC', 'Kết luận vuông góc nhưng không nêu H là trung điểm'] },
      b: { q: S`Chứng minh \(BD \parallel OA\).`,
        ans: S`Cùng vuông góc với \(BC\).`,
        barem: q4(S`\(\widehat{CBD}\) là góc nội tiếp chắn nửa đường tròn đường kính \(CD\)`, S`nên \(\widehat{CBD} = 90^\circ\), tức \(BD \perp BC\)`,
          S`Theo câu a, \(OA \perp BC\)`, S`Hai đường thẳng \(BD\), \(OA\) cùng vuông góc với \(BC\) nên \(BD \parallel OA\)`),
        loi: ['Không giải thích vì sao góc CBD vuông', 'Dùng OH là đường trung bình mà không chứng minh'] },
      c: { q: S`Cho \(R = 3\) cm, \(OA = 5\) cm. Tính \(AB\), \(BC\), \(BD\) và diện tích tứ giác \(ABDO\).`,
        ans: S`\(AB = 4\); \(BC = 4{,}8\); \(BD = 3{,}6\) (cm); \(S_{ABDO} = 10{,}32\) cm².`,
        barem: q4(S`\(AB = \sqrt{5^2 - 3^2} = 4\) (cm). \(BH \cdot OA = AB \cdot OB\) (hai lần diện tích tam giác \(ABO\)) \(\Rightarrow BH = 2{,}4\), \(BC = 4{,}8\) (cm)`, S`Tam giác \(BCD\) vuông tại \(B\): \(BD = \sqrt{CD^2 - BC^2} = \sqrt{36 - 23{,}04} = 3{,}6\) (cm)`,
          S`\(BD \parallel OA\) nên \(ABDO\) là hình thang, chiều cao bằng khoảng cách từ \(B\) đến \(OA\) là \(BH = 2{,}4\) cm`, S`\(S_{ABDO} = \dfrac{(BD + OA) \cdot BH}{2} = \dfrac{(3{,}6 + 5) \cdot 2{,}4}{2} = 10{,}32\) (cm²)`),
        loi: ['Lấy chiều cao hình thang là AB', 'Tính BC = 2·AB·OB/OA mà không giải thích'] } },

    { ten: 'Đường kính AB, tiếp tuyến tại A, trung điểm E', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 15, đề 1: tiếp tuyến tại A, MA² = MB·MC)',
      ch: S`Cho đường tròn \((O;\ R)\) đường kính \(AB\). Trên tiếp tuyến tại \(A\) của \((O)\) lấy điểm \(C\) (\(C \ne A\)). Đoạn \(BC\) cắt \((O)\) tại \(D\) (\(D \ne B\)). Gọi \(E\) là trung điểm của \(AC\).`,
      fig: G({ pts: { A: [-2, 0], B: [2, 0], O: [0, 0], C: [-2, 4], D: [0, 2], E: [-2, 2] }, circles: [{ c: 'O', r: 2 }], segs: 'A-B A-C B-C A-D E-D O-D', dots: 'O E', rights: [['C', 'A', 'B'], ['A', 'D', 'B']], rs: 0.2, lab: { O: [0, 14], D: [10, -6], E: [-12, 4] }, w: 165 }),
      a: { q: S`Chứng minh \(AD \perp BC\) và \(CA^2 = CD \cdot CB\).`,
        ans: S`\(\widehat{ADB} = 90^\circ\); \(\triangle CDA \backsim \triangle CAB\).`,
        barem: q4(S`\(\widehat{ADB}\) là góc nội tiếp chắn nửa đường tròn nên \(\widehat{ADB} = 90^\circ\): \(AD \perp BC\)`, S`\(CA\) là tiếp tuyến nên \(\widehat{CAB} = 90^\circ\)`,
          S`\(\triangle CDA \backsim \triangle CAB\) (\(\widehat C\) chung, \(\widehat{CDA} = \widehat{CAB} = 90^\circ\))`, S`\(\Rightarrow \dfrac{CD}{CA} = \dfrac{CA}{CB} \Rightarrow CA^2 = CD \cdot CB\)`),
        loi: ['Viết thẳng CA² = CD·CB là hệ thức lượng', 'Không nêu vì sao góc CAB vuông'] },
      b: { q: S`Chứng minh \(ED\) là tiếp tuyến của \((O)\).`,
        ans: S`\(\triangle EAO = \triangle EDO\) (c.c.c) nên \(\widehat{EDO} = \widehat{EAO} = 90^\circ\).`,
        barem: q4(S`Tam giác \(ADC\) vuông tại \(D\) có \(DE\) là trung tuyến nên \(ED = EA = \dfrac{AC}{2}\)`, S`\(\triangle EAO\) và \(\triangle EDO\) có \(EA = ED\), \(OA = OD = R\), \(EO\) chung nên \(\triangle EAO = \triangle EDO\) (c.c.c)`,
          S`\(\Rightarrow \widehat{EDO} = \widehat{EAO} = 90^\circ\)`, S`\(ED \perp OD\) tại \(D \in (O)\) nên \(ED\) là tiếp tuyến của \((O)\)`),
        loi: ['Quên chỉ ra D thuộc (O) khi kết luận tiếp tuyến', 'Chứng minh bằng nhau thiếu cạnh chung'] },
      c: { q: S`Biết \(AC = 2R\). Tính \(BC\), \(CD\), \(AD\) và diện tích tam giác \(ACD\) theo \(R\).`,
        ans: S`\(BC = 2\sqrt2R\); \(CD = AD = \sqrt2R\); \(S_{ACD} = R^2\).`,
        barem: q4(S`\(BC = \sqrt{AC^2 + AB^2} = \sqrt{4R^2 + 4R^2} = 2\sqrt2R\)`, S`\(CD = \dfrac{CA^2}{CB} = \dfrac{4R^2}{2\sqrt2R} = \sqrt2R\)`,
          S`\(AD = \sqrt{AC^2 - CD^2} = \sqrt{4R^2 - 2R^2} = \sqrt2R\)`, S`\(S_{ACD} = \tfrac12 AD \cdot CD = \tfrac12 \cdot \sqrt2R \cdot \sqrt2R = R^2\)`),
        loi: ['Dùng AB = R (quên AB là đường kính)', 'Tính diện tích tam giác ACD bằng ½·AC·AD'] } },

    { ten: 'Tam giác cân nội tiếp, đường kính qua đỉnh', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 3, đề 1: đường kính AK, R = 5 cm, BC = 8 cm)',
      ch: S`Cho tam giác \(ABC\) cân tại \(A\) nội tiếp đường tròn \((O;\ R)\) (\(\widehat A\) nhọn). Kẻ đường kính \(AD\) của \((O)\); \(AD\) cắt \(BC\) tại \(H\).`,
      fig: G({ pts: { A: [0, 2], B: [-1.6, -1.2], C: [1.6, -1.2], D: [0, -2], H: [0, -1.2], O: [0, 0] }, circles: [{ c: 'O', r: 2 }], segs: 'A-B A-C B-C A-D B-D C-D', dots: 'O', rights: [['A', 'H', 'C'], ['A', 'B', 'D']], rs: 0.18, lab: { O: [12, 4], H: [10, 12] }, w: 200 }),
      a: { q: S`Chứng minh \(AD \perp BC\) tại trung điểm \(H\) của \(BC\) và \(\widehat{ABD} = 90^\circ\).`,
        ans: S`\(AO\) là trung trực của \(BC\); \(\widehat{ABD}\) chắn nửa đường tròn.`,
        barem: q4(S`\(AB = AC\) (tam giác cân) và \(OB = OC = R\)`, S`Nên \(AO\) (tức \(AD\)) là trung trực của \(BC\): \(AD \perp BC\) tại trung điểm \(H\) của \(BC\)`,
          S`\(\widehat{ABD}\) là góc nội tiếp chắn nửa đường tròn đường kính \(AD\)`, S`nên \(\widehat{ABD} = 90^\circ\)`),
        loi: ['Dùng "đường kính vuông góc dây" (bị cấm) thay vì trung trực', 'Không nêu H là trung điểm'] },
      b: { q: S`Chứng minh \(AB^2 = AH \cdot AD\) và \(BH^2 = AH \cdot HD\).`,
        ans: S`\(\triangle AHB \backsim \triangle ABD\); \(\triangle BHA \backsim \triangle DHB\).`,
        barem: q4(S`\(\triangle AHB \backsim \triangle ABD\) (\(\widehat A\) chung, \(\widehat{AHB} = \widehat{ABD} = 90^\circ\))`, S`\(\Rightarrow \dfrac{AH}{AB} = \dfrac{AB}{AD} \Rightarrow AB^2 = AH \cdot AD\)`,
          S`\(\triangle BHA \backsim \triangle DHB\) (\(\widehat{BHA} = \widehat{DHB} = 90^\circ\), \(\widehat{BAH} = \widehat{DBH}\) cùng phụ \(\widehat{ABH}\))`, S`\(\Rightarrow \dfrac{BH}{DH} = \dfrac{AH}{BH} \Rightarrow BH^2 = AH \cdot HD\)`),
        loi: ['Dùng thẳng hệ thức lượng trong tam giác vuông ABD', 'Không chỉ ra hai góc cùng phụ một góc'] },
      c: { q: S`Cho \(R = 5\) cm, \(BC = 8\) cm. Tính \(OH\), \(AH\), \(AB\) và diện tích tam giác \(ABC\).`,
        ans: S`\(OH = 3\); \(AH = 8\); \(AB = 4\sqrt5\) (cm); \(S_{ABC} = 32\) cm².`,
        barem: q4(S`\(BH = 4\); tam giác \(OBH\) vuông tại \(H\): \(OH = \sqrt{25 - 16} = 3\) (cm)`, S`\(\widehat A\) nhọn nên \(O\) nằm giữa \(A\) và \(H\): \(AH = AO + OH = 8\) (cm)`,
          S`\(AB = \sqrt{AH^2 + BH^2} = \sqrt{64 + 16} = 4\sqrt5\) (cm) (thử lại: \(AB^2 = 80 = AH \cdot AD = 8 \cdot 10\))`, S`\(S_{ABC} = \tfrac12 AH \cdot BC = \tfrac12 \cdot 8 \cdot 8 = 32\) (cm²)`),
        loi: ['Lấy AH = R − OH (sai vị trí của O)', 'Quên đơn vị'] } },

    { ten: 'Hai tiếp tuyến, tiếp tuyến tại điểm trên cung nhỏ', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 6, đề 1 câu b và Cụm 10, đề 1: tính chất hai tiếp tuyến cắt nhau)',
      ch: S`Từ điểm \(A\) nằm ngoài đường tròn \((O;\ R)\), kẻ hai tiếp tuyến \(AB, AC\) (\(B, C\) là tiếp điểm). Lấy điểm \(M\) trên cung nhỏ \(BC\); tiếp tuyến của \((O)\) tại \(M\) cắt \(AB, AC\) lần lượt tại \(D, E\).`,
      fig: G({ pts: { A: [4, 0], B: [1, 1.732], C: [1, -1.732], O: [0, 0], M: [1.879, 0.684], D: [1.63, 1.368], E: [2.453, -0.893] }, circles: [{ c: 'O', r: 2 }], segs: 'A-B A-C D-E O-B O-C O-M O-D O-E', dots: 'O', lab: { O: [-12, 4], M: [12, 6], D: [4, -8], E: [8, 12] }, w: 240 }),
      a: { q: S`Chứng minh chu vi tam giác \(ADE\) bằng \(2AB\).`,
        ans: S`\(DM = DB\), \(EM = EC\) nên chu vi \(= AB + AC = 2AB\).`,
        barem: q4(S`Theo tính chất hai tiếp tuyến cắt nhau tại \(D\): \(DM = DB\); tại \(E\): \(EM = EC\)`, S`Chu vi \(\triangle ADE = AD + DE + EA = AD + DM + ME + EA\)`,
          S`\(= (AD + DB) + (EC + EA) = AB + AC\)`, S`Mà \(AB = AC\) (hai tiếp tuyến từ \(A\)) nên chu vi \(\triangle ADE = 2AB\)`),
        loi: ['Không nêu M nằm giữa D và E nên DE = DM + ME', 'Thiếu lí do AB = AC'] },
      b: { q: S`Chứng minh \(\widehat{DOE} = \dfrac12\widehat{BOC}\).`,
        ans: S`\(OD\), \(OE\) là phân giác của \(\widehat{BOM}\), \(\widehat{MOC}\).`,
        barem: q4(S`Hai tiếp tuyến \(DB, DM\) cắt nhau tại \(D\) nên \(OD\) là phân giác \(\widehat{BOM}\): \(\widehat{DOM} = \tfrac12\widehat{BOM}\)`, S`Tương tự \(OE\) là phân giác \(\widehat{MOC}\): \(\widehat{MOE} = \tfrac12\widehat{MOC}\)`,
          S`\(M\) thuộc cung nhỏ \(BC\) nên tia \(OM\) nằm giữa hai tia \(OB, OC\): \(\widehat{BOM} + \widehat{MOC} = \widehat{BOC}\)`, S`\(\widehat{DOE} = \widehat{DOM} + \widehat{MOE} = \tfrac12\widehat{BOC}\)`),
        loi: ['Không giải thích vì sao tia OM nằm giữa OB, OC', 'Nhầm phân giác của góc BDM'] },
      c: { q: S`Cho \(OA = 2R\). Tính chu vi tam giác \(ADE\) và số đo \(\widehat{DOE}\).`,
        ans: S`Chu vi \(= 2\sqrt3R\); \(\widehat{DOE} = 60^\circ\).`,
        barem: q4(S`\(AB = \sqrt{OA^2 - OB^2} = \sqrt{4R^2 - R^2} = R\sqrt3\)`, S`Chu vi \(\triangle ADE = 2AB = 2\sqrt3R\)`,
          S`\(\cos\widehat{AOB} = \dfrac{OB}{OA} = \dfrac12 \Rightarrow \widehat{AOB} = 60^\circ\); \(OA\) là phân giác \(\widehat{BOC}\) nên \(\widehat{BOC} = 120^\circ\)`, S`\(\widehat{DOE} = \tfrac12 \cdot 120^\circ = 60^\circ\)`),
        loi: ['Lấy góc BOC = 60°', 'Quên nhân 2 khi tính chu vi'] } },

    { ten: 'Đường kính vuông góc với dây, hệ thức trong tam giác vuông', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 12, đề 3: dây CD vuông góc đường kính AB tại H, AH·AB = AD²)',
      ch: S`Cho đường tròn \((O;\ R)\) đường kính \(AB\). Dây \(CD\) vuông góc với \(AB\) tại \(H\) (\(H\) nằm giữa \(O\) và \(B\)).`,
      fig: G({ pts: { A: [-2, 0], B: [2, 0], O: [0, 0], H: [1.2, 0], C: [1.2, 1.6], D: [1.2, -1.6] }, circles: [{ c: 'O', r: 2 }], segs: 'A-B C-D A-C B-C A-D B-D O-C O-D', dots: 'O', rights: [['C', 'H', 'B'], ['A', 'C', 'B']], rs: 0.18, lab: { O: [0, 14], H: [10, 14] }, w: 200 }),
      a: { q: S`Chứng minh \(H\) là trung điểm của \(CD\) và \(\widehat{ACB} = 90^\circ\).`,
        ans: S`Tam giác \(OCD\) cân nên đường cao \(OH\) cũng là trung tuyến; góc chắn nửa đường tròn.`,
        barem: q4(S`\(OC = OD = R\) nên tam giác \(OCD\) cân tại \(O\)`, S`\(OH\) là đường cao nên cũng là trung tuyến: \(H\) là trung điểm \(CD\)`,
          S`\(\widehat{ACB}\) là góc nội tiếp chắn nửa đường tròn đường kính \(AB\)`, S`nên \(\widehat{ACB} = 90^\circ\)`),
        loi: ['Viết "đường kính vuông góc với dây thì đi qua trung điểm" (bị cấm, phải chứng minh lại)', 'Thiếu lí do OC = OD'] },
      b: { q: S`Chứng minh \(CH^2 = HA \cdot HB\) và \(AC^2 = AH \cdot AB\).`,
        ans: S`\(\triangle AHC \backsim \triangle CHB\); \(\triangle AHC \backsim \triangle ACB\).`,
        barem: q4(S`\(\triangle AHC \backsim \triangle CHB\) (\(\widehat{AHC} = \widehat{CHB} = 90^\circ\), \(\widehat{HAC} = \widehat{HCB}\) cùng phụ \(\widehat{ACH}\))`, S`\(\Rightarrow \dfrac{CH}{HB} = \dfrac{HA}{CH} \Rightarrow CH^2 = HA \cdot HB\)`,
          S`\(\triangle AHC \backsim \triangle ACB\) (\(\widehat A\) chung, \(\widehat{AHC} = \widehat{ACB} = 90^\circ\))`, S`\(\Rightarrow \dfrac{AH}{AC} = \dfrac{AC}{AB} \Rightarrow AC^2 = AH \cdot AB\)`),
        loi: ['Dùng thẳng hệ thức h² = b′c′', 'Sai cặp góc tương ứng'] },
      c: { q: S`Cho \(R = 5\) cm và \(OH = 3\) cm. Tính \(CD\), \(AC\) và diện tích tứ giác \(ACBD\).`,
        ans: S`\(CD = 8\) cm; \(AC = 4\sqrt5\) cm; \(S_{ACBD} = 40\) cm².`,
        barem: q4(S`\(HB = R - OH = 2\), \(HA = R + OH = 8\) (cm)`, S`\(CH^2 = HA \cdot HB = 16 \Rightarrow CH = 4\), \(CD = 8\) (cm)`,
          S`\(AC^2 = AH \cdot AB = 8 \cdot 10 = 80 \Rightarrow AC = 4\sqrt5\) (cm)`, S`Tứ giác \(ACBD\) có hai đường chéo \(AB \perp CD\): \(S = \tfrac12 AB \cdot CD = \tfrac12 \cdot 10 \cdot 8 = 40\) (cm²)`),
        loi: ['Nhầm HA = R − OH', 'Dùng công thức ½·d₁·d₂ mà không nêu hai đường chéo vuông góc'] } },

    { ten: 'Hai tiếp tuyến, đường kính AC, cát tuyến MC', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 1, đề 2 và Cụm 8, đề 2: hai tiếp tuyến MA, MB, đường kính AC, MC cắt (O) tại D)',
      ch: S`Từ điểm \(M\) nằm ngoài đường tròn \((O;\ R)\), kẻ hai tiếp tuyến \(MA, MB\) (\(A, B\) là tiếp điểm). Kẻ đường kính \(AC\) của \((O)\); đường thẳng \(MC\) cắt \((O)\) tại điểm thứ hai \(D\). Gọi \(H\) là giao điểm của \(AB\) và \(MO\).`,
      fig: G({ pts: { M: [6, 0], A: [0.667, 1.886], B: [0.667, -1.886], C: [-0.667, -1.886], H: [0.667, 0], D: [1.556, -1.257], O: [0, 0] }, circles: [{ c: 'O', r: 2 }], segs: 'M-A M-B A-C M-C A-B M-O A-D D-H', dots: 'O', rights: [['O', 'A', 'M'], ['A', 'H', 'M'], ['A', 'D', 'C']], rs: 0.2, lab: { O: [-12, 4], H: [10, 12], D: [4, 14] }, w: 260 }),
      a: { q: S`Chứng minh bốn điểm \(M, A, O, B\) cùng thuộc một đường tròn và \(MO \perp AB\) tại \(H\).`,
        ans: S`\(M, A, O, B\) thuộc đường tròn đường kính \(MO\); \(MO\) là trung trực của \(AB\).`,
        barem: q4(S`\(MA, MB\) là tiếp tuyến nên \(\widehat{MAO} = \widehat{MBO} = 90^\circ\)`, S`Tam giác \(MAO\), \(MBO\) vuông tại \(A, B\) nên \(A, B\) thuộc đường tròn đường kính \(MO\). Vậy \(M, A, O, B\) cùng thuộc một đường tròn`,
          S`\(MA = MB\) (tính chất hai tiếp tuyến cắt nhau) và \(OA = OB = R\)`, S`Nên \(MO\) là trung trực của \(AB\): \(MO \perp AB\) tại \(H\)`),
        loi: ['Không nêu tâm (trung điểm MO) của đường tròn đi qua bốn điểm', 'Dùng dấu hiệu tứ giác có tổng hai góc đối 180° (bị cấm)'] },
      b: { q: S`Chứng minh \(MD \cdot MC = MH \cdot MO\) và \(\widehat{MHD} = \widehat{MCO}\).`,
        ans: S`\(MD \cdot MC = MA^2 = MH \cdot MO\); \(\triangle MDH \backsim \triangle MOC\) (c.g.c).`,
        barem: q4(S`\(\widehat{ADC} = 90^\circ\) (góc nội tiếp chắn nửa đường tròn) nên \(AD \perp MC\). \(\triangle MDA \backsim \triangle MAC\) (\(\widehat M\) chung, \(\widehat{MDA} = \widehat{MAC} = 90^\circ\)) \(\Rightarrow MA^2 = MD \cdot MC\)`,
          S`\(\triangle MHA \backsim \triangle MAO\) (\(\widehat M\) chung, \(\widehat{MHA} = \widehat{MAO} = 90^\circ\)) \(\Rightarrow MA^2 = MH \cdot MO\)`,
          S`Suy ra \(MD \cdot MC = MH \cdot MO\), tức \(\dfrac{MD}{MO} = \dfrac{MH}{MC}\)`, S`\(\triangle MDH \backsim \triangle MOC\) (\(\widehat M\) chung, tỉ số trên) \(\Rightarrow \widehat{MHD} = \widehat{MCO}\)`),
        loi: ['Viết thẳng MA² = MH·MO mà không chứng minh đồng dạng', 'Ghép sai đỉnh tương ứng của hai tam giác đồng dạng c.g.c'] },
      c: { q: S`Cho \(OM = 3R\). Tính \(MA\), \(MD\) và \(DH\) theo \(R\).`,
        ans: S`\(MA = 2\sqrt2R\); \(MD = \dfrac{4\sqrt3R}{3}\); \(DH = \dfrac{4\sqrt3R}{9}\).`,
        barem: q4(S`\(MA = \sqrt{OM^2 - OA^2} = \sqrt{9R^2 - R^2} = 2\sqrt2R\)`, S`\(MA \perp AC\), \(AC = 2R\): \(MC = \sqrt{8R^2 + 4R^2} = 2\sqrt3R\)`,
          S`\(MD = \dfrac{MA^2}{MC} = \dfrac{8R^2}{2\sqrt3R} = \dfrac{4\sqrt3R}{3}\)`, S`Từ \(\triangle MDH \backsim \triangle MOC\): \(\dfrac{DH}{OC} = \dfrac{MD}{MO} \Rightarrow DH = R \cdot \dfrac{4\sqrt3R}{3} : 3R = \dfrac{4\sqrt3R}{9}\)`),
        loi: ['Quên tam giác MAC vuông tại A', 'Lập sai tỉ số: DH/OC = MH/MC'] } },

    { ten: 'Tiếp tuyến AB, đường kính BC, hình chiếu của B trên AO', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 5, đề 3: tiếp tuyến AB, đường kính BC, AC cắt (O) tại D, BH ⊥ AO)',
      ch: S`Từ điểm \(A\) nằm ngoài đường tròn \((O;\ R)\), vẽ tiếp tuyến \(AB\) (\(B\) là tiếp điểm) và đường kính \(BC\). Đoạn \(AC\) cắt \((O)\) tại điểm thứ hai \(D\). Vẽ \(BH \perp AO\) tại \(H\).`,
      fig: G({ pts: { A: [2.667, -2], B: [0, -2], C: [0, 2], D: [1.846, -0.769], H: [0.96, -0.72], O: [0, 0] }, circles: [{ c: 'O', r: 2 }], segs: 'A-B B-C A-C A-O B-H B-D', dots: 'O', rights: [['O', 'B', 'A'], ['B', 'D', 'A'], ['B', 'H', 'A']], rs: 0.18, lab: { O: [-12, 4], H: [-6, -10], D: [10, -6] }, w: 210 }),
      a: { q: S`Chứng minh \(BD \perp AC\) và bốn điểm \(A, B, H, D\) cùng thuộc một đường tròn.`,
        ans: S`\(\widehat{BDC} = 90^\circ\); \(A, B, H, D\) thuộc đường tròn đường kính \(AB\).`,
        barem: q4(S`\(\widehat{BDC}\) là góc nội tiếp chắn nửa đường tròn nên \(\widehat{BDC} = 90^\circ\): \(BD \perp AC\)`, S`Tam giác \(ADB\) vuông tại \(D\), tam giác \(AHB\) vuông tại \(H\), có chung cạnh huyền \(AB\)`,
          S`Gọi \(N\) là trung điểm \(AB\): \(ND = NH = NA = NB = \dfrac{AB}{2}\) (trung tuyến ứng với cạnh huyền)`, S`Vậy \(A, B, H, D\) cùng thuộc đường tròn tâm \(N\), đường kính \(AB\)`),
        loi: ['Không chỉ ra góc BDC chắn nửa đường tròn', 'Dùng dấu hiệu "hai đỉnh kề cùng nhìn một cạnh" mà không chứng minh lại'] },
      b: { q: S`Chứng minh \(OB^2 = OH \cdot OA\) và \(AH \cdot AO = AD \cdot AC\).`,
        ans: S`\(\triangle OHB \backsim \triangle OBA\); \(AH \cdot AO = AB^2 = AD \cdot AC\).`,
        barem: q4(S`\(\triangle OHB \backsim \triangle OBA\) (\(\widehat O\) chung, \(\widehat{OHB} = \widehat{OBA} = 90^\circ\)) \(\Rightarrow \dfrac{OH}{OB} = \dfrac{OB}{OA} \Rightarrow OB^2 = OH \cdot OA\)`,
          S`\(\triangle AHB \backsim \triangle ABO\) (\(\widehat A\) chung, \(\widehat{AHB} = \widehat{ABO} = 90^\circ\)) \(\Rightarrow AB^2 = AH \cdot AO\)`,
          S`\(\triangle ADB \backsim \triangle ABC\) (\(\widehat A\) chung, \(\widehat{ADB} = \widehat{ABC} = 90^\circ\)) \(\Rightarrow AB^2 = AD \cdot AC\)`, S`Vậy \(AH \cdot AO = AD \cdot AC\)`),
        loi: ['Dùng thẳng hệ thức lượng trong tam giác vuông', 'Không nêu AB ⊥ BC (tiếp tuyến vuông góc với bán kính)'] },
      c: { q: S`Cho \(AH = 16\) cm, \(OH = 9\) cm. Tính \(R\), \(AB\) và \(BD\) (làm tròn đến hàng phần trăm).`,
        ans: S`\(R = 15\) cm; \(AB = 20\) cm; \(BD = \dfrac{60\sqrt{13}}{13} \approx 16{,}64\) cm.`,
        barem: q4(S`\(OA = AH + OH = 25\); \(R^2 = OB^2 = OH \cdot OA = 225 \Rightarrow R = 15\) cm`, S`\(AB^2 = AH \cdot AO = 400 \Rightarrow AB = 20\) cm`,
          S`\(BC = 30\) cm, \(AC = \sqrt{AB^2 + BC^2} = \sqrt{1300} = 10\sqrt{13}\) cm`, S`Từ \(\triangle ADB \backsim \triangle ABC\): \(\dfrac{BD}{BC} = \dfrac{AB}{AC} \Rightarrow BD = \dfrac{20 \cdot 30}{10\sqrt{13}} \approx 16{,}64\) cm`),
        loi: ['Lấy OA = AH − OH', 'Làm tròn sớm AC rồi mới chia'] } },

    { ten: 'Tam giác nhọn, ba đường cao, tiếp tuyến ID', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 2, đề 1: ba đường cao AM, BE, CD; I, O là trung điểm AH, BC)',
      ch: S`Cho tam giác \(ABC\) nhọn (\(AC \lt AB\)) có ba đường cao \(AM, BE, CD\) cắt nhau tại \(H\). Gọi \(I\), \(O\) lần lượt là trung điểm của \(AH\), \(BC\).`,
      fig: G({ pts: { A: [3.804, 3.804], B: [0, 0], C: [6, 0], M: [3.804, 0], E: [4.5, 2.598], D: [3, 3], H: [3.804, 2.196], I: [3.804, 3], O: [3, 0] }, circles: [{ c: 'O', r: 3, dash: true }], segs: 'A-B B-C C-A A-M B-E C-D I-D O-D', dots: 'I O H', rights: [['A', 'M', 'C'], ['B', 'E', 'C'], ['C', 'D', 'A']], rs: 0.22, lab: { H: [12, 6], I: [-9, -9], D: [-10, -6], E: [10, -4], M: [6, 14], O: [0, 14] }, w: 220 }),
      a: { q: S`Chứng minh bốn điểm \(A, D, H, E\) cùng thuộc đường tròn tâm \(I\) và bốn điểm \(B, C, E, D\) cùng thuộc đường tròn tâm \(O\).`,
        ans: S`\((I)\) có đường kính \(AH\); \((O)\) có đường kính \(BC\).`,
        barem: q4(S`\(\widehat{ADH} = \widehat{AEH} = 90^\circ\): hai tam giác vuông \(ADH\), \(AEH\) có chung cạnh huyền \(AH\)`, S`Trung tuyến ứng với cạnh huyền: \(ID = IE = IA = IH = \dfrac{AH}{2}\) nên \(A, D, H, E\) thuộc đường tròn \((I;\ \tfrac{AH}{2})\)`,
          S`\(\widehat{BDC} = \widehat{BEC} = 90^\circ\): hai tam giác vuông \(BDC\), \(BEC\) có chung cạnh huyền \(BC\)`, S`\(OD = OE = OB = OC = \dfrac{BC}{2}\) nên \(B, C, E, D\) thuộc đường tròn \((O;\ \tfrac{BC}{2})\)`),
        loi: ['Không nêu bán kính của hai đường tròn', 'Dùng dấu hiệu tứ giác nội tiếp (bị cấm)'] },
      b: { q: S`Chứng minh \(ID\) là tiếp tuyến của đường tròn tâm \(O\) đường kính \(BC\).`,
        ans: S`\(\widehat{IDA} + \widehat{ODB} = 90^\circ\) nên \(ID \perp OD\) tại \(D\).`,
        barem: q4(S`\(IA = ID\) nên tam giác \(IAD\) cân tại \(I\): \(\widehat{IDA} = \widehat{IAD} = \widehat{MAB}\)`, S`\(OB = OD\) nên tam giác \(OBD\) cân tại \(O\): \(\widehat{ODB} = \widehat{OBD} = \widehat{MBA}\)`,
          S`Tam giác \(AMB\) vuông tại \(M\): \(\widehat{MAB} + \widehat{MBA} = 90^\circ \Rightarrow \widehat{IDA} + \widehat{ODB} = 90^\circ\)`, S`\(A, D, B\) thẳng hàng nên \(\widehat{IDO} = 180^\circ - 90^\circ = 90^\circ\): \(ID \perp OD\) tại \(D \in (O)\), vậy \(ID\) là tiếp tuyến của \((O)\)`),
        loi: ['Không giải thích D thuộc đường tròn (O)', 'Nhầm góc IAD với góc BAC'] },
      c: { q: S`Cho \(BC = 6\) cm, \(\widehat{ABC} = 45^\circ\), \(\widehat{ACB} = 60^\circ\). Tính \(AM\) và diện tích tam giác \(ABC\) (làm tròn đến hàng phần trăm).`,
        ans: S`\(AM = 9 - 3\sqrt3 \approx 3{,}80\) cm; \(S_{ABC} = 27 - 9\sqrt3 \approx 11{,}41\) cm².`,
        barem: q4(S`Tam giác \(AMB\) vuông tại \(M\), \(\widehat B = 45^\circ\) nên vuông cân: \(BM = AM\)`, S`Tam giác \(AMC\) vuông tại \(M\): \(MC = \dfrac{AM}{\tan 60^\circ} = \dfrac{AM}{\sqrt3}\)`,
          S`\(BM + MC = BC\): \(AM\left(1 + \tfrac{1}{\sqrt3}\right) = 6 \Rightarrow AM = \dfrac{6\sqrt3}{\sqrt3 + 1} = 9 - 3\sqrt3 \approx 3{,}80\) cm`, S`\(S_{ABC} = \tfrac12 BC \cdot AM = 3(9 - 3\sqrt3) = 27 - 9\sqrt3 \approx 11{,}41\) cm²`),
        loi: ['Lấy MC = AM·tan 60°', 'Làm tròn AM trước khi tính diện tích'] } },

    { ten: 'Hai tiếp tuyến, cát tuyến SMN, trung điểm của dây', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 12, đề 2: tiếp tuyến SA, SB, đường kính BF, cát tuyến SMN; Cụm 6, đề 2: OI ⊥ DE)',
      ch: S`Từ điểm \(S\) nằm ngoài đường tròn \((O;\ R)\), kẻ hai tiếp tuyến \(SA, SB\) (\(A, B\) là tiếp điểm) và đường kính \(BF\) của \((O)\). Một đường thẳng qua \(S\) (không đi qua \(O\)) cắt \((O)\) tại \(M, N\) (\(M\) nằm giữa \(S\) và \(N\)). Gọi \(E\) là trung điểm của \(MN\).`,
      fig: G({ pts: { S: [4.472, 0], A: [0.894, 1.789], B: [0.894, -1.789], F: [-0.894, 1.789], M: [1.789, -0.894], N: [-0.894, -1.789], E: [0.447, -1.342], O: [0, 0] }, circles: [{ c: 'O', r: 2 }], segs: 'S-A S-B B-F A-F S-N S-O O-E A-B', dots: 'O', rights: [['O', 'E', 'S'], ['O', 'A', 'S']], rs: 0.2, lab: { O: [-12, 4], E: [-4, -10], M: [8, 12], B: [6, 14] }, w: 250 }),
      a: { q: S`Chứng minh bốn điểm \(S, A, O, B\) cùng thuộc một đường tròn và \(AF \parallel SO\).`,
        ans: S`\(S, A, O, B\) thuộc đường tròn đường kính \(SO\); \(AF\) và \(SO\) cùng vuông góc với \(AB\).`,
        barem: q4(S`\(\widehat{SAO} = \widehat{SBO} = 90^\circ\) nên \(A, B\) thuộc đường tròn đường kính \(SO\) (trung tuyến ứng với cạnh huyền \(SO\))`, S`\(SA = SB\), \(OA = OB\) nên \(SO\) là trung trực của \(AB\): \(SO \perp AB\)`,
          S`\(\widehat{BAF} = 90^\circ\) (góc nội tiếp chắn nửa đường tròn) nên \(AF \perp AB\)`, S`Vậy \(AF \parallel SO\) (cùng vuông góc với \(AB\))`),
        loi: ['Không chứng minh SO ⊥ AB', 'Quên lí do góc BAF vuông'] },
      b: { q: S`Chứng minh \(OE \perp MN\) và năm điểm \(S, A, E, O, B\) cùng thuộc một đường tròn.`,
        ans: S`\(\widehat{SEO} = 90^\circ\) nên \(E\) thuộc đường tròn đường kính \(SO\).`,
        barem: q4(S`\(OM = ON = R\) nên tam giác \(OMN\) cân tại \(O\)`, S`\(OE\) là trung tuyến nên cũng là đường cao: \(OE \perp MN\)`,
          S`\(\widehat{SEO} = 90^\circ\) nên \(E\) thuộc đường tròn đường kính \(SO\)`, S`Kết hợp câu a: \(S, A, E, O, B\) cùng thuộc đường tròn đường kính \(SO\)`),
        loi: ['Viết "đường kính đi qua trung điểm dây thì vuông góc" (bị cấm, phải chứng minh qua tam giác cân)', 'Quên E khác O vì đường thẳng không qua O'] },
      c: { q: S`Cho \(SO = R\sqrt5\) và \(MN = R\sqrt2\). Tính \(SA\), \(SM\) và diện tích tam giác \(SOM\) theo \(R\).`,
        ans: S`\(SA = 2R\); \(SM = R\sqrt2\); \(S_{SOM} = \dfrac{R^2}{2}\).`,
        barem: q4(S`\(SA = \sqrt{SO^2 - OA^2} = \sqrt{5R^2 - R^2} = 2R\)`, S`\(ME = \dfrac{MN}{2} = \dfrac{R\sqrt2}{2}\); \(OE = \sqrt{R^2 - \dfrac{R^2}{2}} = \dfrac{R\sqrt2}{2}\)`,
          S`\(SE = \sqrt{SO^2 - OE^2} = \sqrt{5R^2 - \dfrac{R^2}{2}} = \dfrac{3R\sqrt2}{2}\); \(SM = SE - ME = R\sqrt2\)`, S`\(S_{SOM} = \tfrac12 SM \cdot OE = \tfrac12 \cdot R\sqrt2 \cdot \dfrac{R\sqrt2}{2} = \dfrac{R^2}{2}\)`),
        loi: ['Lấy SM = SE + ME', 'Dùng OM thay cho OE làm đường cao'] } },

    { ten: 'Đường tròn đường kính AB cắt hai cạnh, trực tâm K', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 16, đề 1: đường tròn đường kính AB cắt AC, BC tại P, Q; AQ cắt BP tại K; CK cắt AB tại H)',
      ch: S`Cho tam giác \(ABC\) nhọn (\(AC \lt BC\)). Đường tròn \((O)\) đường kính \(AB\) cắt các cạnh \(AC\), \(BC\) lần lượt tại \(P\), \(Q\). Đường thẳng \(AQ\) cắt \(BP\) tại \(K\); tia \(CK\) cắt \(AB\) tại \(H\).`,
      fig: G({ pts: { A: [0, 0], B: [10, 0], C: [3.66, 6.34], P: [2.5, 4.33], Q: [5, 5], K: [3.66, 3.66], H: [3.66, 0], O: [5, 0] }, circles: [{ c: 'O', r: 5 }], segs: 'A-B B-C C-A A-Q B-P C-H', dots: 'O K', rights: [['A', 'P', 'B'], ['A', 'Q', 'B'], ['C', 'H', 'B']], rs: 0.5, lab: { K: [12, 2], H: [-6, 14], O: [4, 14], P: [-12, -2], Q: [10, -6] }, w: 210 }),
      a: { q: S`Chứng minh \(BP \perp AC\), \(AQ \perp BC\) và bốn điểm \(C, P, K, Q\) cùng thuộc một đường tròn.`,
        ans: S`\(\widehat{APB} = \widehat{AQB} = 90^\circ\); \(C, P, K, Q\) thuộc đường tròn đường kính \(CK\).`,
        barem: q4(S`\(\widehat{APB} = 90^\circ\) (góc nội tiếp chắn nửa đường tròn) nên \(BP \perp AC\)`, S`Tương tự \(\widehat{AQB} = 90^\circ\) nên \(AQ \perp BC\)`,
          S`Tam giác \(CPK\) vuông tại \(P\), tam giác \(CQK\) vuông tại \(Q\), chung cạnh huyền \(CK\)`, S`Trung điểm \(J\) của \(CK\) cách đều \(C, P, K, Q\) nên bốn điểm cùng thuộc đường tròn đường kính \(CK\)`),
        loi: ['Không chỉ ra góc nội tiếp chắn nửa đường tròn', 'Dùng dấu hiệu tổng hai góc đối 180° (bị cấm)'] },
      b: { q: S`Chứng minh \(CH \perp AB\) và \(AK \cdot AQ = AH \cdot AB\).`,
        ans: S`\(K\) là trực tâm tam giác \(ABC\); \(\triangle AHK \backsim \triangle AQB\).`,
        barem: q4(S`\(AQ\), \(BP\) là hai đường cao của tam giác \(ABC\) cắt nhau tại \(K\) nên \(K\) là trực tâm`, S`Do đó \(CK \perp AB\), tức \(CH \perp AB\) tại \(H\)`,
          S`\(\triangle AHK \backsim \triangle AQB\) (\(\widehat A\) chung, \(\widehat{AHK} = \widehat{AQB} = 90^\circ\))`, S`\(\Rightarrow \dfrac{AH}{AQ} = \dfrac{AK}{AB} \Rightarrow AK \cdot AQ = AH \cdot AB\)`),
        loi: ['Không nêu K là trực tâm mà khẳng định ngay CH ⊥ AB', 'Ghép sai cạnh tương ứng'] },
      c: { q: S`Cho \(AB = 10\) cm, \(\widehat{BAC} = 60^\circ\), \(\widehat{ABC} = 45^\circ\). Tính \(AP\), \(BQ\) và diện tích tam giác \(APB\) (làm tròn đến hàng phần trăm).`,
        ans: S`\(AP = 5\) cm; \(BQ = 5\sqrt2 \approx 7{,}07\) cm; \(S_{APB} = \dfrac{25\sqrt3}{2} \approx 21{,}65\) cm².`,
        barem: q4(S`Tam giác \(APB\) vuông tại \(P\): \(AP = AB \cdot \cos 60^\circ = 5\) cm`, S`\(BP = AB \cdot \sin 60^\circ = 5\sqrt3\) cm`,
          S`Tam giác \(AQB\) vuông tại \(Q\): \(BQ = AB \cdot \cos 45^\circ = 5\sqrt2 \approx 7{,}07\) cm`, S`\(S_{APB} = \tfrac12 AP \cdot BP = \dfrac{25\sqrt3}{2} \approx 21{,}65\) cm²`),
        loi: ['Nhầm sin và cos', 'Lấy AB làm đường cao của tam giác APB'] } },

    { ten: 'Đường kính AB, dây AC = R, tiếp tuyến tại A, B, C', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 6, đề 1: đường kính AB, AC = R, tiếp tuyến tại A, C cắt nhau tại D, tại B, C cắt nhau tại E)',
      ch: S`Cho đường tròn \((O;\ R)\) đường kính \(AB\). Lấy điểm \(C\) trên \((O)\) sao cho \(AC = R\). Tiếp tuyến của \((O)\) tại \(A\) và \(C\) cắt nhau tại \(D\); tiếp tuyến của \((O)\) tại \(B\) và \(C\) cắt nhau tại \(E\).`,
      fig: G({ pts: { A: [-2, 0], B: [2, 0], C: [-1, 1.732], D: [-2, 1.155], E: [2, 3.464], O: [0, 0] }, circles: [{ c: 'O', r: 2 }], segs: 'A-B A-C C-B A-D B-E D-E O-D O-E O-C', dots: 'O', rights: [['A', 'C', 'B'], ['O', 'C', 'E']], rs: 0.18, lab: { O: [0, 14], C: [-4, -10], D: [-12, -4] }, w: 190 }),
      a: { q: S`Chứng minh tam giác \(ACB\) vuông tại \(C\) và \(CB = R\sqrt3\).`,

        barem: q4(S`\(\widehat{ACB}\) là góc nội tiếp chắn nửa đường tròn đường kính \(AB\)`, S`nên \(\widehat{ACB} = 90^\circ\): tam giác \(ACB\) vuông tại \(C\)`,
          S`Pythagore: \(CB^2 = AB^2 - AC^2 = 4R^2 - R^2 = 3R^2\)`, S`\(CB = R\sqrt3\)`),
        loi: ['Lấy AB = R thay vì 2R', 'Không nêu góc nội tiếp chắn nửa đường tròn'] },
      b: { q: S`Chứng minh \(\widehat{DOE} = 90^\circ\) và \(AD \cdot BE = R^2\).`,
        ans: S`\(OD, OE\) là phân giác hai góc kề bù; \(\triangle DCO \backsim \triangle OCE\).`,
        barem: q4(S`Theo tính chất hai tiếp tuyến cắt nhau: \(OD\) là phân giác \(\widehat{AOC}\), \(OE\) là phân giác \(\widehat{COB}\)`, S`\(\widehat{AOC} + \widehat{COB} = 180^\circ\) nên \(\widehat{DOE} = \tfrac12 \cdot 180^\circ = 90^\circ\)`,
          S`\(\triangle DCO \backsim \triangle OCE\) (\(\widehat{DCO} = \widehat{OCE} = 90^\circ\), \(\widehat{CDO} = \widehat{COE}\) cùng phụ \(\widehat{COD}\)) \(\Rightarrow DC \cdot CE = OC^2 = R^2\)`, S`Mà \(DC = DA\), \(CE = EB\) (hai tiếp tuyến cắt nhau) nên \(AD \cdot BE = R^2\)`),
        loi: ['Viết thẳng CD·CE = OC² (hệ thức lượng) không chứng minh', 'Quên DC = DA, CE = EB'] },
      c: { q: S`Tính \(AD\), \(BE\) và diện tích tứ giác \(ABED\) theo \(R\).`,
        ans: S`\(AD = \dfrac{\sqrt3R}{3}\); \(BE = \sqrt3R\); \(S_{ABED} = \dfrac{4\sqrt3R^2}{3}\).`,

          S`\(BE = \dfrac{R^2}{AD} = \sqrt3R\)`, S`\(AD \parallel BE\) (cùng vuông góc \(AB\)): hình thang vuông, \(S = \dfrac{(AD + BE) \cdot AB}{2} = \dfrac{4\sqrt3R}{3} \cdot R = \dfrac{4\sqrt3R^2}{3}\)`),
        loi: ['Lấy góc AOD = 60°', 'Quên chia 2 trong công thức hình thang'] } },

    { ten: 'Đường kính AB, tiếp tuyến tại A và M, hình chữ nhật APMQ', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 7, đề 3: tiếp tuyến tại A và M cắt nhau tại E, MP ⊥ AB, MQ ⊥ AE, tam giác EAO đồng dạng MPB)',
      ch: S`Trên đường tròn \((O)\) đường kính \(AB\) lấy điểm \(M\) sao cho \(MA \lt MB\). Hai tiếp tuyến của \((O)\) tại \(A\) và \(M\) cắt nhau tại \(E\). Vẽ \(MP \perp AB\) tại \(P\), \(MQ \perp AE\) tại \(Q\).`,
      fig: G({ pts: { A: [-2, 0], B: [2, 0], O: [0, 0], M: [-1, 1.732], P: [-1, 0], Q: [-2, 1.732], E: [-2, 1.155] }, circles: [{ c: 'O', r: 2 }], segs: 'A-B A-Q M-Q M-P M-B A-M E-M O-E', dots: 'O', rights: [['B', 'P', 'M'], ['A', 'Q', 'M'], ['A', 'M', 'B']], rs: 0.18, lab: { O: [0, 14], P: [0, 14], A: [-12, 6], E: [-12, 4], Q: [-12, -2], M: [4, -10] }, w: 200 }),
      a: { q: S`Chứng minh \(APMQ\) là hình chữ nhật và \(OE \perp AM\).`,
        ans: S`Tứ giác có ba góc vuông; \(OE\) là trung trực của \(AM\).`,
        barem: q4(S`\(AE\) là tiếp tuyến tại \(A\) nên \(\widehat{QAP} = 90^\circ\); \(\widehat{APM} = \widehat{AQM} = 90^\circ\)`, S`Tứ giác \(APMQ\) có ba góc vuông nên là hình chữ nhật`,
          S`\(EA = EM\) (hai tiếp tuyến cắt nhau tại \(E\)) và \(OA = OM\)`, S`Nên \(OE\) là trung trực của \(AM\): \(OE \perp AM\)`),

      b: { q: S`Chứng minh \(OE \parallel BM\) và \(\triangle EAO \backsim \triangle MPB\).`,
        ans: S`\(OE\), \(BM\) cùng vuông góc với \(AM\); hai tam giác vuông có \(\widehat{AOE} = \widehat{PBM}\).`,
        barem: q4(S`\(\widehat{AMB} = 90^\circ\) (góc nội tiếp chắn nửa đường tròn) nên \(BM \perp AM\)`, S`Cùng với \(OE \perp AM\) (câu a): \(OE \parallel BM\)`,
          S`Suy ra \(\widehat{AOE} = \widehat{PBM}\) (hai góc đồng vị)`, S`\(\triangle EAO\) và \(\triangle MPB\) có \(\widehat{EAO} = \widehat{MPB} = 90^\circ\), \(\widehat{AOE} = \widehat{PBM}\) nên \(\triangle EAO \backsim \triangle MPB\) (g.g)`),
        loi: ['Viết sai thứ tự đỉnh tương ứng', 'Không chỉ ra cặp góc đồng vị'] },
      c: { q: S`Cho \(AB = 4\) cm và \(\widehat{MAB} = 60^\circ\). Tính \(AM\), diện tích hình chữ nhật \(APMQ\) và độ dài \(EA\).`,
        ans: S`\(AM = 2\) cm; \(S_{APMQ} = \sqrt3\) cm²; \(EA = \dfrac{2\sqrt3}{3}\) cm.`,
        barem: q4(S`Tam giác \(AMB\) vuông tại \(M\): \(AM = AB \cdot \cos 60^\circ = 2\) cm`, S`Tam giác \(APM\) vuông tại \(P\): \(AP = AM \cdot \cos 60^\circ = 1\) cm, \(MP = AM \cdot \sin 60^\circ = \sqrt3\) cm`,
          S`\(S_{APMQ} = AP \cdot MP = \sqrt3\) cm²`, S`\(PB = 3\), \(AO = 2\); từ \(\triangle EAO \backsim \triangle MPB\): \(\dfrac{EA}{MP} = \dfrac{AO}{PB} \Rightarrow EA = \dfrac{2\sqrt3}{3}\) cm`),
        loi: ['Lấy PB = AB − AM', 'Lập sai tỉ số đồng dạng'] } },

    { ten: 'Hai tiếp tuyến, phân giác MK, đường tròn nội tiếp', nguon: 'Tuyển tập đề tham khảo tuyển sinh lớp 10 môn Toán năm 2026 – 2027 sở GD&ĐT TP HCM (Cụm 14, đề 1: tiếp tuyến SM, SN, K là giao điểm của OS với (O), MH·KS = KH·MS, OS = R√5)',
      ch: S`Qua điểm \(S\) nằm ngoài đường tròn \((O;\ R)\) vẽ hai tiếp tuyến \(SM, SN\) (\(M, N\) là tiếp điểm). Gọi \(I\) là trung điểm của \(SO\); \(K\) là giao điểm của đoạn \(SO\) với \((O)\); \(H\) là giao điểm của \(SO\) và \(MN\).`,

      a: { q: S`Chứng minh bốn điểm \(S, M, O, N\) cùng thuộc đường tròn tâm \(I\).`,
        ans: S`\(IS = IM = IO = IN = \dfrac{SO}{2}\).`,
        barem: q4(S`\(SM, SN\) là tiếp tuyến nên \(\widehat{SMO} = \widehat{SNO} = 90^\circ\)`, S`Tam giác \(SMO\) vuông tại \(M\) có \(MI\) là trung tuyến ứng với cạnh huyền: \(IM = \dfrac{SO}{2}\)`,
          S`Tương tự \(IN = \dfrac{SO}{2}\); lại có \(IS = IO = \dfrac{SO}{2}\)`, S`Vậy \(S, M, O, N\) cùng thuộc đường tròn \((I;\ \tfrac{SO}{2})\)`),
        loi: ['Không nêu bán kính SO/2', 'Dùng dấu hiệu tứ giác nội tiếp (bị cấm)'] },

   --accent-glow: rgba(56, 189, 248, 0.6);\n            --key-col-bg: rgba(234, 179, 8, 0.15);\n            --key-col-border: #eab308;\n            --key-col-glow: rgba(234, 179, 8, 0.6);\n            --success: #4ade80;\n            --danger: #f87171;\n            --warning: #fbbf24;\n            --cell-bg: rgba(30, 41, 59, 0.8);\n            --cell-border: #475569;\n            --cell-text: #ffffff;\n            --shadow-sm: 0 1px 3px rgba(0,0,0,0.5);\n            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.5);\n            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.5);\n        }\n\n        * { margin: 0; padding: 0; box-sizing: border-box; }\n        \n        body {\n            font-family: var(--font-ui);\n            background: var(--bg-main);\n            color: var(--text-main);\n            height: 100dvh;\n            overflow: hidden;\n            display: flex;\n            flex-direction: column;\n            transition: background 0.3s, color 0.3s;\n            font-size: calc(16px * var(--scale));\n        }\n\n        /* --- Starry Background for Dark Mode --- */\n        .stars { display: none; position: fixed; inset: 0; pointer-events: none; z-index: -1; }\n        [data-theme=&quot;dark&quot;] .stars { display: block; }\n        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle infinite ease-in-out; }\n        @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 5px white; } }\n\n        /* --- Layout Grid --- */\n        header {\n            height: 9vh;\n            display: flex;\n            justify-content: space-between;\n            align-items: center;\n            padding: 0 1.5vw;\n            border-bottom: 1px solid var(--border-color);\n            background: var(--bg-panel);\n            backdrop-filter: blur(10px);\n            z-index: 10;\n        }\n\n        main {\n            flex: 1;\n            display: grid;\n
