;/button&gt;\n                &lt;button class=&quot;btn btn-primary&quot; style=&quot;grid-column:auto;&quot; onclick=&quot;checkKeywordGuess()&quot;&gt;Xác nhận&lt;/button&gt;\n            &lt;/div&gt;\n            &lt;div class=&quot;q-feedback error&quot; id=&quot;guess-feedback&quot; style=&quot;margin-top:15px;&quot;&gt;&lt;/div&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n\n    &lt;div class=&quot;modal-overlay&quot; id=&quot;win-modal&quot;&gt;\n        &lt;div class=&quot;modal&quot; style=&quot;width: 800px; max-width: 95vw;&quot;&gt;\n            &lt;div style=&quot;font-size: 4rem; margin-bottom: 10px;&quot;&gt;🏆&lt;/div&gt;\n            &lt;h2 style=&quot;font-size: clamp(2rem, 3vw, 3rem); font-weight: 800; color: var(--accent-primary); margin-bottom: 10px;&quot;&gt;XUẤT SẮC!&lt;/h2&gt;\n            &lt;p style=&quot;font-size: 1.5rem; margin-bottom: 30px;&quot;&gt;Từ khóa chính là:&lt;/p&gt;\n            &lt;div id=&quot;win-keyword&quot; style=&quot;font-size: clamp(3rem, 5vw, 6rem); font-weight: 800; color: var(--key-col-border); letter-spacing: 5px; margin-bottom: 40px; text-shadow: 0 0 20px var(--key-col-glow);&quot;&gt;PHẢN CHỨNG&lt;/div&gt;\n            &lt;button class=&quot;btn btn-primary&quot; style=&quot;width: 100%; font-size: 1.5rem; padding: 20px;&quot; onclick=&quot;showSummary()&quot;&gt;Vào bài mới ➔&lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n\n    &lt;div class=&quot;modal-overlay&quot; id=&quot;help-modal&quot; onclick=&quot;if(event.target===this) closeModals()&quot;&gt;\n        &lt;div class=&quot;modal&quot; style=&quot;text-align: left;&quot;&gt;\n            &lt;h2 class=&quot;modal-title&quot;&gt;Phím Tắt Điều Khiển&lt;/h2&gt;\n            &lt;ul style=&quot;font-size: 1.2rem; line-height: 1.8; list-style: none;&quot;&gt;\n                &lt;li&gt;&lt;kbd&gt;1&lt;/kbd&gt; - &lt;kbd&gt;9&lt;/kbd&gt;: Chọn nhanh hàng ngang&lt;/li&gt;\n                &lt;li&gt;&lt;kbd&gt;Enter&lt;/kbd&gt;: Kiểm tra đáp án khi đang nhập&lt;/li&gt;\n                &lt;li&gt;&lt;kbd&gt;H&lt;/kbd&gt;: Gợi ý 1 chữ (khi đang ở câu hỏi)&lt;/li&gt;\n                &lt;li&gt;&lt;kbd&gt;R&lt;/kbd&gt;: Mở toàn bộ đáp án hàng đó&lt;/li&gt;\n                &lt;li&gt;&lt;kbd&gt;K&lt;/kbd&gt;: Mở bảng đoán từ khóa (cần mở ít nhất 4 hàng)&lt;/li&gt;\n                &lt;li&gt;&lt;kbd&gt;T&lt;/kbd&gt;: Tạm dừng / Tiếp tục đồng hồ&lt;/li&gt;\n                &lt;li&gt;&lt;kbd&gt;F&lt;/kbd&gt;: Bật / Tắt toàn màn hình&lt;/li&gt;\n                &lt;li&gt;&lt;kbd&gt;M&lt;/kbd&gt;: Bật / Tắt âm thanh&lt;/li&gt;\n                &lt;li&gt;&lt;kbd&gt;+&lt;/kbd&gt; / &lt;kbd&gt;-&lt;/kbd&gt;: Phóng to / Thu nhỏ giao diện&lt;/li&gt;\n                &lt;li&gt;&lt;kbd&gt;Esc&lt;/kbd&gt;: Đóng cửa sổ / Quay lại bảng chọn&lt;/li&gt;\n                &lt;li&gt;&lt;kbd&gt;→&lt;/kbd&gt; / &lt;kbd&gt;Space&lt;/kbd&gt; / &lt;kbd&gt;PgDn&lt;/kbd&gt;: Chuyển slide&lt;/li&gt;\n            &lt;/ul&gt;\n            &lt;div style=&quot;text-align: center; margin-top: 20px;&quot;&gt;\n                &lt;button class=&quot;btn btn-primary&quot; onclick=&quot;closeModals()&quot;&gt;Đã hiểu&lt;/button&gt;\n            &lt;/div&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n\n    &lt;div class=&quot;summary-screen&quot; id=&quot;summary-screen&quot;&gt;\n        &lt;button class=&quot;btn-icon btn-close-summary&quot; onclick=&quot;closeSummary()&quot; title=&quot;Đóng (Esc)&quot;&gt;✕&lt;/button&gt;\n        &lt;button class=&quot;slide-nav prev&quot; onclick=&quot;changeSlide(-1)&quot;&gt;❮&lt;/button&gt;\n        &lt;button class=&quot;slide-nav next&quot; onclick=&quot;changeSlide(1)&quot;&gt;❯&lt;/button&gt;\n        &lt;div class=&quot;slide-container&quot; id=&quot;slides-container&quot;&gt;&lt;/div&gt;\n        &lt;div class=&quot;slide-dots&quot; id=&quot;slide-dots&quot;&gt;&lt;/div&gt;\n    &lt;/div&gt;\n\n    &lt;script&gt;\n        /** --- 1. DỮ LIỆU GAME --- \n         * Từ khóa: PHẢN CHỨNG (PHANCHUNG).\n         * Chữ khóa của các hàng KHÔNG theo thứ tự từ khóa: cột dọc đọc ra U G H N A C P N H,\n         * học sinh phải sắp xếp lại các chữ để tìm từ khóa.\n         * Các hàng chỉ dùng kiến thức cũ (Bài 10 và lớp dưới), không lộ khái niệm mới của Bài 11.\n         */\n        const KEYWORD = &quot;PHANCHUNG&quot;;\n        const KEYWORD_DISPLAY = &quot;PHẢN CHỨNG&quot;;\n        const KEYWORD_SPLIT = 4;   // khoảng trống sau chữ thứ 4 khi hiện từ khóa đúng thứ tự\n        const MIN_OPEN_TO_GUESS = 4;\n        const STORAGE_PREFIX = &#x27;pc11_&#x27;;\n\n        const puzzleData = [\n            {\n                id: 1, keyLetter: &quot;U&quot;, answer: &quot;TRUNGDIEM&quot;, keyIndex: 2,\n                question: &quot;Điểm nằm giữa và chia đoạn thẳng thành hai đoạn bằng nhau được gọi là…&quot;,\n                explain: &quot;$M$ là trung điểm của $AB$ khi $M$ nằm giữa $A, B$ và $MA = MB$.&quot;\n            },\n            {\n                id: 2, keyLetter: &quot;G&quot;, answer: &quot;GIAODIEM&quot;, keyIndex: 0,\n                question: &quot;Đường thẳng $d$ không nằm trong mặt phẳng $(P)$ và có đúng một điểm chung với $(P)$. Điểm chung đó gọi là…&quot;,\n                explain: &quot;Kí hiệu $d \\\\cap (P) = \\\\{I\\\\}$. Muốn tìm giao điểm, ta tìm một đường thẳng nằm trong $(P)$ cắt $d$.&quot;\n            },\n            {\n                id: 3, keyLetter: &quot;H&quot;, answer: &quot;DUONGTHANG&quot;, keyIndex: 6,\n                question: &quot;Qua hai điểm phân biệt có một và chỉ một…&quot;,\n                explain: &quot;Qua hai điểm phân biệt $A, B$ có duy nhất một đường thẳng, kí hiệu là $AB$.&quot;\n            },\n            {\n                id: 4, keyLetter: &quot;N&quot;, answer: &quot;TUDIEN&quot;, keyIndex: 5,\n                question: &quot;Hình chóp tam giác còn được gọi là hình…&quot;,\n                explain: &quot;Tứ diện $ABCD$ có 4 đỉnh, 6 cạnh và 4 mặt đều là tam giác.&quot;\n            },\n            {\n                id: 5, keyLetter: &quot;A&quot;, answer: &quot;GIAOTUYEN&quot;, keyIndex: 2,\n                question: &quot;Đường thẳng chung của hai mặt phẳng phân biệt được gọi là…&quot;,\n                explain: &quot;Hai mặt phẳng phân biệt $(P)$ và $(Q)$ có một điểm chung thì có đúng một đường thẳng chung đi qua điểm đó, gọi là giao tuyến: $d = (P) \\\\cap (Q)$.&quot;\n            },\n            {\n                id: 6, keyLetter: &quot;C&quot;, answer: &quot;CATNHAU&quot;, keyIndex: 0,\n                question: &quot;Trong mặt phẳng, hai đường thẳng có đúng một điểm chung thì chúng…&quot;,\n                explain: &quot;Kí hiệu $a \\\\cap b = \\\\{M\\\\}$. Trong mặt phẳng, hai đường thẳng phân biệt chỉ có thể cắt nhau hoặc song song. Trong không gian thì sao? Hôm nay ta sẽ tìm câu trả lời.&quot;\n            },\n            {\n                id: 7, keyLetter: &quot;P&quot;, answer: &quot;MATPHANG&quot;, keyIndex: 3,\n                question: &quot;Qua ba điểm không thẳng hàng xác định duy nhất một…&quot;,\n                explain: &quot;Mặt phẳng đi qua ba điểm $A, B, C$ không thẳng hàng kí hiệu là $(ABC)$.&quot;\n            },\n            {\n                id: 8, keyLetter: &quot;N&quot;, answer: &quot;BINHHANH&quot;, keyIndex: 2,\n                question: &quot;Tứ giác có các cặp cạnh đối song song là hình…&quot;,\n                explain: &quot;Hình bình hành $ABCD$ có $AB \\\\parallel CD$, $AD \\\\parallel BC$; hai đường chéo cắt nhau tại trung điểm của mỗi đường.&quot;\n            },\n            {\n                id: 9, keyLetter: &quot;H&quot;, answer: &quot;HINHCHOP&quot;, keyIndex: 3,\n                question: &quot;Hình gồm đỉnh $S$ và đáy là tứ giác $ABCD$, các mặt bên là tam giác, được gọi là…&quot;,\n                explain: &quot;Hình chóp $S.ABCD$ có đỉnh $S$, đáy $ABCD$ và 4 mặt bên $SAB, SBC, SCD, SDA$.&quot;\n            }\n        ];\n\n        const summarySlides = [\n            {\n                title: &quot;Từ khóa: PHẢN CHỨNG&quot;,\n                cards: [\n                    { icon: &quot;🧠&quot;, title: &quot;Phương pháp chứng minh phản chứng&quot;, text: &quot;&lt;strong&gt;Bước 1.&lt;/strong&gt; Giả sử điều cần chứng minh là &lt;strong&gt;sai&lt;/strong&gt;.&lt;br&gt;&lt;strong&gt;Bước 2.&lt;/strong&gt; Từ giả sử đó, lập luận đến một &lt;strong&gt;mâu thuẫn&lt;/strong&gt; (với giả thiết hoặc với điều đã biết).&lt;br&gt;&lt;strong&gt;Bước 3.&lt;/strong&gt; Kết luận: giả sử sai, vậy điều cần chứng minh là &lt;strong&gt;đúng&lt;/strong&gt;.&quot; }\n                ]\n            },\n            {\n                title: &quot;Câu hỏi của bài hôm nay&quot;,\n                cards: [\n                    { icon: &quot;📐&quot;, title: &quot;Trong mặt phẳng&quot;, text: &quot;Hai đường thẳng phân biệt chỉ có thể &lt;strong&gt;cắt nhau&lt;/strong&gt; hoặc &lt;strong&gt;song song&lt;/strong&gt;.&quot; },\n                    { icon: &quot;🤔&quot;, title: &quot;Trong không gian thì sao?&quot;, text: &quot;Hai đường thẳng &lt;strong&gt;không có điểm chung&lt;/strong&gt; thì có chắc chắn song song không?&lt;br&gt;Phương pháp phản chứng sẽ giúp ta trả lời.&quot; }\n                ]\n            }\n        ];\n\n        /** --- 2. TRẠNG THÁI &amp; HỆ THỐNG --- */\n        let state = {\n            maxLeft: 0,\n            cols: 0,\n            rows: puzzleData.length,\n            currentRow: null,\n            timer: 30,\n            timerInterval: null,\n            timerPaused: false,\n            solvedRows: [],\n            skippedRows: [],\n            keywordSolved: false,\n            isMuted: false,\n            uiScale: 1,\n            currentSlide: 0\n        };\n\n        let audioCtx;\n        const sounds = {\n            play(type) {\n                if (state.isMuted) return;\n                try {\n                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n                    if (audioCtx.state === &#x27;suspended&#x27;) audioCtx.resume();\n                } catch (e) { return; }\n                \n                const osc = audioCtx.createOscillator();\n                const gain = audioCtx.createGain();\n                osc.connect(gain);\n                gain.connect(audioCtx.destination);\n                const now = audioCtx.currentTime;\n                \n                switch(type) {\n                    case &#x27;flip&#x27;:\n                        osc.type = &#x27;sine&#x27;;\n                        osc.frequency.setValueAtTime(800, now);\n                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);\n                        gain.gain.setValueAtTime(0.3, now);\n                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);\n                        osc.start(now); osc.stop(now + 0.1);\n                        break;\n                    case &#x27;correct&#x27;:\n                        osc.type = &#x27;triangle&#x27;;\n                        osc.frequency.setValueAtTime(523.25, now);\n                        osc.frequency.setValueAtTime(659.25, now + 0.1);\n                        osc.frequency.setValueAtTime(783.99, now + 0.2);\n                        gain.gain.setValueAtTime(0.5, now);\n                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);\n                        osc.start(now); osc.stop(now + 0.5);\n                        break;\n                    case &#x27;wrong&#x27;:\n                        osc.type = &#x27;sawtooth&#x27;;\n                        osc.frequency.setValueAtTime(150, now);\n                        osc.frequency.linearRampToValueAtTime(100, now + 0.2);\n                        gain.gain.setValueAtTime(0.3, now);\n                        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);\n                        osc.start(now); osc.stop(now + 0.2);\n                        break;\n                    case &#x27;tick&#x27;:\n                        osc.type = &#x27;square&#x27;;\n                        osc.frequency.setValueAtTime(200, now);\n                        gain.gain.setValueAtTime(0.1, now);\n                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);\n                        osc.start(now); osc.stop(now + 0.05);\n                        break;\n                    case &#x27;win&#x27;:\n                        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) =&gt; {\n                            const o = audioCtx.createOscillator();\n                            const g = audioCtx.createGain();\n                            o.type = &#x27;sine&#x27;; o.frequency.value = freq;\n                            o.connect(g); g.connect(audioCtx.destination);\n                            g.gain.setValueAtTime(0, now + i*0.1);\n                            g.gain.linearRampToValueAtTime(0.4, now + i*0.1 + 0.05);\n                            g.gain.exponentialRampToValueAtTime(0.01, now + i*0.1 + 0.5);\n                            o.start(now + i*0.1); o.stop(now + i*0.1 + 0.5);\n                        });\n                        break;\n                }\n            }\n        };\n\n        /** --- 3. KHỞI TẠO &amp; TÍNH TOÁN LƯỚI --- */\n        function init() {\n            let maxRight = 0;\n            puzzleData.forEach(row =&gt; {\n                if (row.keyIndex &gt; state.maxLeft) state.maxLeft = row.keyIndex;\n                const rightLen = row.answer.length - row.keyIndex - 1;\n                if (rightLen &gt; maxRight) maxRight = rightLen;\n            });\n            state.cols = 1 + state.maxLeft + 1 + maxRight;\n\n            loadProgress();\n            buildBoard();\n            buildPanelGrid();\n            buildDecodeArea();\n            generateStars();\n            \n            setTimeout(fitGrid, 50);\n            window.addEventListener(&#x27;resize&#x27;, fitGrid);\n            document.addEventListener(&#x27;keydown&#x27;, handleShortcuts);\n        }\n\n        function isOpened(id) {\n            return state.solvedRows.includes(id) || state.skippedRows.includes(id);\n        }\n\n        function buildBoard() {\n            const board = document.getElementById(&#x27;crossword-board&#x27;);\n            board.innerHTML = &#x27;&#x27;;\n            \n            puzzleData.forEach(row =&gt; {\n                const rowEl = document.createElement(&#x27;div&#x27;);\n                rowEl.className = `row ${state.solvedRows.includes(row.id) ? &#x27;solved&#x27; : &#x27;&#x27;} ${state.skippedRows.includes(row.id) ? &#x27;skipped&#x27; : &#x27;&#x27;}`;\n                rowEl.id = `row-${row.id}`;\n                rowEl.onclick = () =&gt; selectRow(row.id);\n                \n                const offset = state.maxLeft - row.keyIndex;\n                rowEl.style.marginLeft = `calc(${offset} * (var(--cell) * 1.12))`;\n                \n                const numEl = document.createElement(&#x27;div&#x27;);\n                numEl.className = &#x27;row-num&#x27;;\n                numEl.innerHTML = `&lt;span&gt;${row.id}&lt;/span&gt;`;\n                rowEl.appendChild(numEl);\n\n                const cellsGroup = document.createElement(&#x27;div&#x27;);\n                cellsGroup.className = &#x27;cells-group&#x27;;\n                \n                for (let i = 0; i &lt; row.answer.length; i++) {\n                    const isKey = (i === row.keyIndex);\n                    const cell = document.createElement(&#x27;div&#x27;);\n                    cell.className = `cell ${isKey ? &#x27;is-key&#x27; : &#x27;&#x27;} ${isOpened(row.id) || state.keywordSolved ? &#x27;flipped&#x27; : &#x27;&#x27;}`;\n                    cell.id = `cell-${row.id}-${i}`;\n                    cell.onclick = (e) =&gt; {\n                        if (state.currentRow === row.id &amp;&amp; !state.solvedRows.includes(row.id) &amp;&amp; !cell.classList.contains(&#x27;flipped&#x27;)) {\n                            e.stopPropagation();\n                            flipCell(row.id, i);\n                        }\n                    };\n                    cell.innerHTML = `\n                        &lt;div class=&quot;cell-inner&quot;&gt;\n                            &lt;div class=&quot;cell-front&quot;&gt;&lt;/div&gt;\n                            &lt;div class=&quot;cell-back&quot;&gt;${row.answer[i]}&lt;/div&gt;\n                        &lt;/div&gt;\n                    `;\n                    cellsGroup.appendChild(cell);\n                }\n                rowEl.appendChild(cellsGroup);\n                board.appendChild(rowEl);\n            });\n        }\n\n        function buildPanelGrid() {\n            const grid = document.getElementById(&#x27;panel-grid&#x27;);\n            grid.innerHTML = &#x27;&#x27;;\n            puzzleData.forEach(row =&gt; {\n                const btn = document.createElement(&#x27;button&#x27;);\n                btn.className = `num-btn ${state.solvedRows.includes(row.id) ? &#x27;solved&#x27; : &#x27;&#x27;} ${state.skippedRows.includes(row.id) ? &#x27;skipped&#x27; : &#x27;&#x27;}`;\n                btn.id = `num-btn-${row.id}`;\n                btn.innerText = row.id;\n                btn.onclick = () =&gt; selectRow(row.id);\n                grid.appendChild(btn);\n            });\n        }\n\n        // Ô giải mã: ô thứ i ứng với hàng i (chữ đã xáo trộn). Chữ chỉ được ghi vào khi hàng đã mở.\n        function buildDecodeArea() {\n            const area = document.getElementById(&#x27;decode-area&#x27;);\n            area.innerHTML = &#x27;&#x27;;\n            puzzleData.forEach(row =&gt; {\n                const cell = document.createElement(&#x27;div&#x27;);\n                cell.className = &#x27;decode-cell&#x27;;\n                cell.id = `decode-${row.id}`;\n                cell.dataset.row = row.id;\n                if (isOpened(row.id)) {\n                    cell.innerText = row.keyLetter;\n                    cell.classList.add(&#x27;revealed&#x27;);\n                }\n                area.appendChild(cell);\n            });\n        }\n\n        function revealDecodeLetter(id) {\n            const row = puzzleData.find(r =&gt; r.id === id);\n            const cell = document.getElementById(`decode-${id}`);\n            if (row &amp;&amp; cell &amp;&amp; !cell.classList.contains(&#x27;revealed&#x27;)) {\n                cell.innerText = row.keyLetter;\n                cell.classList.add(&#x27;revealed&#x27;);\n            }\n        }\n\n        // Khi đoán đúng: sắp lại các ô theo đúng thứ tự từ khóa\n        function showKeywordInOrder() {\n            const area = document.getElementById(&#x27;decode-area&#x27;);\n            area.innerHTML = &#x27;&#x27;;\n            [...KEYWORD].forEach((ch, i) =&gt; {\n                if (i === KEYWORD_SPLIT) {\n                    const gap = document.createElement(&#x27;div&#x27;);\n                    gap.className = &#x27;decode-gap&#x27;;\n                    area.appendChild(gap);\n                }\n                const cell = document.createElement(&#x27;div&#x27;);\n                cell.className = &#x27;decode-cell revealed final&#x27;;\n                cell.innerText = ch;\n                area.appendChild(cell);\n            });\n            document.getElementById(&#x27;decode-hint&#x27;).innerText = &#x27;Từ khóa: &#x27; + KEYWORD_DISPLAY;\n        }\n\n        function fitGrid() {\n            const container = document.getElementById(&#x27;board-container&#x27;);\n            if (!container) return;\n            const W = container.clientWidth - (window.innerWidth * 0.02);\n            const H = container.clientHeight - (window.innerWidth * 0.02);\n            let cell = Math.min(W / (state.cols * 1.12), H / (state.rows * 1.15));\n            cell = Math.max(28, Math.min(128, cell));\n            document.documentElement.style.setProperty(&#x27;--cell&#x27;, `${cell}px`);\n        }\n\n        /** --- 4. LOGIC TRÒ CHƠI --- */\n        function selectRow(id) {\n            if (state.keywordSolved) return;\n            const rowData = puzzleData.find(r =&gt; r.id === id);\n            if (!rowData) return;\n\n            document.querySelectorAll(&#x27;.row&#x27;).forEach(r =&gt; r.classList.remove(&#x27;active&#x27;));\n            document.getElementById(`row-${id}`).classList.add(&#x27;active&#x27;);\n            state.currentRow = id;\n            \n            document.getElementById(&#x27;panel-grid&#x27;).style.display = &#x27;none&#x27;;\n            document.getElementById(&#x27;panel-question&#x27;).style.display = &#x27;flex&#x27;;\n            document.getElementById(&#x27;panel-explain&#x27;).style.display = &#x27;none&#x27;;\n            \n            document.getElementById(&#x27;q-row-info&#x27;).innerText = `Hàng ${id} • ${rowData.answer.length} chữ cái`;\n            document.getElementById(&#x27;q-text&#x27;).innerText = rowData.question;\n            renderMathSafely(document.getElementById(&#x27;q-text&#x27;));\n            \n            const input = document.getElementById(&#x27;q-input&#x27;);\n            input.value = &#x27;&#x27;;\n            \n            const feedback = document.getElementById(&#x27;q-feedback&#x27;);\n            feedback.innerText = &#x27;&#x27;;\n            feedback.className = &#x27;q-feedback&#x27;;\n\n            if (isOpened(id)) {\n                stopTimer();\n                resetTimerUI();\n                showExplain(rowData, state.solvedRows.includes(id));\n                return;\n            }\n            input.focus();\n            startTimer();\n        }\n\n        function backToGrid() {\n            state.currentRow = null;\n            document.querySelectorAll(&#x27;.row&#x27;).forEach(r =&gt; r.classList.remove(&#x27;active&#x27;));\n            document.getElementById(&#x27;panel-question&#x27;).style.display = &#x27;none&#x27;;\n            document.getElementById(&#x27;panel-explain&#x27;).style.display = &#x27;none&#x27;;\n            document.getElementById(&#x27;panel-grid&#x27;).style.display = &#x27;grid&#x27;;\n            stopTimer();\n            resetTimerUI();\n        }\n\n        function normalizeStr(str) {\n            return str.normalize(&quot;NFD&quot;).replace(/[\\u0300-\\u036f]/g, &quot;&quot;)\n                .replace(/đ/g, &quot;d&quot;).replace(/Đ/g, &quot;D&quot;)\n                .replace(/[^A-Za-z]/g, &quot;&quot;).toUpperCase();\n        }\n\n        function checkAnswer() {\n            if (!state.currentRow) return;\n            const rowData = puzzleData.find(r =&gt; r.id === state.currentRow);\n            if (state.solvedRows.includes(rowData.id)) return;\n            const inputEl = document.getElementById(&#x27;q-input&#x27;);\n            const feedback = document.getElementById(&#x27;q-feedback&#x27;);\n            const ans = normalizeStr(inputEl.value);\n\n            if (ans === rowData.answer) {\n                stopTimer();\n                feedback.innerText = &#x27;Chính xác! ✓&#x27;;\n                feedback.className = &#x27;q-feedback success&#x27;;\n                sounds.play(&#x27;correct&#x27;);\n                markRowSolved(rowData.id);\n                \n                let delay = 0;\n                for (let i = 0; i &lt; rowData.answer.length; i++) {\n                    const cell = document.getElementById(`cell-${rowData.id}-${i}`);\n                    if (!cell.classList.contains(&#x27;flipped&#x27;)) {\n                        setTimeout(() =&gt; flipCell(rowData.id, i), delay);\n                        delay += 100;\n                    }\n                }\n                setTimeout(() =&gt; showExplain(rowData, true), delay + 300);\n            } else {\n                inputEl.classList.remove(&#x27;error&#x27;);\n                void inputEl.offsetWidth;\n                inputEl.classList.add(&#x27;error&#x27;);\n                feedback.innerText = &#x27;Chưa đúng ✗&#x27;;\n                feedback.className = &#x27;q-feedback error&#x27;;\n                sounds.play(&#x27;wrong&#x27;);\n            }\n        }\n\n        function showExplain(rowData, solved) {\n            document.getElementById(&#x27;panel-question&#x27;).style.display = &#x27;none&#x27;;\n            document.getElementById(&#x27;panel-explain&#x27;).style.display = &#x27;flex&#x27;;\n            document.getElementById(&#x27;explain-title&#x27;).innerText = solved\n                ? `✓ ${rowData.answer}`\n                : `Đáp án: ${rowData.answer}`;\n            const exText = document.getElementById(&#x27;explain-text&#x27;);\n            exText.innerHTML = rowData.explain;\n            renderMathSafely(exText);\n        }\n\n        function flipCell(rowId, colIndex) {\n            const cell = document.getElementById(`cell-${rowId}-${colIndex}`);\n            if (cell &amp;&amp; !cell.classList.contains(&#x27;flipped&#x27;)) {\n                cell.classList.add(&#x27;flipped&#x27;);\n                sounds.play(&#x27;flip&#x27;);\n            }\n        }\n\n        function hintLetter() {\n            if (!state.currentRow) return;\n            const rowData = puzzleData.find(r =&gt; r.id === state.currentRow);\n            // Gợi ý: ưu tiên mở chữ không phải chữ khóa để không lộ từ khóa\n            const order = [...Array(rowData.answer.length).keys()]\n                .filter(i =&gt; i !== rowData.keyIndex).concat([rowData.keyIndex]);\n            for (const i of order) {\n                const cell = document.getElementById(`cell-${rowData.id}-${i}`);\n                if (!cell.classList.contains(&#x27;flipped&#x27;)) {\n                    flipCell(rowData.id, i);\n                    break;\n                }\n            }\n        }\n\n        function revealRow() {\n            if (!state.currentRow) return;\n            const rowData = puzzleData.find(r =&gt; r.id === state.currentRow);\n            \n            for (let i = 0; i &lt; rowData.answer.length; i++) flipCell(rowData.id, i);\n            \n            if (!isOpened(rowData.id)) {\n                state.skippedRows.push(rowData.id);\n                document.getElementById(`row-${rowData.id}`).classList.add(&#x27;skipped&#x27;);\n                document.getElementById(`num-btn-${rowData.id}`).classList.add(&#x27;skipped&#x27;);\n                revealDecodeLetter(rowData.id);\n                saveProgress();\n            }\n            stopTimer();\n            setTimeout(() =&gt; showExplain(rowData, false), 500);\n        }\n\n        function markRowSolved(id) {\n            if (!state.solvedRows.includes(id)) {\n                state.solvedRows.push(id);\n                state.skippedRows = state.skippedRows.filter(x =&gt; x !== id);\n                document.getElementById(`row-${id}`).classList.add(&#x27;solved&#x27;);\n                document.getElementById(`row-${id}`).classList.remove(&#x27;skipped&#x27;);\n                document.getElementById(`num-btn-${id}`).classList.add(&#x27;solved&#x27;);\n                document.getElementById(`num-btn-${id}`).classList.remove(&#x27;skipped&#x27;);\n                revealDecodeLetter(id);\n                saveProgress();\n            }\n        }\n\n        function triggerWin() {\n            if (state.keywordSolved) return;\n            state.keywordSolved = true;\n            stopTimer();\n            sounds.play(&#x27;win&#x27;);\n            \n            puzzleData.forEach(r =&gt; {\n                for (let i = 0; i &lt; r.answer.length; i++) {\n                    document.getElementById(`cell-${r.id}-${i}`).classList.add(&#x27;flipped&#x27;);\n                }\n            });\n            showKeywordInOrder();\n\n            if (typeof confetti === &#x27;function&#x27;) {\n                const end = Date.now() + 3000;\n                (function frame() {\n                    confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: [&#x27;#0ea5e9&#x27;, &#x27;#eab308&#x27;] });\n                    confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: [&#x27;#0ea5e9&#x27;, &#x27;#eab308&#x27;] });\n                    if (Date.now() &lt; end) requestAnimationFrame(frame);\n                }());\n            }\n            setTimeout(() =&gt; document.getElementById(&#x27;win-modal&#x27;).classList.add(&#x27;active&#x27;), 1500);\n        }\n\n        /** --- 5. ĐOÁN TỪ KHÓA --- */\n        function openedCount() {\n            return puzzleData.filter(r =&gt; isOpened(r.id)).length;\n        }\n\n        function openGuessModal() {\n            if (state.keywordSolved) return;\n            document.getElementById(&#x27;guess-modal&#x27;).classList.add(&#x27;active&#x27;);\n            const input = document.getElementById(&#x27;guess-input&#x27;);\n            const fb = document.getElementById(&#x27;guess-feedback&#x27;);\n            input.value = &#x27;&#x27;;\n            const n = openedCount();\n            fb.innerText = n &lt; MIN_OPEN_TO_GUESS\n                ? `Cần mở ít nhất ${MIN_OPEN_TO_GUESS} hàng ngang mới được đoán (đã mở ${n}).`\n                : &#x27;&#x27;;\n            setTimeout(() =&gt; input.focus(), 100);\n        }\n\n        function checkKeywordGuess() {\n            const input = document.getElementById(&#x27;guess-input&#x27;);\n            const fb = document.getElementById(&#x27;guess-feedback&#x27;);\n            const n = openedCount();\n            if (n &lt; MIN_OPEN_TO_GUESS) {\n                fb.innerText = `Cần mở ít nhất ${MIN_OPEN_TO_GUESS} hàng ngang mới được đoán (đã mở ${n}).`;\n                sounds.play(&#x27;wrong&#x27;);\n                return;\n            }\n            if (normalizeStr(input.value) === KEYWORD) {\n                closeModals();\n                triggerWin();\n            } else {\n                fb.innerText = &#x27;Chưa chính xác! Đội này mất quyền đoán.&#x27;;\n                sounds.play(&#x27;wrong&#x27;);\n                input.classList.add(&#x27;error&#x27;);\n                setTimeout(() =&gt; input.classList.remove(&#x27;error&#x27;), 400);\n            }\n        }\n\n        /** --- 6. TIMER --- */\n        function startTimer() {\n            stopTimer();\n            state.timer = 30;\n            state.timerPaused = false;\n            updateTimerUI();\n            state.timerInterval = setInterval(() =&gt; {\n                if (!state.timerPaused) {\n                    state.timer--;\n                    updateTimerUI();\n                    if (state.timer &lt;= 10 &amp;&amp; state.timer &gt; 0) sounds.play(&#x27;tick&#x27;);\n                    if (state.timer &lt;= 0) {\n                        stopTimer();\n                        document.getElementById(&#x27;q-feedback&#x27;).innerText = &#x27;Hết giờ!&#x27;;\n                        document.getElementById(&#x27;q-feedback&#x27;).className = &#x27;q-feedback error&#x27;;\n                        sounds.play(&#x27;wrong&#x27;);\n                    }\n                }\n            }, 1000);\n        }\n\n        function stopTimer() { clearInterval(state.timerInterval); }\n        function toggleTimer() { state.timerPaused = !state.timerPaused; }\n\n        function updateTimerUI() {\n            const path = document.getElementById(&#x27;timer-path&#x27;);\n            const text = document.getElementById(&#x27;timer-text&#x27;);\n            const container = document.querySelector(&#x27;.timer-container&#x27;);\n            text.innerText = state.timer;\n            path.style.strokeDashoffset = 283 - (state.timer / 30) * 283;\n            container.classList.toggle(&#x27;timer-warning&#x27;, state.timer &lt;= 10);\n        }\n\n        function resetTimerUI() {\n            document.getElementById(&#x27;timer-text&#x27;).innerText = &#x27;--&#x27;;\n            document.getElementById(&#x27;timer-path&#x27;).style.strokeDashoffset = 0;\n            document.querySelector(&#x27;.timer-container&#x27;).classList.remove(&#x27;timer-warning&#x27;);\n        }\n\n        /** --- 7. SLIDE VÀO BÀI --- */\n        function showSummary() {\n            closeModals();\n            document.getElementById(&#x27;summary-screen&#x27;).classList.add(&#x27;active&#x27;);\n            const container = document.getElementById(&#x27;slides-container&#x27;);\n            const dotsContainer = document.getElementById(&#x27;slide-dots&#x27;);\n            container.innerHTML = &#x27;&#x27;; dotsContainer.innerHTML = &#x27;&#x27;;\n            \n            summarySlides.forEach((slide, idx) =&gt; {\n                const sEl = document.createElement(&#x27;div&#x27;);\n                sEl.className = `slide ${idx === 0 ? &#x27;active&#x27; : &#x27;&#x27;}`;\n                sEl.id = `slide-${idx}`;\n                const cardsHtml = slide.cards.map(c =&gt; `\n                    &lt;div class=&quot;info-card&quot;&gt;\n                        &lt;span class=&quot;icon&quot;&gt;${c.icon}&lt;/span&gt;\n                        &lt;div style=&quot;font-weight:700; margin-bottom:10px;&quot;&gt;${c.title}&lt;/div&gt;\n                        &lt;div&gt;${c.text}&lt;/div&gt;\n                    &lt;/div&gt;\n                `).join(&#x27;&#x27;);\n                sEl.innerHTML = `&lt;div class=&quot;slide-title&quot;&gt;${slide.title}&lt;/div&gt;&lt;div class=&quot;card-grid&quot;&gt;${cardsHtml}&lt;/div&gt;`;\n                container.appendChild(sEl);\n                renderMathSafely(sEl);\n                \n                const dot = document.createElement(&#x27;div&#x27;);\n                dot.className = `dot ${idx === 0 ? &#x27;active&#x27; : &#x27;&#x27;}`;\n                dot.onclick = () =&gt; goToSlide(idx);\n                dotsContainer.appendChild(dot);\n            });\n            state.currentSlide = 0;\n        }\n\n        function closeSummary() { document.getElementById(&#x27;summary-screen&#x27;).classList.remove(&#x27;active&#x27;); }\n        function changeSlide(dir) { goToSlide(state.currentSlide + dir); }\n\n        function goToSlide(idx) {\n            if (idx &gt;= summarySlides.length) { try { parent.postMessage({ tc: &#x27;next&#x27; }, &#x27;*&#x27;); } catch (e) {} return; }\n            if (idx &lt; 0) return;\n            document.getElementById(`slide-${state.currentSlide}`).classList.remove(&#x27;active&#x27;);\n            document.getElementById(&#x27;slide-dots&#x27;).children[state.currentSlide].classList.remove(&#x27;active&#x27;);\n            state.currentSlide = idx;\n            document.getElementById(`slide-${state.currentSlide}`).classList.add(&#x27;active&#x27;);\n            document.getElementById(&#x27;slide-dots&#x27;).children[state.currentSlide].classList.add(&#x27;active&#x27;);\n        }\n\n        /** --- 8. TIỆN ÍCH &amp; ĐIỀU KHIỂN --- */\n        function renderMathSafely(element) {\n            if (typeof renderMathInElement === &#x27;function&#x27;) {\n                try {\n                    renderMathInElement(element, {\n                        delimiters: [\n                            {left: &quot;$$&quot;, right: &quot;$$&quot;, display: true},\n                            {left: &quot;$&quot;, right: &quot;$&quot;, display: false}\n                        ],\n                        throwOnError: false\n                    });\n                } catch(e) { console.warn(&quot;KaTeX error&quot;, e); }\n            }\n        }\n\n        function toggleFullScreen() {\n            if (!document.fullscreenElement) {\n                document.documentElement.requestFullscreen().catch(() =&gt; {});\n            } else if (document.exitFullscreen) {\n                document.exitFullscreen();\n            }\n        }\n\n        function toggleTheme() {\n            const body = document.body;\n            if (body.hasAttribute(&#x27;data-theme&#x27;)) {\n                body.removeAttribute(&#x27;data-theme&#x27;);\n                document.getElementById(&#x27;theme-icon&#x27;).innerText = &#x27;🌙&#x27;;\n            } else {\n                body.setAttribute(&#x27;data-theme&#x27;, &#x27;dark&#x27;);\n                document.getElementById(&#x27;theme-icon&#x27;).innerText = &#x27;☀️&#x27;;\n            }\n        }\n\n        function toggleSound() {\n            state.isMuted = !state.isMuted;\n            document.getElementById(&#x27;sound-icon&#x27;).innerText = state.isMuted ? &#x27;🔇&#x27; : &#x27;🔊&#x27;;\n        }\n\n        function adjustScale(delta) {\n            state.uiScale = Math.max(0.7, Math.min(1.5, state.uiScale + delta));\n            document.documentElement.style.setProperty(&#x27;--scale&#x27;, state.uiScale);\n            try { localStorage.setItem(STORAGE_PREFIX + &#x27;scale&#x27;, state.uiScale); } catch(e) {}\n            setTimeout(fitGrid, 50);\n        }\n\n        function generateStars() {\n            const container = document.getElementById(&#x27;stars-container&#x27;);\n            for (let i = 0; i &lt; 50; i++) {\n                const star = document.createElement(&#x27;div&#x27;);\n                star.className = &#x27;star&#x27;;\n                star.style.width = Math.random() * 3 + &#x27;px&#x27;;\n                star.style.height = star.style.width;\n                star.style.left = Math.random() * 100 + &#x27;vw&#x27;;\n                star.style.top = Math.random() * 100 + &#x27;vh&#x27;;\n                star.style.animationDuration = (2 + Math.random() * 3) + &#x27;s&#x27;;\n                star.style.animationDelay = Math.random() * 2 + &#x27;s&#x27;;\n                container.appendChild(star);\n            }\n        }\n\n        function showHelp() { document.getElementById(&#x27;help-modal&#x27;).classList.add(&#x27;active&#x27;); }\n        function closeModals() { document.querySelectorAll(&#x27;.modal-overlay&#x27;).forEach(m =&gt; m.classList.remove(&#x27;active&#x27;)); }\n\n        function handleShortcuts(e) {\n            const inInput = document.activeElement.tagName === &#x27;INPUT&#x27;;\n            if (inInput &amp;&amp; e.key !== &#x27;Enter&#x27; &amp;&amp; e.key !== &#x27;Escape&#x27;) return;\n\n            if (document.getElementById(&#x27;summary-screen&#x27;).classList.contains(&#x27;active&#x27;)) {\n                if (e.key === &#x27;ArrowRight&#x27; || e.key === &#x27;PageDown&#x27; || e.key === &#x27; &#x27;) changeSlide(1);\n                if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;PageUp&#x27;) changeSlide(-1);\n                if (e.key === &#x27;Escape&#x27;) closeSummary();\n                return;\n            }\n\n            if (!document.querySelector(&#x27;.modal-overlay.active&#x27;) &amp;&amp; !state.currentRow) {\n                if (e.key === &#x27;ArrowRight&#x27; || e.key === &#x27;PageDown&#x27;) { try { parent.postMessage({ tc: &#x27;next&#x27; }, &#x27;*&#x27;); } catch (err) {} return; }\n                if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;PageUp&#x27;) { try { parent.postMessage({ tc: &#x27;prev&#x27; }, &#x27;*&#x27;); } catch (err) {} return; }\n            }\n            if (e.key === &#x27;Escape&#x27;) { closeModals(); backToGrid(); return; }\n\n            if (e.key === &#x27;Enter&#x27;) {\n                if (document.getElementById(&#x27;guess-modal&#x27;).classList.contains(&#x27;active&#x27;)) checkKeywordGuess();\n                else if (state.currentRow &amp;&amp; inInput) checkAnswer();\n                return;\n            }\n            if (document.querySelector(&#x27;.modal-overlay.active&#x27;)) return;\n\n            if (e.key &gt;= &#x27;1&#x27; &amp;&amp; e.key &lt;= &#x27;9&#x27; &amp;&amp; !state.currentRow) selectRow(parseInt(e.key));\n            const k = e.key.toLowerCase();\n            if (k === &#x27;h&#x27; &amp;&amp; state.currentRow) hintLetter();\n            if (k === &#x27;r&#x27; &amp;&amp; state.currentRow) revealRow();\n            if (k === &#x27;k&#x27;) openGuessModal();\n            if (k === &#x27;t&#x27;) toggleTimer();\n            if (k === &#x27;f&#x27;) toggleFullScreen();\n            if (k === &#x27;m&#x27;) toggleSound();\n            if (e.key === &#x27;+&#x27; || e.key === &#x27;=&#x27;) adjustScale(0.1);\n            if (e.key === &#x27;-&#x27;) adjustScale(-0.1);\n            if (e.key === &#x27;?&#x27;) showHelp();\n        }\n\n        /** --- 9. LƯU TIẾN TRÌNH --- */\n        function saveProgress() {\n            try {\n                localStorage.setItem(STORAGE_PREFIX + &#x27;solved&#x27;, JSON.stringify(state.solvedRows));\n                localStorage.setItem(STORAGE_PREFIX + &#x27;skipped&#x27;, JSON.stringify(state.skippedRows));\n            } catch(e) {}\n        }\n\n        function loadProgress() {\n            try {\n                const s = localStorage.getItem(STORAGE_PREFIX + &#x27;solved&#x27;);\n                const sk = localStorage.getItem(STORAGE_PREFIX + &#x27;skipped&#x27;);\n                const scale = localStorage.getItem(STORAGE_PREFIX + &#x27;scale&#x27;);\n                if (s) state.solvedRows = JSON.parse(s);\n                if (sk) state.skippedRows = JSON.parse(sk);\n                if (scale) { state.uiScale = parseFloat(scale); document.documentElement.style.setProperty(&#x27;--scale&#x27;, state.uiScale); }\n            } catch(e) {}\n        }\n\n        function restartGame() {\n            if (confirm(&#x27;Làm mới toàn bộ tiến trình trò chơi?&#x27;)) {\n                try {\n                    localStorage.removeItem(STORAGE_PREFIX + &#x27;solved&#x27;);\n                    localStorage.removeItem(STORAGE_PREFIX + &#x27;skipped&#x27;);\n                } catch(e) {}\n                location.reload();\n            }\n        }\n\n        window.onload = init;\n    &lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n\">\u003c/iframe>\n\u003c/section>\n\n\u003c!-- 0. Bìa -->\n\u003csection class=\"slide cover\">\n  \u003ch1>Bài 11. Hai đường thẳng song song\u003c/h1>\n  \u003cp class=\"sub\">Vị trí tương đối của hai đường thẳng\u003c/p>\n\u003c/section>\n\n\u003c!-- 1. HĐ1 nút giao -->\n\u003csection class=\"slide\">\n  \u003ch2>Bốn tuyến đường ở một nút giao\u003c/h2>\n  \u003cdiv class=\"row\">\n    \u003cdiv class=\"col w2\">\u003cdiv class=\"viewer\" data-scene=\"junction\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"col\">\n      \u003cp class=\"q\">a) Tuyến nào giao nhau?\u003c/p>\n      \u003cp class=\"ans step\" data-step=\"1\">(1) và (2)\u003c/p>\n      \u003cp class=\"q\">b) Tuyến nào song song?\u003c/p>\n      \u003cp class=\"ans step\" data-step=\"2\">(1) và (4); (2) và (3)\u003c/p>\n      \u003cp class=\"q\">c) Không giao nhau?\u003c/p>\n      \u003cp class=\"ans step\" data-step=\"3\">Các cặp còn lại\u003c/p>\n      \u003cdiv class=\"box step\" data-step=\"4\">\u003cb>(3) và (4) song song?\u003c/b>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 2. Khám phá -->\n\u003csection class=\"slide\">\n  \u003ch2>Hai đường thẳng a và b nằm thế nào?\u003c/h2>\n  \u003cdiv class=\"row\">\n    \u003cdiv class=\"col w2\">\u003cdiv class=\"viewer\" data-scene=\"explore\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"col\">\n      \u003cdiv class=\"tools\" id=\"kTools\">\n        \u003cbutton data-k=\"1\" class=\"on\">k = 1\u003c/button>\u003cbutton data-k=\"2\">k = 2\u003c/button>\n        \u003cbutton data-k=\"3\">k = 3\u003c/button>\u003cbutton data-k=\"4\">k = 4\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"tools\">\u003cbutton id=\"togglePlane\" aria-pressed=\"true\">Mặt phẳng (α)\u003c/button>\u003c/div>\n      \u003cp>Có điểm chung không?\u003cbr>Có mặt phẳng chứa cả a và b không?\u003c/p>\n      \u003cbutton id=\"showK\">Kết luận\u003c/button>\n      \u003cdiv class=\"box blue\" id=\"kAns\" hidden>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 3. Chốt kiến thức -->\n\u003csection class=\"slide\">\n  \u003ch2>Vị trí tương đối của hai đường thẳng\u003c/h2>\n  \u003cdiv class=\"row\">\n    \u003cdiv class=\"col w2\">\n      \u003csvg class=\"zoomable\" viewBox=\"-10 -12 720 270\" style=\"width:100%\" role=\"img\" aria-label=\"Bốn vị trí tương đối\">\n        \u003cg fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"2\">\n          \u003cpath d=\"M10 120 L50 20 L150 20 L110 120 Z\"/>\u003cpath d=\"M175 120 L215 20 L315 20 L275 120 Z\"/>\n          \u003cpath d=\"M340 120 L380 20 L480 20 L440 120 Z\"/>\u003cpath d=\"M505 120 L545 20 L645 20 L605 120 Z\"/>\n        \u003c/g>\n        \u003cg stroke-width=\"4\">\n          \u003cline x1=\"35\" y1=\"55\" x2=\"135\" y2=\"95\" stroke=\"var(--c2)\"/>\u003cline x1=\"50\" y1=\"100\" x2=\"125\" y2=\"35\" stroke=\"var(--c3)\"/>\n          \u003cline x1=\"200\" y1=\"55\" x2=\"295\" y2=\"40\" stroke=\"var(--c2)\"/>\u003cline x1=\"195\" y1=\"100\" x2=\"285\" y2=\"85\" stroke=\"var(--c3)\"/>\n          \u003cline x1=\"360\" y1=\"95\" x2=\"460\" y2=\"50\" stroke=\"var(--c2)\"/>\u003cline x1=\"360\" y1=\"95\" x2=\"460\" y2=\"50\" stroke=\"var(--c3)\" stroke-dasharray=\"7 7\"/>\n          \u003cline x1=\"520\" y1=\"95\" x2=\"625\" y2=\"65\" stroke=\"var(--c2)\"/>\u003cline x1=\"578\" y1=\"4\" x2=\"582\" y2=\"136\" stroke=\"var(--c3)\"/>\n        \u003c/g>\n        \u003cg font-family=\"Be Vietnam Pro\" font-size=\"24\" fill=\"var(--text)\" text-anchor=\"middle\">\n          \u003ctext x=\"80\" y=\"162\">cắt nhau\u003c/text>\u003ctext x=\"245\" y=\"162\">song song\u003c/text>\n          \u003ctext x=\"410\" y=\"162\">trùng nhau\u003c/text>\u003ctext x=\"575\" y=\"162\">chéo nhau\u003c/text>\n        \u003c/g>\n        \u003cpath d=\"M10 195 H480\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\u003ctext x=\"245\" y=\"230\" font-size=\"24\" fill=\"var(--ink)\" text-anchor=\"middle\" font-family=\"Be Vietnam Pro\">đồng phẳng\u003c/text>\n        \u003cpath d=\"M505 195 H645\" stroke=\"var(--primary)\" stroke-width=\"3\"/>\u003ctext x=\"575\" y=\"230\" font-size=\"20\" fill=\"var(--primary)\" text-anchor=\"middle\" font-family=\"Be Vietnam Pro\">không đồng phẳng\u003c/text>\n      \u003c/svg>\n      \u003cdiv class=\"box step\" data-step=\"1\">a, b \u003cb>không cùng nằm trong mặt phẳng nào\u003c/b> thì a, b \u003cb>chéo nhau\u003c/b>.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"col\">\n      \u003cdiv class=\"box blue step\" data-step=\"2\">Song song = đồng phẳng + không có điểm chung.\u003c/div>\n      \u003cdiv class=\"box blue step\" data-step=\"3\">Không có điểm chung thì \u003cb>song song hoặc chéo nhau\u003c/b>.\u003c/div>\n      \u003cp class=\"ans step\" data-step=\"4\">(3) và (4) chéo nhau.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 10. Ví dụ 1 -->\n\u003csection class=\"slide\">\n  \u003ch2>Ví dụ 1\u003c/h2>\n  \u003cdiv class=\"row\">\n    \u003cdiv class=\"col w2\">\n      \u003cp>Cho hai hình bình hành ABCD và ABEF không cùng nằm trong một mặt phẳng.\u003c/p>\n      \u003cp class=\"q\">a) Quan sát bốn đường thẳng AB, BC, CD, DA. Chỉ ra các cặp đường thẳng cắt nhau, các cặp đường thẳng song song.\u003c/p>\n      \u003cdiv class=\"box step\" data-step=\"1\">Cắt nhau: AB và BC, AB và DA, BC và CD, CD và DA.\u003cbr>Song song: AB và CD, DA và BC.\u003c/div>\n      \u003cp class=\"q\">b) Trong ba đường thẳng AB, AF, BE có hai đường thẳng nào chéo nhau không?\u003c/p>\n      \u003cdiv class=\"box step\" data-step=\"2\">Không. AB, AF, BE cùng nằm trong mặt phẳng (ABEF) nên không có hai đường thẳng nào chéo nhau.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"col\">\n      \u003cdiv class=\"viewer\" data-scene=\"vd1\">\u003c/div>\n      \u003cdiv class=\"tools\">\u003cbutton data-hl=\"vd1-abef\">Tô (ABEF)\u003c/button>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 11. Luyện tập 1 -->\n\u003csection class=\"slide\">\n  \u003ch2>Luyện tập 1\u003c/h2>\n  \u003cdiv class=\"row\">\n    \u003cdiv class=\"col w2\">\n      \u003cp>Cho hình chóp S.ABCD có đáy ABCD là hình bình hành.\u003c/p>\n      \u003cp class=\"q\">a) Trong các đường thẳng AB, AC, CD, hai đường thẳng nào song song, hai đường thẳng nào cắt nhau?\u003c/p>\n      \u003cdiv class=\"box step\" data-step=\"1\">AB // CD (ABCD là hình bình hành); AB cắt AC tại A; AC cắt CD tại C.\u003c/div>\n      \u003cp class=\"q\">b) Gọi M, N lần lượt là hai điểm thuộc hai cạnh SA, SB. Trong các đường thẳng SA, MN, AB có hai đường thẳng nào chéo nhau không?\u003c/p>\n      \u003cdiv class=\"box step\" data-step=\"2\">M ∈ SA, N ∈ SB nên MN nằm trong (SAB); SA, AB cũng nằm trong (SAB). Vậy không có hai đường thẳng nào chéo nhau.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"col\">\n      \u003cdiv class=\"viewer\" data-scene=\"pyr\">\u003c/div>\n      \u003cdiv class=\"tools\">\u003cbutton data-hl=\"ab-cd\">AB, CD\u003c/button>\u003cbutton data-hl=\"ab-ac\">AB, AC\u003c/button>\u003cbutton data-hl=\"ac-cd\">AC, CD\u003c/button>\u003cbutton data-hl=\"sab\">(SAB)\u003c/button>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 4. Ví dụ 2 -->\n\u003csection class=\"slide\">\n  \u003ch2>Ví dụ 2. Tứ diện ABCD: AB và CD có chéo nhau không?\u003c/h2>\n  \u003cdiv class=\"row\">\n    \u003cdiv class=\"col\">\u003cdiv class=\"viewer\" data-scene=\"tet\">\u003c/div>\n      \u003cdiv class=\"tools\">\u003cbutton id=\"tetTrick\">AB cắt CD?\u003c/button>\u003cbutton id=\"tetReset\">Góc nhìn chuẩn\u003c/button>\u003c/div>\u003c/div>\n    \u003cdiv class=\"col\">\n      \u003col>\n        \u003cli class=\"step\" data-step=\"1\">Giả sử AB, CD đồng phẳng ⇒ A, B, C, D đồng phẳng.\u003c/li>\n        \u003cli class=\"step\" data-step=\"2\">Trái giả thiết ABCD là tứ diện.\u003c/li>\n        \u003cli class=\"step\" data-step=\"3\">Vậy AB và CD \u003cb>chéo nhau\u003c/b>.\u003c/li>\n      \u003c/ol>\n      \u003cdiv class=\"box step\" data-step=\"4\">Tương tự: AC và BD, AD và BC.\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 12. Luyện tập 2 -->\n\u003csection class=\"slide\">\n  \u003ch2>Luyện tập 2\u003c/h2>\n  \u003cdiv class=\"row\">\n    \u003cdiv class=\"col w2\">\n      \u003cp>Trong hình chóp tứ giác S.ABCD, chỉ ra những đường thẳng:\u003c/p>\n      \u003cp class=\"q\">a) Chéo với đường thẳng SA.\u003c/p>\n      \u003cdiv class=\"box step\" data-step=\"1\">BC và CD. Chẳng hạn, nếu SA và BC đồng phẳng thì S thuộc (ABCD): vô lí.\u003c/div>\n      \u003cp class=\"q\">b) Chéo với đường thẳng BC.\u003c/p>\n      \u003cdiv class=\"box step\" data-step=\"2\">SA và SD.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"col\">\n      \u003cdiv class=\"viewer\" data-scene=\"pyr2\">\u003c/div>\n      \u003cdiv class=\"tools\">\u003cbutton data-hl=\"sa-bc\">SA, BC\u003c/button>\u003cbutton data-hl=\"sa-cd\">SA, CD\u003c/button>\u003cbutton data-hl=\"bc-sd\">BC, SD\u003c/button>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 5. Phản biện chatbot -->\n\u003csection class=\"slide\">\n  \u003ch2>Trợ lí AI trả lời. Em có đồng ý không?\u003c/h2>\n  \u003cdiv class=\"row\">\n    \u003cdiv class=\"col w2\">\n      \u003cdiv class=\"chat\">\n        \u003cdiv class=\"bubble\">\n          \u003cspan class=\"claim\" data-claim=\"1\">SA cắt BC\u003c/span>\n          \u003cspan class=\"claim\" data-claim=\"2\">vì trên hình vẽ hai đoạn này giao nhau.\u003c/span>\n          \u003cspan class=\"claim\" data-claim=\"3\">Hai đường thẳng không có điểm chung thì luôn song song.\u003c/span>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"box step\" data-step=\"1\">\u003cb>Sai 1.\u003c/b> SA cắt BC ⇒ S thuộc (ABCD): vô lí. SA và BC \u003cb>chéo nhau\u003c/b>.\u003c/div>\n      \u003cdiv class=\"box step\" data-step=\"2\">\u003cb>Sai 2.\u003c/b> Không có điểm chung: \u003cb>song song hoặc chéo nhau\u003c/b>.\u003c/div>\n      \u003cdiv class=\"box blue step\" data-step=\"3\">Kết quả của AI phải được \u003cb>kiểm chứng\u003c/b>.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"col\">\u003cdiv class=\"viewer\" data-scene=\"pyrTrick\">\u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 6. Trắc nghiệm -->\n\u003csection class=\"slide\" id=\"quizSlide\">\n  \u003cdiv class=\"qz-head\">\u003ch2 id=\"qzTitle\">Câu 1\u003c/h2>\u003cspan class=\"tag\" id=\"qzCount\">\u003c/span>\u003c/div>\n  \u003cp id=\"qzStem\" style=\"font-size:1.05em\">\u003c/p>\n  \u003cdiv class=\"opts\" id=\"qzOpts\">\u003c/div>\n  \u003cdiv class=\"fb\" id=\"qzFb\" aria-live=\"polite\">\u003c/div>\n  \u003cdiv class=\"tools\">\u003cbutton id=\"qzPrev\">Câu trước\u003c/button>\u003cbutton id=\"qzNext\">Câu tiếp\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- 7. Vận dụng -->\n\u003csection class=\"slide\">\n  \u003ch2>Vận dụng 1. Chiếc gậy dựa vào tường\u003c/h2>\n  \u003cdiv class=\"row\">\n    \u003cdiv class=\"col w2\">\n      \u003csvg class=\"zoomable\" viewBox=\"0 0 520 330\" style=\"width:100%;flex:1\" role=\"img\" aria-label=\"Chiếc gậy dựa vào tường\">\n        \u003cg fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"2\">\n          \u003cpath d=\"M120 40 H400 V220 H120 Z\"/>\u003cpath d=\"M20 320 L120 220 M400 220 L500 320 M120 40 L20 0 M400 40 L500 0\"/>\n        \u003c/g>\n        \u003cpath d=\"M120 220 H400 L500 320 H20 Z\" fill=\"var(--line)\" opacity=\".6\"/>\n        \u003cline x1=\"170\" y1=\"300\" x2=\"250\" y2=\"95\" stroke=\"var(--primary)\" stroke-width=\"9\" stroke-linecap=\"round\"/>\n      \u003c/svg>\n    \u003c/div>\n    \u003cdiv class=\"col\">\n      \u003cp>Gậy có song song với mép tường nào không?\u003c/p>\n      \u003cdiv class=\"box step\" data-step=\"1\">\u003cspan class=\"ans\">Không.\u003c/span> Gậy nằm nghiêng; mép tường thẳng đứng hoặc nằm ngang.\u003c/div>\n      \u003cp class=\"q step\" data-step=\"2\">Gậy chéo nhau với mép tường nào?\u003c/p>\n      \u003cdiv class=\"box blue step\" data-step=\"3\">Các mép không có điểm chung với gậy và không cùng mặt phẳng với gậy.\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 8. Tổng kết -->\n\u003csection class=\"slide\">\n  \u003ch2>Không giao nhau chưa chắc đã song song\u003c/h2>\n  \u003cdiv class=\"tree\">\n    \u003cdiv class=\"node\">\u003ch3>Đồng phẳng\u003c/h3>cắt nhau · song song · trùng nhau\u003c/div>\n    \u003cdiv class=\"node\">\u003ch3>Không đồng phẳng\u003c/h3>chéo nhau (chứng minh bằng phản chứng)\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"box step\" data-step=\"1\" style=\"margin-top:.6em\">\u003cb>Về nhà:\u003c/b> bài 4.9, 4.10; Padlet: 2 ảnh – một cặp song song, một cặp chéo nhau.\u003c/div>\n\u003c/section>\n\n\u003cdiv class=\"bar\">\n  \u003cbutton id=\"prevBtn\" aria-label=\"Trang trước\">←\u003c/button>\n  \u003cbutton id=\"nextBtn\" aria-label=\"Bước tiếp\">→\u003c/button>\n  \u003cspan id=\"counter\">\u003c/span>\n  \u003cspan class=\"sp\">\u003c/span>\n  \u003cbutton id=\"themeBtn\">Nền tối\u003c/button>\n  \u003cbutton id=\"fsBtn\">Toàn màn hình\u003c/button>\n\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(() => {\n'use strict';\nconst $ = (s, r = document) => r.querySelector(s);\nconst $$ = (s, r = document) => [...r.querySelectorAll(s)];\nconst css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\n\n/* ================= HÌNH 3D ĐƠN GIẢN ================= */\nconst sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];\nconst add = (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]];\nconst mul = (a, k) => [a[0]*k, a[1]*k, a[2]*k];\nconst cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];\nconst dot = (a, b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];\nconst lerp = (a, b, t) => add(a, mul(sub(b, a), t));\n\nclass Viewer {\n  constructor(el, scene) {\n    this.el = el; this.scene = scene;\n    this.yaw = scene.yaw ?? -0.55; this.pitch = scene.pitch ?? 0.38;\n    this.hl = null;\n    this.svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');\n    this.svg.setAttribute('role', 'img');\n    this.svg.setAttribute('aria-label', scene.label || 'Hình không gian');\n    el.prepend(this.svg);\n    // Kéo = xoay hình; bấm (không kéo) = phóng to / thu lại\n    let drag = null, moved = 0;\n    el.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; moved = 0; el.setPointerCapture(e.pointerId); });\n    el.addEventListener('pointermove', e => {\n      if (!drag) return;\n      const dx = e.clientX - drag[0], dy = e.clientY - drag[1];\n      moved += Math.abs(dx) + Math.abs(dy);\n      this.yaw += dx * 0.01;\n      this.pitch = Math.max(-0.2, Math.min(1.5, this.pitch + dy * 0.01));\n      drag = [e.clientX, e.clientY]; this.draw();\n    });\n    el.addEventListener('pointerup', () => {\n      if (drag && moved \u003c 6) toggleZoom(el);\n      drag = null;\n    });\n    new ResizeObserver(() => this.draw()).observe(el);\n  }\n  view(p) {\n    const cy = Math.cos(this.yaw), sy = Math.sin(this.yaw), cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);\n    const x1 = p[0]*cy - p[1]*sy, y1 = p[0]*sy + p[1]*cy, z1 = p[2];\n    return [x1, y1*cp - z1*sp, y1*sp + z1*cp]; // x, độ sâu, cao\n  }\n  proj(p) {\n    const v = this.view(p), f = 14 / (14 + v[1]);\n    return [this.cx + v[0]*f*this.k, this.cy - v[2]*f*this.k, v[1]];\n  }\n  draw() {\n    const r = this.el.getBoundingClientRect();\n    if (!r.width) return;\n    const W = r.width, H = r.height;\n    this.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);\n    this.k = Math.min(W, H) / (this.scene.size || 7.5);\n    this.cx = W / 2; this.cy = H / 2 + (this.scene.dy || 0) * this.k;\n    const s = this.scene.build(this), out = [];\n    const P = this.scene.pts || s.pts || {};\n    const pt = x => typeof x === 'string' ? P[x] : x;\n    const fs = Math.max(13, Math.min(W, H) / 22);\n    // mặt phẳng\n    (s.polys || []).forEach(o => {\n      const d = o.pts.map(q => this.proj(pt(q))).map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');\n      out.push(`\u003cpolygon points=\"${d}\" fill=\"${o.fill}\" fill-opacity=\"${o.op ?? .18}\" stroke=\"${o.fill}\" stroke-opacity=\".6\" stroke-width=\"1.5\"/>`);\n      if (o.label) { const q = this.proj(pt(o.labelAt || o.pts[1])); out.push(`\u003ctext x=\"${q[0]+6}\" y=\"${q[1]+fs}\" font-size=\"${fs}\" fill=\"${o.fill}\" font-style=\"italic\">${o.label}\u003c/text>`); }\n    });\n    // khối đa diện: cạnh khuất nét đứt\n    if (s.solid) {\n      const sol = s.solid, cen = mul(Object.values(sol.v).reduce(add, [0,0,0]), 1 / Object.keys(sol.v).length);\n      const front = sol.faces.map(f => {\n        const a = this.view(P[f[0]]), b = this.view(P[f[1]]), c = this.view(P[f[2]]);\n        let n = cross(sub(b, a), sub(c, a));\n        const fc = mul(f.map(x => this.view(P[x])).reduce(add, [0,0,0]), 1 / f.length);\n        if (dot(n, sub(fc, this.view(cen))) \u003c 0) n = mul(n, -1);\n        // vector từ mặt tới camera (camera ở độ sâu -14)\n        const toCam = sub([0, -14, 0], fc);\n        return dot(n, toCam) > 0;\n      });\n      const edges = new Map();\n      sol.faces.forEach((f, i) => f.forEach((x, j) => {\n        const y = f[(j + 1) % f.length], key = [x, y].sort().join('');\n        if (!edges.has(key)) edges.set(key, { a: x, b: y, vis: false });\n        if (front[i]) edges.get(key).vis = true;\n      }));\n      edges.forEach(e => {\n        const a = this.proj(P[e.a]), b = this.proj(P[e.b]);\n        out.push(`\u003cline x1=\"${a[0]}\" y1=\"${a[1]}\" x2=\"${b[0]}\" y2=\"${b[1]}\" stroke=\"${css('--text')}\" stroke-width=\"2\" ${e.vis ? '' : 'stroke-dasharray=\"7 6\" stroke-opacity=\".75\"'}/>`);\n      });\n    }\n    // đoạn và đường thẳng\n    (s.segs || []).forEach(o => {\n      let a = pt(o.a), b = pt(o.b);\n      if (o.ext) { const d = sub(b, a); a = add(a, mul(d, -o.ext)); b = add(b, mul(d, o.ext)); }\n      const A = this.proj(a), B = this.proj(b);\n      out.push(`\u003cline x1=\"${A[0]}\" y1=\"${A[1]}\" x2=\"${B[0]}\" y2=\"${B[1]}\" stroke=\"${o.color || css('--text')}\" stroke-width=\"${o.w || 2}\" stroke-linecap=\"round\" ${o.dash ? `stroke-dasharray=\"${o.dash}\"` : ''} ${o.op ? `stroke-opacity=\"${o.op}\"` : ''}/>`);\n      if (o.label) { const q = this.proj(o.labelAt ? pt(o.labelAt) : b); out.push(`\u003ctext x=\"${q[0]+8}\" y=\"${q[1]-6}\" font-size=\"${fs*1.05}\" font-weight=\"700\" fill=\"${o.color}\">${o.label}\u003c/text>`); }\n    });\n    // nhãn điểm\n    const names = s.labels || [];\n    if (names.length) {\n      const c2 = names.map(n => this.proj(P[n])), mx = c2.reduce((s, q) => s + q[0], 0) / c2.length, my = c2.reduce((s, q) => s + q[1], 0) / c2.length;\n      names.forEach((n, i) => {\n        const q = c2[i]; let dx = q[0] - mx, dy = q[1] - my; const L = Math.hypot(dx, dy) || 1;\n        dx = dx / L * fs * .95; dy = dy / L * fs * .95;\n        out.push(`\u003ccircle cx=\"${q[0]}\" cy=\"${q[1]}\" r=\"3.5\" fill=\"${css('--text')}\"/>`);\n        out.push(`\u003ctext x=\"${q[0]+dx}\" y=\"${q[1]+dy+fs*.35}\" font-size=\"${fs}\" text-anchor=\"middle\" fill=\"${css('--text')}\" font-weight=\"600\">${n}\u003c/text>`);\n      });\n    }\n    this.svg.innerHTML = out.join('');\n  }\n}\n\n/* ---------- các cảnh ---------- */\nconst scenes = {};\nscenes.junction = {\n  label: 'Bốn tuyến đường ở nút giao', size: 8, dy: .4, yaw: -0.7, pitch: 0.45,\n  build() {\n    const L = 3.4, segs = [];\n    // trụ đỡ\n    for (let t = -3; t \u003c= 3; t += 1.5) {\n      segs.push({ a: [t, 0, 0], b: [t, 0, 2.2], color: css('--muted'), w: 1.5, op: .6 });\n      segs.push({ a: [0, t, 0], b: [0, t, 1.1], color: css('--muted'), w: 1.5, op: .6 });\n    }\n    segs.push({ a: [-L, 0, 0], b: [L, 0, 0], color: css('--c1'), w: 5, label: '(1)' });\n    segs.push({ a: [0, -L, 0], b: [0, L, 0], color: css('--c2'), w: 5, label: '(2)' });\n    segs.push({ a: [0, -L, 1.1], b: [0, L, 1.1], color: css('--c3'), w: 5, label: '(3)' });\n    segs.push({ a: [-L, 0, 2.2], b: [L, 0, 2.2], color: css('--c4'), w: 5, label: '(4)', labelAt: [-L, 0, 2.2] });\n    return {\n      polys: [{ pts: [[-L, -L, 0], [L, -L, 0], [L, L, 0], [-L, L, 0]], fill: css('--muted'), op: .08 }],\n      segs\n    };\n  }\n};\n\nlet K = 1, showPlane = true;\nscenes.explore = {\n  label: 'Hai đường thẳng a và b', size: 8, yaw: -0.5, pitch: 0.45,\n  build() {\n    const a1 = [-3.2, -0.7, 0], a2 = [3.2, -0.7, 0];\n    let b1, b2, extra = [];\n    if (K === 1) { const M = [0.3, -0.7, 0], d = [1.1, 1.4, 0]; b1 = add(M, mul(d, -1)); b2 = add(M, mul(d, 1.2)); extra = [{ a: M, b: M, color: css('--text'), w: 8 }]; }\n    if (K === 2) { b1 = [-3.2, 1, 0]; b2 = [3.2, 1, 0]; }\n    if (K === 3) { b1 = a1; b2 = a2; }\n    if (K === 4) { b1 = [0.6, -2.4, 1.7]; b2 = [0.6, 2.4, 1.7]; }\n    return {\n      polys: showPlane ? [{ pts: [[-3.6, -2.6, 0], [3.6, -2.6, 0], [3.6, 2.6, 0], [-3.6, 2.6, 0]], fill: css('--plane'), label: 'α', labelAt: [3.6, -2.6, 0] }] : [],\n      segs: [\n        { a: a1, b: a2, color: css('--c2'), w: 5, label: 'a' },\n        { a: b1, b: b2, color: css('--c3'), w: K === 3 ? 3 : 5, dash: K === 3 ? '10 8' : '', label: 'b', labelAt: K === 3 ? a1 : b2 },\n        ...extra\n      ]\n    };\n  }\n};\nconst kText = {\n  1: 'a và b có đúng một điểm chung và cùng nằm trong (α): \u003cb>cắt nhau\u003c/b>, a ∩ b = {M}.',\n  2: 'a và b cùng nằm trong (α) và không có điểm chung: \u003cb>song song\u003c/b>, a // b.',\n  3: 'a và b có vô số điểm chung: \u003cb>trùng nhau\u003c/b>, a ≡ b.',\n  4: 'a và b không có điểm chung, và không có mặt phẳng nào chứa cả hai: \u003cb>chéo nhau\u003c/b>.'\n};\n\nconst VD = (() => {\n  const A = [-1.6, -0.9, 0], B = [1.6, -0.9, 0], v = [0.7, 2.2, 0], w = [0.3, -0.6, 2.1];\n  return { A, B, C: add(B, v), D: add(A, v), E: add(B, w), F: add(A, w) };\n})();\nlet vd1Plane = false;\nscenes.vd1 = {\n  label: 'Hai hình bình hành ABCD và ABEF', pts: VD, size: 7, yaw: -0.4, pitch: 0.42,\n  build() {\n    return {\n      polys: [{ pts: ['A', 'B', 'C', 'D'], fill: css('--plane'), op: .15 }, { pts: ['A', 'B', 'E', 'F'], fill: css('--plane2'), op: vd1Plane ? .4 : .12 }],\n      segs: [['A','B'],['B','C'],['C','D'],['D','A'],['B','E'],['E','F'],['F','A']].map(([a, b]) => ({ a, b, w: 2.2 })),\n      labels: ['A', 'B', 'C', 'D', 'E', 'F']\n    };\n  }\n};\n\nconst TET = { A: [0.1, 0.1, 2.7], B: [-1.8, -1.1, 0], C: [1.9, -0.9, 0], D: [0.3, 1.8, 0] };\nscenes.tet = {\n  label: 'Tứ diện ABCD', pts: TET, size: 6.5, yaw: -0.35, pitch: 0.3, dy: .35,\n  build() {\n    return {\n      solid: { v: TET, faces: [['A','B','C'], ['A','C','D'], ['A','D','B'], ['B','D','C']] },\n      segs: [{ a: 'A', b: 'B', color: css('--c2'), w: 4 }, { a: 'C', b: 'D', color: css('--c3'), w: 4 }],\n      labels: ['A', 'B', 'C', 'D']\n    };\n  }\n};\n\nconst PY = (() => {\n  const A = [-1.9, -1.2, 0], B = [1.5, -1.2, 0], C = [2.0, 1.2, 0], D = [-1.4, 1.2, 0], S = [-0.3, -0.1, 2.9];\n  return { A, B, C, D, S, M: lerp(S, A, 0.42), N: lerp(S, B, 0.45) };\n})();\nconst pyrHL = {\n  'ab-cd': [['A','B','--c2'], ['C','D','--c3']],\n  'ab-ac': [['A','B','--c2'], ['A','C','--c4']],\n  'ac-cd': [['A','C','--c4'], ['C','D','--c3']],\n  'sab':   [['S','A','--c2'], ['M','N','--c4'], ['A','B','--c3']],\n  'sa-bc': [['S','A','--c2'], ['B','C','--c3']],\n  'sa-cd': [['S','A','--c2'], ['C','D','--c3']],\n  'bc-sd': [['B','C','--c3'], ['S','D','--c2']]\n};\nfunction pyrBuild(viewer) {\n  const segs = [{ a: 'A', b: 'C', color: css('--muted'), w: 1.5, dash: '4 5' }, { a: 'M', b: 'N', w: 2 }];\n  const polys = [];\n  (pyrHL[viewer.hl] || []).forEach(([a, b, c]) => segs.push({ a, b, color: css(c), w: 4.5, ext: .45 }));\n  if (viewer.hl === 'sab') polys.push({ pts: ['S', 'A', 'B'], fill: css('--plane2'), op: .3 });\n  return {\n    polys,\n    solid: { v: { S: PY.S, A: PY.A, B: PY.B, C: PY.C, D: PY.D }, faces: [['S','A','B'], ['S','B','C'], ['S','C','D'], ['S','D','A'], ['A','D','C','B']] },\n    segs, labels: ['S', 'A', 'B', 'C', 'D', 'M', 'N']\n  };\n}\nscenes.pyr = { label: 'Hình chóp S.ABCD', pts: PY, size: 7, yaw: -0.45, pitch: 0.3, dy: .3, build: pyrBuild };\nscenes.pyr2 = { label: 'Hình chóp S.ABCD', pts: PY, size: 7, yaw: -0.45, pitch: 0.3, dy: .3, build: pyrBuild };\nscenes.pyrTrick = { label: 'Hình chóp S.ABCD, góc nhìn dễ nhầm', pts: PY, size: 7, dy: .3, build: v => { v.hl = 'sa-bc'; return pyrBuild(v); } };\n\n/* tìm góc nhìn mà hai đoạn thẳng \"trông như\" cắt nhau trên hình phẳng */\nfunction crossView(viewer, P, a, b, c, d) {\n  const inter = (p1, p2, p3, p4) => {\n    const o = (p, q, r) => Math.sign((q[0]-p[0])*(r[1]-p[1]) - (q[1]-p[1])*(r[0]-p[0]));\n    return o(p1, p2, p3) * o(p1, p2, p4) \u003c 0 && o(p3, p4, p1) * o(p3, p4, p2) \u003c 0;\n  };\n  viewer.k = 1; viewer.cx = 0; viewer.cy = 0;\n  let best = null;\n  for (let pitch = 0.15; pitch \u003c= 1.2; pitch += 0.05)\n    for (let yaw = -Math.PI; yaw \u003c Math.PI; yaw += 0.05) {\n      viewer.yaw = yaw; viewer.pitch = pitch;\n      if (inter(viewer.proj(P[a]), viewer.proj(P[b]), viewer.proj(P[c]), viewer.proj(P[d]))) {\n        const score = Math.abs(pitch - 0.35) + Math.abs(yaw + 0.5) * 0.3;\n        if (!best || score \u003c best.s) best = { yaw, pitch, s: score };\n      }\n    }\n  return best;\n}\n\nfunction toggleZoom(el) {\n  const on = !el.classList.contains('zoomed');\n  $$('.zoomed').forEach(v => v.classList.remove('zoomed'));\n  if (on) el.classList.add('zoomed');\n}\nfunction unzoom() { $$('.zoomed').forEach(v => v.classList.remove('zoomed')); }\n\nconst viewers = {};\n$$('.viewer').forEach(el => { viewers[el.dataset.scene] = new Viewer(el, scenes[el.dataset.scene]); });\nconst trick = crossView(viewers.pyrTrick, PY, 'S', 'A', 'B', 'C');\nif (trick) { viewers.pyrTrick.yaw = trick.yaw; viewers.pyrTrick.pitch = trick.pitch; }\nconst tetTrick = crossView(viewers.tet, TET, 'A', 'B', 'C', 'D');\nviewers.tet.yaw = scenes.tet.yaw; viewers.tet.pitch = scenes.tet.pitch;\n\n/* ================= TRẮC NGHIỆM ================= */\nconst quiz = [\n  { stem: 'Hai đường thẳng không có điểm chung thì', opts: ['song song.', 'chéo nhau.', 'song song hoặc chéo nhau.', 'cắt nhau.'], ans: 2,\n    fb: ['Còn trường hợp chéo nhau: không có điểm chung nhưng không cùng nằm trong một mặt phẳng.', 'Hai đường thẳng song song cũng không có điểm chung.', 'Đúng. Chỉ khi biết thêm hai đường thẳng đồng phẳng mới kết luận được song song.', 'Cắt       ${typeof BaiHoc !== 'undefined' ? `<a class="card grade-card bh-hero" href="#/bai-hoc"><span class="g-big">📚</span><span class="g-body"><b>Bài giảng – Luyện tập online</b>
        <span>Lớp 9 · 10 · 11 · 12 · học theo mục lục SGK Toán Kết nối tri thức: bài giảng ngắn, ví dụ có lời giải, luyện trắc nghiệm – đúng sai – trả lời ngắn chấm ngay</span>

        ${typeof Van !== 'undefined' ? card('#/van-10', '📖', 'Ngữ văn vào lớp 10', 'Lớp 9 · Đọc hiểu 6 điểm + Viết 4 điểm · học sinh lực học trung bình', Van.list().length ? `<span class="chip ok">${Van.list().length} đề</span>` : '<span class="chip">Đang soạn</span>') : ''}</div>

  /* ---------- Trang chủ Ôn thi vào 10 (#/vao-10) ---------- */
  function home() {
    const topics = Topics.list;
    const cards = topics.map(t => {
      const p = prog(t.id), q = t.quiz.length;
      const chips = [
        p.read ? '<span class="chip ok">📘 Đã học</span>' : '',
        p.quiz !== undefined ? `<span class="chip ${p.quiz === q ? 'ok' : ''}">✅ ${p.quiz}/${q}</span>` : '',
        p.model ? '<span class="chip ok">✍️ Đã xem mẫu</span>' : '',
        p.printed ? '<span class="chip ok">🖨️ Đã in</span>' : '',
      ].join('');
      return `<a class="tcard" href="#/cd/${t.id}/lt"><span class="tno">${t.no}</span>
        <span class="tbody"><span class="tbai">${esc(t.bai)}</span><span class="ttitle">${t.title}</span>
        <span class="tdesc">${t.desc}</span><span class="chips">${chips}</span></span></a>`;

      <td>${ids.map(id => { const t = Topics.get(id); return t ? `<a href="#/cd/${id}/lt">Chủ đề ${t.no}</a>` : ''; }).join(' · ')}</td></tr>`).join('');
    view().innerHTML = `${topBar()}<main class="wrap"><div class="toolbar"><a class="back" href="#/">← Chọn lớp</a></div>
      <section class="hero card"><p class="pill">🎯 ${esc(CONFIG.examLine)}</p>
        <h2>Mỗi chủ đề học theo 6 bước</h2>
        <ol class="steps6"><li>📘 Đọc <b>lý thuyết</b></li><li>💡 Thuộc <b>mẹo nhớ</b></li><li>✅ Làm <b>trắc nghiệm hiểu bài</b></li>
        <li>✍️ Xem <b>bài tự luận mẫu</b> và barem</li><li>🖨️ <b>In phiếu</b>, tự làm trên giấy</li><li>🤖 Chụp ảnh, <b>nhờ AI nhận xét</b></li></ol>
        <p class="hint-line">Vùng an toàn 7 điểm: Bài 1–5 và câu 7a. Học chắc phần này trước, rồi mới chinh phục Bài 6, 7b, 7c.</p>
      </section>
      <h2 class="sec">Cấu trúc đề thi (thống nhất 2026 – 2027)</h2>
      <div class="card table-wrap"><table class="struct"><thead><tr><th>Bài</th><th>Điểm</th><th>Nội dung</th><th>Học ở</th></tr></thead><tbody>${rows}</tbody></table></div>
      <h2 class="sec">10 chủ đề luyện thi</h2>
      <div class="tgrid">${cards}</div>
      <div class="two">
        <a class="card link-card" href="#/cd/kien-thuc-thong-nhat/lt"><span class="big">📜</span><b>Luật chơi</b><span>Kiến thức được dùng ngay và phải chứng minh lại</span></a>
        <a class="card link-card" href="#/lo-trinh"><span class="big">📅</span><b>Lộ trình 26 tuần</b><span>30/11/2026 – 30/5/2027, tuần nào học chủ đề nào</span></a>
      </div>
      <a class="card link-card" href="#/on-tap"><span class="big">🗂️</span><b>Phiếu ôn tập 90 phút theo chủ đề</b><span>Từ cơ bản đến nâng cao, mỗi đợt một phiếu mới${typeof OnTap !== 'undefined' && OnTap.list().length ? ` · ${OnTap.list().length} phiếu` : ''}</span></a></main>`;
  }

  /* ---------- Lộ trình ---------- */
  function roadmap() {
    const body = ROADMAP.map(([gd, weeks]) => `<h2 class="sec">${esc(gd)}</h2><div class="card table-wrap"><table class="struct">
      <thead><tr><th>Tuần</th><th>Thời gian</th><th>Học gì</th><th>Chủ đề</th></tr></thead><tbody>${weeks.map(([n, d, w, id]) => {
